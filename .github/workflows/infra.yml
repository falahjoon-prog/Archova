# Infrastructure checks (infrastructure/03 §3 "Security", §7). Runs on every PR that touches Terraform or the
# egress allow-list. Plans and applies need the AWS accounts and OIDC roles; until those exist (repository
# variable INFRA_AWS_READY = true), only the account-free checks run.
name: Infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'tools/infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'tools/infra/**'
      - '.github/workflows/infra.yml'
  schedule:
    - cron: '0 17 * * *' # 3-4am Sydney: drift detection
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: 'true'
  CHECKPOINT_DISABLE: '1'

jobs:
  static:
    name: Terraform fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: terraform -chdir=infra fmt -check -recursive -diff
      - name: validate every root stack
        run: |
          for dir in infra/envs/* infra/org; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: checkov
        working-directory: infra
        run: |
          pip install --quiet 'checkov==3.*'
          checkov -d . --config-file .checkov.yaml --compact --quiet --skip-download

  egress:
    name: Egress allow-list (X25)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:egress

  plan:
    name: Plan ${{ matrix.env }}
    needs: [static, egress]
    if: vars.INFRA_AWS_READY == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: dev, vars: DEV }
          - { env: staging, vars: STAGING }
          - { env: prod-cell1, vars: PROD }
    env:
      TF_VAR_account_id: ${{ vars[format('AWS_ACCOUNT_{0}', matrix.vars)] }}
      TF_VAR_dns_zone_id: ${{ vars[format('DNS_ZONE_{0}', matrix.vars)] }}
      TF_VAR_image_registry: ${{ vars.IMAGE_REGISTRY }}
      TF_VAR_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_dns_role_arn: ${{ vars.DNS_PROD_ROLE_ARN }}
      TF_VAR_backup_vault_arns: ${{ vars.BACKUP_VAULT_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_PLAN_ROLE_{0}', matrix.vars)] }}
          aws-region: ap-southeast-2
      - name: plan
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          set +e
          terraform plan -input=false -lock-timeout=5m -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$code" -eq 2 ]; then
            echo "::error::Drift detected in ${{ matrix.env }}"
            exit 1
          fi
      - name: Post plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/${{ matrix.env }}/plan.txt', 'utf8');
            const body = `### Terraform plan: \`${{ matrix.env }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  # Merge to main applies dev, then staging and prod after approval on their GitHub environments
  # (dev-infra, staging-infra, prod-infra). The org layer is applied by hand (infrastructure/03 §7).
  apply:
    name: Apply ${{ matrix.env }}
    needs: [static, egress]
    if: vars.INFRA_AWS_READY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { env: dev, vars: DEV, environment: dev-infra }
          - { env: staging, vars: STAGING, environment: staging-infra }
          - { env: prod-cell1, vars: PROD, environment: prod-infra }
    env:
      TF_VAR_account_id: ${{ vars[format('AWS_ACCOUNT_{0}', matrix.vars)] }}
      TF_VAR_dns_zone_id: ${{ vars[format('DNS_ZONE_{0}', matrix.vars)] }}
      TF_VAR_image_registry: ${{ vars.IMAGE_REGISTRY }}
      TF_VAR_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_dns_role_arn: ${{ vars.DNS_PROD_ROLE_ARN }}
      TF_VAR_backup_vault_arns: ${{ vars.BACKUP_VAULT_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_APPLY_ROLE_{0}', matrix.vars)] }}
          aws-region: ap-southeast-2
      - name: apply
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -lock-timeout=5m -auto-approve
