# Infrastructure checks (infrastructure/03 §3 "Security", §7). Runs on every PR that touches Terraform or the
# egress allow-list. Plans and applies need the AWS accounts and OIDC roles; until those exist (repository
# variable INFRA_AWS_READY = true), only the account-free checks run.
name: Infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'tools/infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'tools/infra/**'
      - '.github/workflows/infra.yml'
  schedule:
    - cron: '0 17 * * *' # 3-4am Sydney: drift detection
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel a run on main: each push to main must finish its own full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: 'true'
  CHECKPOINT_DISABLE: '1'

jobs:
  static:
    name: Terraform fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: terraform -chdir=infra fmt -check -recursive -diff
      - name: validate every root stack
        run: |
          for dir in infra/envs/* infra/org; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: checkov
        working-directory: infra
        run: |
          pip install --quiet 'checkov==3.*'
          checkov -d . --config-file .checkov.yaml --compact --quiet --skip-download

  egress:
    name: Egress allow-list (X25)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:egress

  # The Linode option's server bundle (infra/envs/linode-pilot/host): lint and build its two images, check the compose
  # file and Caddyfile, and prove the allow-list resolver answers listed hosts and blocks AI vendors (X25).
  linode-host:
    name: Linode host bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/envs/linode-pilot/host
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: infra/envs/linode-pilot/host/backup/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: infra/envs/linode-pilot/host/signing-helper/Dockerfile
          failure-threshold: warning
      - name: shellcheck
        run: shellcheck backup/backup.sh ../../../../tools/infra/linode-deploy.sh ../../../../tools/infra/linode-cert.sh
      - name: Build the backup and signing-helper images
        run: |
          docker build -t archova/backup:ci backup
          docker build -t archova/aws-signing-helper:ci signing-helper
          docker run --rm --entrypoint sh archova/backup:ci -c 'pg_dump --version && age --version && rclone version | head -1 && /usr/bin/supercronic -test /etc/crontab'
          docker run --rm archova/aws-signing-helper:ci version
      - name: Compose file and Caddyfile
        run: |
          sudo mkdir -p /etc/archova
          for f in api web worker ai-worker backup valkey migrate db-roles roles-anywhere; do sudo touch "/etc/archova/$f.env"; done
          export VPC_IP=10.60.1.10 APP_HOST=app.example API_HOST=api.example IMAGE_TAG=ci \
            RA_TRUST_ANCHOR_ARN=t RA_PROFILE_ARN=p RA_ROLE_ARN=r
          docker compose --profile primary --profile tools config -q
          # A second server gets no Valkey, backup or database admin files.
          sudo rm /etc/archova/{backup,valkey,db-roles,worker,ai-worker}.env
          docker compose --profile secondary config -q
          docker run --rm -e APP_HOST=app.example -e API_HOST=api.example -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Allow-list resolver
        run: |
          pnpm -s infra:linode-corefile > /tmp/Corefile
          docker network create --subnet 172.30.0.0/24 dnstest
          docker run -d --name coredns --network dnstest --ip 172.30.0.53 -v /tmp/Corefile:/etc/coredns/Corefile:ro \
            coredns/coredns:1.12.4 -conf /etc/coredns/Corefile
          sleep 2
          docker run --rm --network dnstest --dns 172.30.0.53 alpine:3.22 sh -c '
            nslookup bedrock-runtime.ap-southeast-2.amazonaws.com >/dev/null || { echo "Bedrock Sydney should resolve"; exit 1; }
            for h in api.openai.com api.anthropic.com example.com; do
              if nslookup "$h" >/dev/null 2>&1; then echo "$h should be blocked"; exit 1; fi
            done
            echo "allow-list resolver OK"'

  # Plans and applies need only the account ids as repository variables (AWS_ACCOUNT_SHARED, AWS_ACCOUNT_DEMO,
  # AWS_ACCOUNT_DEV, ...): roles come from infra/bootstrap/github-actions.yaml and every other name is derived from
  # the shared-services account id. An environment whose account variable is unset is skipped.
  plan:
    name: Plan ${{ matrix.env }}
    needs: [static, egress]
    if: vars.INFRA_AWS_READY == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: shared-services, vars: SHARED }
          - { env: demo, vars: DEMO }
          - { env: dev, vars: DEV }
          - { env: staging, vars: STAGING }
          - { env: prod-cell1, vars: PROD }
    env:
      ACCOUNT: ${{ vars[format('AWS_ACCOUNT_{0}', matrix.vars)] }}
      SHARED: ${{ vars.AWS_ACCOUNT_SHARED }}
      TF_VAR_account_id: ${{ vars[format('AWS_ACCOUNT_{0}', matrix.vars)] }}
      TF_VAR_dns_zone_id: ${{ vars[format('DNS_ZONE_{0}', matrix.vars)] }}
      TF_VAR_image_registry: ${{ vars.AWS_ACCOUNT_SHARED }}.dkr.ecr.ap-southeast-2.amazonaws.com
      TF_VAR_dns_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_SHARED }}:role/archova-shared-dns-records
      TF_VAR_backup_vault_arns: ${{ vars.BACKUP_VAULT_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@v4
        if: env.ACCOUNT != ''
      - uses: hashicorp/setup-terraform@v3
        if: env.ACCOUNT != ''
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.ACCOUNT != ''
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/archova-github-terraform-plan
          aws-region: ap-southeast-2
      - name: derived settings
        if: env.ACCOUNT != ''
        run: |
          echo "TF_STATE_BUCKET=archova-shared-tfstate-${SHARED:6:6}" >> "$GITHUB_ENV"
          echo "TF_VAR_workload_accounts=$(jq -cn \
            --arg dev '${{ vars.AWS_ACCOUNT_DEV }}' --arg staging '${{ vars.AWS_ACCOUNT_STAGING }}' \
            --arg prod '${{ vars.AWS_ACCOUNT_PROD }}' --arg demo '${{ vars.AWS_ACCOUNT_DEMO }}' \
            '{dev: $dev, staging: $staging, "prod-cell1": $prod, demo: $demo} | with_entries(select(.value != ""))')" >> "$GITHUB_ENV"
      - name: plan
        if: env.ACCOUNT != ''
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "::notice::No state bucket yet: the first apply of shared-services creates it."
            exit 0
          fi
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          set +e
          terraform plan -input=false -lock-timeout=5m -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$code" -eq 2 ]; then
            echo "::error::Drift detected in ${{ matrix.env }}"
            exit 1
          fi
      - name: Post plan on the PR
        if: env.ACCOUNT != '' && github.event_name == 'pull_request' && hashFiles(format('infra/envs/{0}/plan.txt', matrix.env)) != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/${{ matrix.env }}/plan.txt', 'utf8');
            const body = `### Terraform plan: \`${{ matrix.env }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  # Merge to main applies each environment after approval on its GitHub environment <env>-infra (create them with
  # john as required reviewer before setting INFRA_AWS_READY). shared-services goes first: it holds the state
  # bucket, the image registry and the apex DNS zone. The org layer is applied by hand (infrastructure/03 §7).
  apply:
    name: Apply ${{ matrix.env }}
    needs: [static, egress]
    if: vars.INFRA_AWS_READY == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ matrix.env }}-infra
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { env: shared-services, vars: SHARED }
          - { env: demo, vars: DEMO }
          - { env: dev, vars: DEV }
          - { env: staging, vars: STAGING }
          - { env: prod-cell1, vars: PROD }
    env:
      ACCOUNT: ${{ vars[format('AWS_ACCOUNT_{0}', matrix.vars)] }}
      SHARED: ${{ vars.AWS_ACCOUNT_SHARED }}
      TF_VAR_account_id: ${{ vars[format('AWS_ACCOUNT_{0}', matrix.vars)] }}
      TF_VAR_dns_zone_id: ${{ vars[format('DNS_ZONE_{0}', matrix.vars)] }}
      TF_VAR_image_registry: ${{ vars.AWS_ACCOUNT_SHARED }}.dkr.ecr.ap-southeast-2.amazonaws.com
      TF_VAR_dns_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_SHARED }}:role/archova-shared-dns-records
      TF_VAR_backup_vault_arns: ${{ vars.BACKUP_VAULT_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@v4
        if: env.ACCOUNT != ''
      - uses: hashicorp/setup-terraform@v3
        if: env.ACCOUNT != ''
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.ACCOUNT != ''
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/archova-github-terraform-apply
          aws-region: ap-southeast-2
      - name: derived settings
        if: env.ACCOUNT != ''
        run: |
          echo "TF_STATE_BUCKET=archova-shared-tfstate-${SHARED:6:6}" >> "$GITHUB_ENV"
          echo "TF_VAR_workload_accounts=$(jq -cn \
            --arg dev '${{ vars.AWS_ACCOUNT_DEV }}' --arg staging '${{ vars.AWS_ACCOUNT_STAGING }}' \
            --arg prod '${{ vars.AWS_ACCOUNT_PROD }}' --arg demo '${{ vars.AWS_ACCOUNT_DEMO }}' \
            '{dev: $dev, staging: $staging, "prod-cell1": $prod, demo: $demo} | with_entries(select(.value != ""))')" >> "$GITHUB_ENV"
      - name: apply
        if: env.ACCOUNT != ''
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          # First run of shared-services: the state bucket doesn't exist yet. Apply with local state, then move the
          # state into the bucket that apply created.
          if [ "${{ matrix.env }}" = "shared-services" ] && ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            terraform init -input=false -backend=false
            terraform apply -input=false -auto-approve
            terraform init -input=false -migrate-state -force-copy -backend-config="bucket=$TF_STATE_BUCKET"
            exit 0
          fi
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          terraform apply -input=false -lock-timeout=5m -auto-approve
