# Pull request checks (infrastructure/03 §3). Deploy, image build, preview and security scanning stages are
# added by DevOps on top of this.
name: CI

# Docs-only pull requests skip this workflow (Actions minutes); every push to main still runs it.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Generated contracts are up to date
        run: pnpm gen:check
      - name: Composed migrations are up to date
        run: pnpm db:compose:check
      - name: Migration static lint
        run: pnpm db:lint --static-only
      - name: Workspace boundaries
        run: pnpm check:boundaries
      - name: Nova evals (fake provider; schema, citation and safety bars gate, ai/06 §4)
        run: pnpm --filter @archova/mod-ai eval
      - name: Lint, typecheck, unit tests, build
        run: pnpm turbo run lint typecheck test build

  integration:
    name: Integration tests (Postgres + Valkey, RLS on)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Postgres 16 with pgvector (Nova retrieval, ai/03 §5), same as docker-compose.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate an empty database and lint RLS
        run: |
          pnpm db:bootstrap
          pnpm db:migrate
          pnpm db:lint
      - name: Migrations are re-runnable
        run: pnpm db:migrate
      - name: Integration tests (includes cross-tenant leakage tests)
        run: pnpm test:integration
