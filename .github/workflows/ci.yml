# Pull request checks (infrastructure/03 §3). Deploy, image build, preview and security scanning stages are
# added by DevOps on top of this.
name: CI

# Docs-only pull requests skip this workflow (Actions minutes); every push to main still runs it. On a pull request,
# turbo lints, typechecks, tests and builds only the packages the diff touches (and what depends on them), the Nova
# evals run only when Nova's code changed, and the Postgres integration job runs only when backend code or the
# database changed. A change to the lockfile, root config or this workflow runs everything. Skipped jobs report as
# passed, so they do not block a required check.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]

# Runner choice: unset repo variables mean GitHub-hosted runners. Setting CI_RUNNER (and CI_RUNNER_INTEGRATION for the
# job that publishes fixed Postgres/Valkey ports) to a JSON label array, e.g. ["self-hosted","archova"], moves the jobs
# to the self-hosted runner (scripts/ci/setup-selfhosted-runner.sh). Delete the variables to fall back instantly.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel a run on main: each push to main must finish its own full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      all: ${{ steps.scope.outputs.all }}
      backend: ${{ steps.scope.outputs.backend }}
      ai: ${{ steps.scope.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"; echo "backend=true" >> "$GITHUB_OUTPUT"; echo "ai=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$files"
          any() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          # Root config, the lockfile and this workflow can change any package: run everything.
          echo "all=$(any '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.nvmrc|tsconfig[^/]*\.json|\.github/workflows/ci\.yml|packages/config-[^/]+/)')" >> "$GITHUB_OUTPUT"
          # Anything the api, worker or realtime service builds on, and the database.
          echo "backend=$(any '^(modules/|apps/(api|worker|realtime)/|db/|packages/(kernel|domain|compose|contracts|time|testing)/)')" >> "$GITHUB_OUTPUT"
          echo "ai=$(any '^(modules/ai/|packages/ai-prompts/)')" >> "$GITHUB_OUTPUT"

  # The old single job hit its 20-minute limit on main and on pull requests. It is now three jobs that run side by
  # side, each with its own turbo cache, and `checks` below keeps the original name so the required check holds.
  static:
    name: Static checks (format, lint, typecheck)
    needs: changes
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: static
      - name: Format
        run: pnpm format:check
      - name: Generated contracts are up to date
        run: pnpm gen:check
      - name: Composed migrations are up to date
        run: pnpm db:compose:check
      - name: Migration static lint
        run: pnpm db:lint --static-only
      - name: Workspace boundaries
        run: pnpm check:boundaries
      - name: Nova evals (fake provider; schema, citation and safety bars gate, ai/06 §4)
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.ai == 'true' || github.event_name == 'push'
        run: pnpm --filter @archova/mod-ai eval
      - name: Lint and typecheck
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALL: ${{ needs.changes.outputs.all }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$ALL" != "true" ]; then
            pnpm turbo run lint typecheck --filter="...[$BASE_SHA]"
          else
            pnpm turbo run lint typecheck
          fi

  unit:
    name: Unit tests
    needs: changes
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: unit
      - name: Unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALL: ${{ needs.changes.outputs.all }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$ALL" != "true" ]; then
            pnpm turbo run test --filter="...[$BASE_SHA]"
          else
            pnpm turbo run test
          fi

  build:
    name: Build
    needs: changes
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      # Next.js keeps its compiler cache outside the turbo outputs; restoring it makes an unchanged app build fast.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ github.sha }}
          restore-keys: next-
      - name: Build
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALL: ${{ needs.changes.outputs.all }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$ALL" != "true" ]; then
            pnpm turbo run build --filter="...[$BASE_SHA]"
          else
            pnpm turbo run build
          fi

  # The required check. Its name is what branch protection looks for, so it stays; it passes only when all three
  # jobs above passed.
  checks:
    name: Lint, typecheck, unit tests, build
    needs: [static, unit, build]
    if: always()
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: All three passed
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.build.result }}
        run: |
          echo "static unit build: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done

  integration:
    name: Integration tests (Postgres + Valkey, RLS on)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.CI_RUNNER_INTEGRATION && fromJSON(vars.CI_RUNNER_INTEGRATION) || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        # Postgres 16 with pgvector (Nova retrieval, ai/03 §5), same as docker-compose.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate an empty database and lint RLS
        run: |
          pnpm db:bootstrap
          pnpm db:migrate
          pnpm db:lint
      - name: Migrations are re-runnable
        run: pnpm db:migrate
      - name: Integration tests (includes cross-tenant leakage tests)
        run: pnpm test:integration
