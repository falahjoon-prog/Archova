# Security checks on every pull request (infrastructure/03 §3 "Security"): secret scan, dependency audit, and
# CodeQL once code scanning is enabled for the repository (repository variable CODE_SCANNING_ENABLED = true;
# a private repository needs GitHub Advanced Security for it). Terraform is scanned in infra.yml, images in
# images.yml.
name: Security

# Docs-only pull requests skip this workflow (Actions minutes); every push to main still runs it.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
  schedule:
    - cron: '30 18 * * 1' # Tuesday 4:30am Sydney: catch new advisories on unchanged code

concurrency:
  group: security-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel a run on main: each push to main must finish its own full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --redact --verbose --no-banner --exit-code 1 .

  audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Reviewed exceptions live in pnpm-workspace.yaml (auditConfig.ignoreGhsas), each with a reason.
      - run: pnpm audit --prod --audit-level high

  codeql:
    name: CodeQL
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
