# One-off for the free online test deployment: creates the database roles and applies the migrations on the Supabase
# (Sydney) test database. Needs repository secrets TEST_DB_PASSWORD (the database's postgres password) and
# TEST_ROLE_SECRET (any long random string; each role's password is sha256 of "<secret>:<role>").
# TLS is verified against Supabase's published root certificate (NODE_EXTRA_CA_CERTS).
name: Test deploy database

on:
  push:
    branches: [claude/project-thread-z64rby]
    paths: ['.github/workflows/test-deploy-db.yml']
  workflow_dispatch:
    inputs:
      seed:
        description: Also load the demo sample data (needs the API running at seed_app_origin)
        type: boolean
        default: false
      seed_app_origin:
        description: Web origin for the seed (e.g. https://archova-test.vercel.app)
        default: ''

permissions:
  contents: read

env:
  POOLER_HOST: aws-1-ap-southeast-2.pooler.supabase.com
  PROJECT_REF: hdknxwcuwgddormggwud
  NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/supabase-ca.crt

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Supabase root certificate
        run: curl -fsSL -o supabase-ca.crt https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      - run: pnpm install --frozen-lockfile --filter @archova/tools --filter archova
      - name: Role passwords
        env:
          S: ${{ secrets.TEST_ROLE_SECRET }}
        run: |
          for r in app_migrator app_rw app_platform app_admin; do
            p=$(printf '%s:%s' "$S" "$r" | sha256sum | cut -d' ' -f1)
            echo "::add-mask::$p"
            echo "PW_$r=$p" >> "$GITHUB_ENV"
          done
      - name: Create roles and extensions
        env:
          DB_HOST: ${{ env.POOLER_HOST }}
          DB_NAME: postgres
          DB_MASTER_SECRET: '{"username":"postgres.${{ env.PROJECT_REF }}","password":${{ toJSON(secrets.TEST_DB_PASSWORD) }}}'
          DB_ROLE_APP_MIGRATOR: '{"password":"${{ env.PW_app_migrator }}"}'
          DB_ROLE_APP_RW: '{"password":"${{ env.PW_app_rw }}"}'
          DB_ROLE_APP_PLATFORM: '{"password":"${{ env.PW_app_platform }}"}'
          DB_ROLE_APP_ADMIN: '{"password":"${{ env.PW_app_admin }}"}'
        run: pnpm --filter @archova/tools exec tsx db/roles.ts
      - name: Apply migrations
        env:
          MIGRATOR_DATABASE_URL: postgres://app_migrator.${{ env.PROJECT_REF }}:${{ env.PW_app_migrator }}@${{ env.POOLER_HOST }}:5432/postgres?sslmode=require
        run: pnpm db:compose && pnpm db:migrate
      - name: Load demo sample data
        if: ${{ inputs.seed }}
        env:
          SEED_APP_ORIGIN: ${{ inputs.seed_app_origin }}
          SEED_PASSWORD: Harbour-Sample-7731
          SEED_DB_URL: postgres://app_rw.${{ env.PROJECT_REF }}:${{ env.PW_app_rw }}@${{ env.POOLER_HOST }}:5432/postgres?sslmode=require
        run: pnpm demo:seed
