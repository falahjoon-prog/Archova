# Installable Android test build (no Expo account needed). Runs on John's PC runner when CI_RUNNER is set. Run it by hand from the Actions tab; the APK is the
# "archova-android-apk" artifact on the run page, and is also published to the "android-test-latest" release that the website's Get the app page links to. Signed with the debug key, so it is for testing only, never a store
# upload. The API and web addresses default to the demo tunnel; enter new ones if the tunnel restarted.
name: Mobile APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API origin the app talks to
        default: https://tamil-acquisitions-frontpage-biography.trycloudflare.com
      app_origin:
        description: Web app origin that hosts the sign-in page
        default: https://tamil-acquisitions-frontpage-biography.trycloudflare.com

permissions:
  contents: write # publishes the APK to the android-test-latest release

jobs:
  apk:
    name: Build Android APK
    # Same runner switch as ci.yml: CI_RUNNER set means John's own PC, unset means GitHub-hosted.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      EXPO_PUBLIC_APP_ORIGIN: ${{ inputs.app_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted runners already have the Android SDK; this installs it on a self-hosted one.
      - uses: android-actions/setup-android@v3
        if: runner.environment == 'self-hosted'
      - run: pnpm install --frozen-lockfile
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: archova-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # Stable download link for the website: one pre-release whose single asset is replaced on every run.
      - name: Publish to the android-test-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" archova-android-test.apk
          gh release view android-test-latest >/dev/null 2>&1 || gh release create android-test-latest \
            --prerelease --title "Android test build" \
            --notes "Latest Android test build (debug-signed, not a store release). Replaced by each Mobile APK run."
          gh release upload android-test-latest archova-android-test.apk --clobber
