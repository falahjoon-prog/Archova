packages:
  - apps/*
  - modules/*
  - packages/*
  - tools
onlyBuiltDependencies:
  - '@node-rs/argon2'
  - esbuild
  - sharp
overrides:
  # Advisories published after the lockfile was last updated; sharp and dompurify arrive through Payload (apps/site), the rest through vitest in apps/api.
  'sharp@<0.35.5': '^0.35.5'
  'dompurify@<3.4.17': '^3.4.17'
  'graphql-scalars@<2.0.1': '^2.0.1'
  'tinypool@<2.1.2': '^2.1.2'
  'vite@>=7.0.0 <7.3.7': '^7.3.7'
  'happy-dom@<21.0.4': '^21.0.4'
  # Next 15 pins postcss 8.4.31, which has GHSA-6g55-p6wh-862q and GHSA-r28c-9q8g-f849 (build time only).
  'postcss@<8.5.18': '^8.5.18'
auditConfig:
  ignoreGhsas:
    # node-forge in Expo's CLI (mobile build tooling, never shipped in an app or image); no patched release yet.
    - GHSA-86w9-cpqp-85rv
    # zod 3.25.76 inside Expo's CLI (mobile build tooling, same as above). Our own packages are on zod 4.6.7; Expo
    # needs the zod 3 API, so an override would break its CLI. Revisit when Expo ships on zod 4.
    - GHSA-mrhx-c7xc-m3w5
