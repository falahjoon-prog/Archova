      - {
          name: recipientId,
          in: path,
          required: true,
          schema: { type: string, pattern: '^trr_[0-9A-Za-z]{26}$' },
        }
    post:
      operationId: resendTransmittalLink
      tags: [documents]
      x-module: documents
      x-permission: documents.transmittals.manage
      summary: Email a recipient without an account a new link. The earlier link stops working (X45).
      responses:
        '200':
          description: The recipient; `deliveredAt` shows when the email went out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalRecipient' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transmittal-access:
    post:
      operationId: openTransmittalAccess
      tags: [documents]
      x-module: documents
      x-auth: none
      summary: Exchange a link token for a session on that link (web `/t/[token]`, X45). Records the "opened" receipt.
      description: 'Sets the `__Host-lnk` cookie (12 hours, this link only). The page then removes the token from the address bar. An expired, revoked or unknown link returns `access_link.invalid` with no detail about the record.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenInductionAccessRequest' }
      responses:
        '200':
          description: The transmittal behind the link; `__Host-lnk` set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalAccess' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: getTransmittalAccess
      tags: [documents]
      x-module: documents
      x-auth: none
      summary: The transmittal behind the current link session.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transmittal-access/acknowledge:
    post:
      operationId: acknowledgeTransmittalAccess
      tags: [documents]
      x-module: documents
      x-auth: none
      summary: The recipient confirms they received it. First time wins.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transmittal-access/download:
    post:
      operationId: downloadTransmittalAccessItem
      tags: [documents]
      x-module: documents
      x-auth: none
      summary: A short-lived download URL for one item on this transmittal. Records the "downloaded" receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadTransmittalItemRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalDownload' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/ai/settings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getAiSettings
      tags: [ai]
      x-module: ai
      x-permission: ai.settings.read
      summary: Nova settings for this org (ai/04 §8). Defaults apply until an admin changes them.
      responses:
        '200':
          description: Settings
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSettings' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAiSettings
      tags: [ai]
      x-module: ai
      x-permission: ai.settings.manage
      summary: Turn Nova or single features on or off, set a monthly credit cap and body retention.
      description: Send `If-Match` with the ETag from `getAiSettings` (`"0"` before the first change).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAiSettingsRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSettings' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/ai/usage:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getAiUsage
      tags: [ai]
      x-module: ai
      x-permission: ai.usage.read
      summary: Nova credits used this month by feature, against the allowance (ai/05 §6).
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/ai/runs/{runId}/feedback:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: runId
        in: path
        required: true
        schema: { type: string, pattern: '^air_[0-9A-Za-z]{26}$' }
    put:
      operationId: submitAiFeedback
      tags: [ai]
      x-module: ai
      summary: Thumbs up or down on a Nova output (ai/06 §5). Only the person who asked can rate it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiFeedbackRequest' }
      responses:
        '204': { description: Saved }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/drawing-register/extractions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: extractDrawingRegister
      tags: [ai]
      x-module: ai
      x-permission: ai.drawing_register.extract
      summary: Nova reads the title block of every sheet in an uploaded drawing PDF or image (F1).
      description: |
        Each sheet becomes a pending suggestion with the drawing number, title, revision, discipline, date and scale,
        the fields a person must check (`flagged`), and how it matches the register (new drawing, new revision...).
        Nothing is added to the register until a person accepts. Re-running a file replaces its pending suggestions.
        Scanned pages are read with OCR (Textract in Sydney) and their suggestions have `payload.scanned: true`.
        Pages with no text even after OCR are listed in `skippedPages`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileId]
              properties:
                fileId: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
      responses:
        '200':
          description: Suggestions, one per sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingRegisterExtraction' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/suggestions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAiSuggestions
      tags: [ai]
      x-module: ai
      x-permission: ai.suggestions.read
      summary: Nova suggestions on this project that the caller may see, newest first.
      description: Every project member can call this, but a row is listed only to the person who asked for it, or to someone who holds the permission that decides its feature (for drawing sheets, `ai.drawing_register.extract`). Drafts built from a person's own notes, photos, files or diary lines are theirs alone.
      parameters:
        - { name: task, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AiSuggestionStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/suggestions/{suggestionId}/decision:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: suggestionId
        in: path
        required: true
        schema: { type: string, pattern: '^ais_[0-9A-Za-z]{26}$' }
    post:
      operationId: decideAiSuggestion
      tags: [ai]
      x-module: ai
      x-permission: ai.suggestions.read
      summary: Accept, edit or reject a Nova suggestion (ai/04 §7).
      description: Also needs the permission of the suggestion's own feature (for drawing sheets, `ai.drawing_register.extract`). A suggestion the caller may not list is `ai.suggestion.not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSuggestionDecision' }
      responses:
        '200':
          description: The decided suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/ask:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: askNova
      tags: [ai]
      x-module: ai
      x-permission: ai.ask.use
      summary: Ask Nova a question about this project's documents, drawings and RFIs (F2).
      description: |
        Nova searches the current revisions the caller can open (private folders and drawing access apply) and
        answers with a citation to the exact document, revision and page for each claim. Builder staff with RFI
        access also search sent RFIs, their question and every response; an RFI is cited by its `rfi_` id, and other
        people never retrieve RFI text through Ask. When the project's records don't answer it, `found` is false and
        `closestMatches` lists the nearest passages instead of a guess. Costs one Nova credit when the model is
        called; nothing when no visible passage matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: The answer, or "not found" with the closest matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaAnswer' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/search:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: searchProjectWithNova
      tags: [ai]
      x-module: ai
      x-permission: ai.ask.use
      summary: Search this project's documents, drawings and RFIs by meaning and keyword (F6).
      description: |
        Finds the passages that match a few words, by meaning ("anything about the basement leak") as well as by the
        words themselves, in the current revisions the caller can open: private folders and drawing access apply,
        and builder staff with RFI access also search sent RFIs, exactly as for Ask. Results are ranked best first,
        one per page of each revision, each with the start of the passage or the stretch around the first query word
        it contains. Nothing is written or answered: the only model call is the embedding of the query, which costs
        no Nova credits. The closest passages are returned even when none is close, so an empty list means nothing
        is indexed that the caller can see. Needs Nova on for the organisation, as Ask does. Each person can search
        120 times in ten minutes; beyond that the response is 429 `rate_limited`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 300 }
                limit: { type: integer, minimum: 1, maximum: 20, description: Defaults to 10 }
      responses:
        '200':
          description: The matching passages, best first
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/NovaSearchResult' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/rfi-drafts:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: draftRfiWithNova
      tags: [ai]
      x-module: ai
      x-permission: rfis.rfis.create
      summary: Nova drafts an RFI from a note typed on site or a drawing markup (F3).
      description: |
        A note, a markup with text on it, a site photo, or any mix of them is needed. Nova turns them into an RFI subject and question, citing the drawings and spec clauses it refers to
        from the current revisions the caller can open. It also lists RFIs already raised on the same subject that
        the caller can see, and suggests assignees from who was asked those. Numbers in the draft that appear in
        neither the note nor a cited passage are listed in `unsupportedNumbers` for the person to check. Nova sends
        nothing: the draft fills the RFI form and the person edits and sends it, passing `suggestionId` as
        `aiSuggestionId` when they create the RFI. The draft is kept for the caller alone (it doesn't show in the
        project's suggestion list for anyone else). Costs one Nova credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 4000
                  description: What the RFI is about. May be empty when the markup has text on it.
                markup:
                  description: |
                    A markup the person drew on a drawing revision. Nova reads the words on it and the sheet's own
                    text around it, names the sheet and revision in the question, and returns where to pin the RFI.
                  type: object
                  additionalProperties: false
                  required: [drawingRevisionId, markupId]
                  properties:
                    drawingRevisionId: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
                    markupId: { type: string, pattern: '^mku_[0-9A-Za-z]{26}$' }
                photo:
                  description: |
                    A site photo already uploaded to this project (PNG, JPEG or WebP, up to 3 MB; the apps shrink
                    phone photos first). Nova looks at it and says what it shows. A photo shows a condition, not a
                    location, so `location` is listed in `gaps` unless the note gives one. Numbers read off the
                    photo are listed in `unsupportedNumbers`.
                  type: object
                  additionalProperties: false
                  required: [fileId]
                  properties:
                    fileId: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaRfiDraft' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/rfis/{rfiId}/answer-drafts:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RfiId'
    post:
      operationId: draftRfiAnswerWithNova
      tags: [ai]
      x-module: ai
      x-permission: rfis.rfis.respond
      summary: Nova drafts a response to an RFI that already exists (F3).
      description: |
        For the person who will answer: the builder's staff, or an assignee on the RFI. It is the same check as
        sending a response, so an RFI the caller can't see is `rfi.not_found`, one they may not respond to is
        `rfi.response_not_allowed`, and one that is not open or answered is `rfi.invalid_transition`.

        Nova reads the question, the responses so far, the PDFs attached to them (text layer only, the first three pages)
        and photos attached to them (up to three), and searches the project documents the caller can open, and for
        builder staff earlier RFIs, for what bears on the question. It drafts only what those and the optional
        `direction` support. It never decides for the person: what the documents and the direction leave open comes
        back in `needsDecision`, and `basis` says what the draft rests on (`documents` when it cites a passage,
        `direction` when only the person's direction supports it, `none` when nothing does, which the screen should
        say before the person sends it). Numbers in the answer that appear in none of the thread, the direction, the
        PDFs or a cited passage are listed in `unsupportedNumbers` for the person to check. Nova sends nothing: the
        draft fills the response box, and the person edits and sends it with `addRfiResponse`, passing
        `suggestionId` as `aiSuggestionId`, then decides the suggestion (`accepted` as is, `edited` when they changed
        it, `rejected` when they sent something else). The draft is kept for the caller alone. Costs one Nova credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                direction:
                  type: string
                  maxLength: 2000
                  description: |
                    What the person wants the answer to say, in their own words ("approve the substitution", "use the
                    90 minute rating"). Nova follows it and does not add decisions of its own. May be empty.
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaRfiAnswerDraft' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/defect-tags:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: tagDefectWithNova
      tags: [ai]
      x-module: ai
      x-permission: defects.defects.create
      summary: Nova suggests a title, trade and priority for a defect from its photo (F5).
      description: |
        Nova looks at a defect photo and, when the defect is pinned on a drawing, the sheet's own text around the
        pin, and suggests a title, a description, the trade (`trade`, then up to two `alternativeTrades`), the kind of
        defect (`category`) and a priority. The place in the title is named only from the note or the sheet text
        near the pin, copied as printed. Companies on the project that list the trade come back in
        `suggestedCompanies` (the person picks the assignee; Nova never does), and open defects the caller can see
        pinned beside the same spot come back in `duplicates`, nearest first. Numbers in the suggestion that appear
        in neither the note nor the sheet text are listed in `unsupportedNumbers` for the person to check. Nova
        raises no defect: the suggestion fills the defect form and the person saves it, passing `suggestionId` as
        `aiSuggestionId` so the defect is marked `ai_suggested`. The suggestion is kept for the caller alone (it
        doesn't show in the project's suggestion list for anyone else). Costs a tenth of a Nova credit.
        The photo is a PNG, JPEG or WebP already uploaded to this project, up to 3 MB (the apps shrink phone photos
        first); anything else is a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photo]
              properties:
                photo:
                  type: object
                  additionalProperties: false
                  required: [fileId]
                  properties:
                    fileId: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
                note:
                  type: string
                  maxLength: 1000
                  description: What the person said or typed about the defect. May be empty.
                pin:
                  description: Where the defect is on a drawing; without it no place is named and no duplicates are found.
                  $ref: '#/components/schemas/DrawingPin'
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaDefectTag' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/import-mappings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: suggestImportMappingWithNova
      tags: [ai]
      x-module: ai
      x-permission: ai.import_mapping.suggest
      summary: Nova suggests which field each column of an import file fills (F31).
      description: |
        The import screen reads the file and sends, for each column, its header, up to five of its values and, for a
        column with at most 30 distinct values (a status or priority), those values. Nova suggests the field each
        column fills for the kind of record (`entity`), with a confidence, and for columns that fill a field with
        fixed values (status, priority) what each value in the file means. Code keeps only fields that exist, gives
        each field to one column, withdraws a suggestion whose values don't look like that kind of field (a date
        column of names), fills `examples` from the file, and lists the required fields no column fills in
        `missingRequired`. Nothing is imported: the person confirms or changes every suggestion, and the screen
        passes `suggestionId` when it starts the import job. The suggestion keeps no values from the file and is
        private to the caller. Costs a quarter of a Nova credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entity, columns]
              properties:
                entity: { $ref: '#/components/schemas/ImportEntity' }
                columns:
                  type: array
                  minItems: 1
                  maxItems: 80
                  items:
                    type: object
                    additionalProperties: false
                    required: [header, samples]
                    properties:
                      header: { type: string, maxLength: 200 }
                      samples:
                        type: array
                        maxItems: 5
                        items: { type: string, maxLength: 100 }
                      distinct:
                        type: array
                        maxItems: 30
                        items: { type: string, maxLength: 100 }
      responses:
        '200':
          description: The suggested mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaImportMapping' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/quote-readings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: readQuoteWithNova
      tags: [ai]
      x-module: ai
      x-permission: estimating.quotes.review
      summary: Nova reads a subcontractor's PDF quote into lines, exclusions and qualifications (F22).
      description: |
        The estimator has the quote PDF uploaded to the project and names the tender package it answers (which must
        be out to tender). Nova reads the PDF text (scanned pages through OCR) against the package's scope lines and
        returns the priced lines (provisional sums marked), the exclusions and qualifications, the quote's reference,
        validity and printed total, each with the page and words it came from (`source`). Code keeps a source only
        when its words are on that page, flags a line whose amount is not printed on its page (`warning`), keeps
        discounts and priced options as qualifications, adds the lines up and sets them against the printed total
        (`totalCheck`). Nothing is saved as a quote: the estimator checks the reading against the PDF, picks the company
        and saves the quote with `suggestionId` as `aiSuggestionId`, then decides the suggestion. The suggestion is
        private to the caller. Costs one and a half Nova credits. A PDF with no readable text returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packageId, fileId]
              properties:
                packageId: { type: string, pattern: '^tpk_[0-9A-Za-z]{26}$' }
                fileId: { $ref: '#/components/schemas/FileRef' }
      responses:
        '200':
          description: The reading
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaQuoteReading' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/takeoff-detections:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: detectTakeoffWithNova
      tags: [ai]
      x-module: ai
      x-flag: nova_estimating
      x-permission: estimating.takeoff.manage
      summary: Nova finds the items to count or outline on a drawing sheet (Nova Esti assisted takeoff).
      description: |
        The estimator names what to find in their own words (`what`: "power points (GPOs)", "strip footings") and its
        `kind`: a count of symbols, the length of runs, or the area of regions. Any trade. They may point at up to five
        `examples` ("this one, find the rest"). Nova looks at the sheet and returns each item's place on the sheet
        (page fractions from the top-left corner), how sure it is and why when it is not; software drops anything off
        the sheet, the wrong shape or a repeat, and caps confidence on scanned sheets at 0.84. Nova never gives a
        quantity: save the items with `createAssistedTakeoffMeasurements` and size them from the sheet's confirmed
        scale. Nothing is saved or counted here. Costs one Nova credit per run. Send `image`, or the deployment must be
        able to render drawing pages, else 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionId, target]
              properties:
                revisionId: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
                target:
                  type: object
                  additionalProperties: false
                  required: [kind, what]
                  properties:
                    kind: { $ref: '#/components/schemas/TakeoffKind' }
                    what: { type: string, minLength: 1, maxLength: 120 }
                    hint: { type: string, maxLength: 400 }
                image:
                  type: object
                  additionalProperties: false
                  required: [mime, base64]
                  description: |
                    The sheet as the viewer drew it, downscaled (about 2,000 px on the long side). The API has no page
                    renderer, so the browser sends the picture; without it the server renders the page where it can.
                  properties:
                    mime: { type: string, enum: [image/png, image/jpeg, image/webp] }
                    base64: { type: string, minLength: 1, maxLength: 11500000 }
                examples:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    additionalProperties: false
                    required: [x, y]
                    properties:
                      x: { type: number, minimum: 0, maximum: 1 }
                      y: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: What Nova found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaTakeoffDetection' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/contract-reviews:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: reviewContractWithNova
      tags: [ai]
      x-module: ai
      x-permission: ai.contracts.review
      summary: Nova reads a contract PDF and flags where it departs from the builder's playbook (F34, first slice).
      description: |
        For the commercial team (commitments admin on the project). Nova reads the PDF text layer and returns a
        plain-words summary of the key terms, the notice periods and time bars (as the contract words them, never
        converted to dates) and the clauses that depart from the org's playbook for this contract type. Every item
        has the page, the clause number and a quote that code found on that page; an item without one is dropped, and
        so is model text that uses a banned word (a view on fairness, validity, safety, legal effect or whether to
        sign). Nova writes no clause wording: a flag carries the builder's own approved fallback wording from the
        playbook (labelled), or none. Nothing is signed, sent, accepted or changed. The review is saved as a pending
        suggestion any commercial-team member of the project can list. Statutory flags, the MOU check, per-flag
        decisions, compare and export are not part of this slice. Scanned pages are not read (`unreadPages`).
        Costs 40 Nova credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileId, contractType, ourSide]
              properties:
                fileId: { $ref: '#/components/schemas/FileRef' }
                contractType: { $ref: '#/components/schemas/ContractType' }
                ourSide:
                  description: we_pay means the builder pays the other party; we_get_paid means the builder is paid.
                  type: string
                  enum: [we_pay, we_get_paid]
                baseForm:
                  type: [string, 'null']
                  enum: [as4000, as2124, as4902, as4903, other, null]
                multiState:
                  description: The contract covers work in more than one state.
                  type: boolean
                  default: false
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaContractReview' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/ai/contract-playbooks/{contractType}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: contractType
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ContractType' }
    get:
      operationId: getContractPlaybook
      tags: [ai]
      x-module: ai
      x-permission: ai.settings.manage
      summary: The org's contract playbook for one contract type (design/09 CR4). Org admins only.
      responses:
        '200':
          description: Topics in the order the admin set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractPlaybook' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: replaceContractPlaybook
      tags: [ai]
      x-module: ai
      x-permission: ai.settings.manage
      summary: Replace the playbook for one contract type with the topics sent (at most 40).
      description: |
        The preferred position, the severity of a departure and the fallback wording are the builder's. Fallback
        wording needs who approved it and when; past `reviewBy` Nova stops offering it. Nova never writes wording.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topics]
              properties:
                topics:
                  type: array
                  maxItems: 40
                  items: { $ref: '#/components/schemas/ContractPlaybookTopic' }
      responses:
        '200':
          description: The saved playbook
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractPlaybook' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/quote-negotiations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: negotiateQuote
      tags: [ai]
      x-module: ai
      x-permission: estimating.quotes.review
      summary: Nova helps negotiate a confirmed subcontractor quote (EST-AC6).
      description: |
        Nova sets the quote's total against the estimator's target price (`targetExGst`), or the median of the
        levelled totals when three or more quotes compete, and answers the estimator's question with the gap, points
        to raise (unpriced scope lines, provisional sums, exclusions, qualifications, expired validity), levers that
        could close the gap, a counter-offer to consider and, when asked, a draft message to the subcontractor. Code
        works out the gap and the stance, and removes a counter-offer that doesn't fit the quote and any figure the quote
        doesn't hold (`notes` says what it removed). She is shown prices and terms only: never the company, contacts,
        internal notes or the estimator's allowances. The server keeps no conversation; pass `history` from the last
        answer with the next question. Nothing is saved, sent, accepted or awarded. She is an AI assistant, not a
        licensed agent (`disclaimer`). Costs half a Nova credit. Builder staff with `estimating.quotes.review` only,
        and only for a confirmed quote of the package.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packageId, quoteId]
              properties:
                packageId: { type: string, pattern: '^tpk_[0-9A-Za-z]{26}$' }
                quoteId: { type: string }
                targetExGst:
                  description: The estimator's target price, ex GST.
                  type: [string, 'null']
                  pattern: '^\d{1,12}(\.\d{1,2})?$'
                question: { type: string, maxLength: 1000 }
                history:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/NegotiationTurn' }
      responses:
        '200':
          description: Nova's answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteNegotiationAdvice' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/speech-transcriptions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: transcribeSpeech
      tags: [ai]
      x-module: ai
      x-permission: ai.ask.use
      summary: Nova listens to a short spoken question and returns it as text.
      description: |
        The browser records one short clip (about a minute at most) and sends it here as base64. It is turned into
        text by the speech service in Australia (X25) and is not kept; only the text comes back, for the person to
        read and edit before asking. Costs a tenth of a Nova credit. When nothing can be heard the answer is
        `ai.nothing_heard`; the person types instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audio, mimeType]
              properties:
                audio: { type: string, format: byte, minLength: 1, maxLength: 900000 }
                mimeType: { type: string, enum: [audio/webm, audio/ogg, audio/mp4, audio/wav] }
      responses:
        '200':
          description: What was said
          content:
            application/json:
              schema:
                type: object
                required: [runId, text]
                properties:
                  runId: { type: string }
                  text: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/diary/{date}/nova-summary:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: date
        in: path
        required: true
        description: The diary day in the project's time zone (X34).
        schema: { type: string, format: date }
    post:
      operationId: summariseDiaryDayWithNova
      tags: [ai]
      x-module: ai
      x-permission: diary.entries.read
      summary: Nova drafts a short summary of one diary day (F4).
      description: |
        Nova writes a few plain sentences from the day's labour, plant, deliveries, visitors, delays and events
        that the caller can see. Every sentence names the diary lines it comes from (`sources`), and a sentence
        with a number or a source the lines don't back is dropped. Delays and stand-downs the summary doesn't
        mention are listed in `unmentionedDelays`, and a delay that weather or the lines suggest is listed in
        `possibleDelay` for the person to log. The result is a pending suggestion (`task` `diary.summary`): it is
        never written into the diary, the site manager edits it into the day's notes. Asking again before the day
        changes returns the same suggestion at no cost; any change to the day or its lines makes a new one.
        Costs half a Nova credit. An empty day returns 422 `ai.diary.nothing_to_summarise`.
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/diary/weeks/{weekStart}/nova-summary:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: weekStart
        in: path
        required: true
        description: The Monday the week starts on, in the project's time zone (X34).
        schema: { type: string, format: date }
    post:
      operationId: summariseDiaryWeekWithNova
      tags: [ai]
      x-module: ai
      x-permission: diary.entries.read
      summary: Nova drafts a short summary of one diary week for the client or head office (F4).
      description: |
        Nova writes a few plain sentences about the week, Monday to Sunday, from the diary days the caller can
        see (a subcontractor's summary is written from their own company's lines only). Every sentence names the
        diary lines, weather or totals it comes from (`sources`, each with the `date` of its day), and a sentence
        with a number or a source those facts don't back is dropped. The week's labour hours, busiest day and delay
        hours by cause are added up in code (`delayHours`), never by the model. Delays and stand-downs the summary
        doesn't mention are listed in `unmentionedDelays`. A day with more lines than the summary reads leaves out
        its routine lines (`truncated`), never its delays. The result is a pending suggestion (`task`
        `diary.weekly`) that only the person who asked can list or decide; it is never written into the diary.
        Asking again before the week changes returns the same suggestion at no cost. Costs one Nova credit.
        `weekStart` must be a Monday (422 otherwise); a week with no diary entry is 404 `diary.not_found`, and a
        week whose entries are empty is 422 `ai.diary.nothing_to_summarise`.
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/meetings/{meetingId}/nova-minutes:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MeetingId'
    post:
      operationId: draftMinutesWithNova
      tags: [ai]
      x-module: ai
      x-permission: meetings.meetings.write
      summary: Nova proposes minute items from typed meeting notes (F7, MTG-US7).
      description: |
        Nova reads the notes the person pasted or typed and proposes information, decision and action items for the
        meeting's own sections, with an owner (one of the meeting's attendees) and a due date where the notes give
        them. Each proposed item carries `quote`, the words of the notes it comes from. Code drops an item whose
        quote is not in the notes, a number the quote does not contain, an owner the quote does not name, and a due
        date the quote does not give. Nova never writes into the minutes: the result is a pending suggestion (`task`
        `minutes.extract`) that only the person who asked can list or decide, and the web adds the items they pick
        through the meetings API. Asking again with the same notes returns the same suggestion at no cost. Costs
        1.5 Nova credits. Only the project team that may write the minutes can ask. Notes shorter than 20
        characters are 422 `ai.minutes.nothing_to_extract`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftMinutesRequest' }
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/drawing-revisions/{drawingRevisionId}/changes:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingRevisionId'
    post:
      operationId: compareDrawingRevision
      tags: [ai]
      x-module: ai
      x-permission: documents.drawings.read
      summary: Nova says what changed on a drawing revision since the one it superseded (F21).
      description: |
        Software compares the text on this revision's sheet with the revision it superseded (scanned sheets are
        read with OCR) and lists every line added, removed or changed, with where it sits on the sheet. Nova puts
        those changes into plain words; an item that cites no real change or adds a number is removed, and changes
        no item describes are listed in `unexplainedChangeIds`. Where the deployment can render drawing pages
        (`visual` is not null), the linework is compared as well: software compares the two renders and finds each
        place where lines were added or removed, and Nova describes each place and says whether a revision cloud
        marks it. Software lists every place it found, described or not, and removes a description that states a
        number the sheet text near the place lacks; `cloud` is what Nova saw, not checked by software. Where
        `visual` is null, or `visual.reliable` is false, use the overlay for linework. Open RFIs the caller can see that are pinned to either revision are listed, with
        `nearChange` when a change sits near the pin. The wording is worked out once per revision pair and shared,
        costing half a Nova credit the first time and nothing after; no text changes means no model call. The
        linework pass costs another half credit the first time, when it finds places to describe. A POST because the
        first call does that work.
      responses:
        '200':
          description: What changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaDrawingCompare' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/induction-drafts:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: draftInduction
      tags: [ai]
      x-module: ai
      x-permission: ai.induction.draft
      summary: Nova drafts a site induction (slides, script and quiz) from the project's documents (F33).
      description: |
        Nova searches the project documents the caller can open for each required induction section
        (compliance/04 §2), then drafts slides, a speaker script and a quiz. Every point and quiz answer cites its
        source. A section the documents don't support comes back `missing` with what to add; nothing is invented.
        Points whose citation or numbers can't be checked against the source are removed and listed in
        `warnings`. The declaration and fixed safety sentences come from the reference table, not the model.
        The result is a pending suggestion (task `induction.draft`): the builder edits it in the induction editor
        and accepts or rejects it with the suggestion decision endpoint. Costs 3 Nova credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [siteName]
              properties:
                siteName: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: The draft, as a pending suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/induction-drafts/{suggestionId}/currency:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: suggestionId
        in: path
        required: true
        schema: { type: string, pattern: '^ais_[0-9A-Za-z]{26}$' }
    get:
      operationId: getInductionDraftCurrency
      tags: [ai]
      x-module: ai
      x-permission: ai.induction.draft
      summary: Whether the documents a Nova induction draft cited still stand (F33 I2).
      description: |
        Compares the documents and drawing sheets the draft cited with the register now. A source with a newer
        published revision, or one that is gone, is listed in `changed` with the revision cited and the current one,
        the sections that rest on it and how many quiz questions cite it. Pass the draft an induction was built from
        (`draftAiSuggestionId` on the induction, `aiSuggestionId` on a published version), or a refresh of one.
        Read when asked, so the answer is never behind. A change in a source the caller cannot open (a private folder) is counted in
        `hiddenChanges` and never named. RFIs, defects and diary days a draft cited are not checked: they have no
        revisions. Free; no model is called.
      responses:
        '200':
          description: Whether the draft is up to date, and what changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InductionCurrency' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/induction-drafts/{suggestionId}/refresh:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: suggestionId
        in: path
        required: true
        schema: { type: string, pattern: '^ais_[0-9A-Za-z]{26}$' }
    post:
      operationId: refreshInductionDraft
      tags: [ai]
      x-module: ai
      x-permission: ai.induction.draft
      summary: Nova redrafts the sections of an induction draft whose cited documents have changed (F33 I2).
      description: |
        For a draft (or an earlier refresh) whose cited documents have a newer revision, Nova searches the current
        documents the caller can open for just the sections that rest on the change, and redrafts those with the same
        checks as a full draft (citations, numbers, banned words). The result is a whole induction as the draft had
        it with the redrafted sections swapped in: `payload.refresh.sections` lists what Nova redrafted, and every
        other section and quiz question is copied unchanged from the draft. The induction editor takes the redrafted
        sections into the induction being edited, so the builder's own edits to other sections stand. A section that
        also rests on a changed document the caller cannot open is left as it was and listed in
        `payload.refresh.skipped`. A section whose document was withdrawn, with nothing current to replace it, comes
        back `missing` with what to add. The result is a pending suggestion (task `induction.refresh`), decided with
        the suggestion decision endpoint like a draft. Nothing is drafted, and nothing charged, when the draft is up
        to date (409), when the changes are all in documents the caller cannot open (422), or when Nova has not yet
        read the newest revision (409: try again shortly). Costs 1 Nova credit.
      responses:
        '201':
          description: The refresh, as a pending suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/index:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: indexProjectForNova
      tags: [ai]
      x-module: ai
      x-permission: ai.project_index.run
      summary: Bring Nova's index of this project's documents, drawings and RFIs up to date.
      description: |
        Reads, chunks and embeds every published revision not yet indexed, marks older revisions superseded, applies
        folder moves to access, and drops deleted records. Sent RFIs are indexed from their question and responses:
        an RFI with a new response or an edit is indexed again and its old text dropped; drafts and voided RFIs are
        not indexed. Safe to repeat: finished revisions and unchanged RFIs are skipped. Runs in the
        request for now; the AI worker will run it on each document event once it lands. Embedding is background
        work and costs no credits, but an organisation can have only so much embedded in a day: past that the
        request fails with 429 `ai.embedding_limit` and `resetsAt`, the start of the organisation's next day, and
        running it again then carries on where it stopped. Reading scanned pages (OCR) has a daily cap of its own
        and fails the same way with 429 `ai.ocr_limit`.
      responses:
        '200':
          description: What this run did
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaIndexReport' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/sync/pull:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: syncPull
      tags: [sync]
      x-module: sync
      summary: Changes to the requested scopes since a checkpoint, for the mobile offline store (backend 04 §4).
      description: |
        Reads the change feed after `since` for each scope, filtered to what the caller can see.
        `revokedScopes` is on every response (X14): the device purges that data and stops asking for it.
        The first load of a scope is `since=0`, paginated with `hasMore`.
      parameters:
        - name: scopes
          in: query
          required: true
          description: >-
            Scopes separated by `;`. A project segment lists its modules: `project:{projectId}:diary,defects;org`.
          schema: { type: string, minLength: 3, maxLength: 4000 }
        - name: since
          in: query
          required: true
          description: The `nextSince` from the last pull of these scopes, or `0`.
          schema: { type: string, pattern: '^[0-9]{1,20}$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      responses:
        '200':
          description: A page of changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
        '426': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/sync/push:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: syncPush
      tags: [sync]
      x-module: sync
      summary: Apply commands queued offline, in order, each in its own transaction (backend 04 §4).
      description: |
        `command` names a module use case (`defects.markReadyForReview`); permissions, state machines and
        audit are the same as the REST endpoint. `mutationId` is the idempotency key: a replay returns the
        stored result. A rejection with `access.revoked` is not stored, so the drain-grant retry (X38) can
        return `pending_review`. The retry sends `Authorization: Bearer <drainGrant.token>`; the grant arrives on
        the `access.revoked` problem (a 401 on any call or on a failed token refresh), on the per-mutation
        problem, or on the `revokedScopes` entry of a pull.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: One result per mutation, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '426': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/late-submissions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listLateSubmissions
      tags: [sync]
      x-module: sync
      x-permission: sync.late.review
      summary: Changes held for review because the sender's access ended before their phone sent them (X38).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, rejected], default: pending }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Newest first, with how many are still waiting in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LateSubmissionList' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/late-submissions/{lateSubmissionId}/accept:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/LateSubmissionId'
    post:
      operationId: acceptLateSubmission
      tags: [sync]
      x-module: sync
      x-permission: sync.late.review
      summary: Run a held change as the approving admin; their own permissions, the record's rules and its version all apply.
      description: |
        The change runs exactly as if the admin had made it: the permission for the action, the state machine, the
        base-version check and the file checks all run for the admin, and it is refused when the organisation is
        read-only or the plan no longer includes the module. It is refused too when the record is not in the project
        the device named, or that the grant did not cover. A refused accept leaves the change waiting, so it can be
        rejected with a note. The record's history shows who sent it late and who accepted it.
      responses:
        '200':
          description: Accepted and applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LateSubmission' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/late-submissions/{lateSubmissionId}/reject:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/LateSubmissionId'
    post:
      operationId: rejectLateSubmission
      tags: [sync]
      x-module: sync
      x-permission: sync.late.review
      summary: Decline a held change; it is never applied, even if the device sends it again.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
