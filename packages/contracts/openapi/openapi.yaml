          quantity,
          unit,
          rate,
          amount,
          isProvisional,
          originalAmount,
          source,
        ]
      properties:
        id: { type: string }
        scopeKey: { type: [string, 'null'] }
        description: { type: string }
        quantity: { type: [string, 'null'] }
        unit: { type: string }
        rate: { type: [string, 'null'] }
        amount: { type: string, description: 'Decimal AUD ex GST' }
        isProvisional: { type: boolean }
        originalAmount:
          {
            type: [string, 'null'],
            description: 'What Nova read, kept when the estimator corrected it',
          }
