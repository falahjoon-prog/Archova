          numberLabel,
          title,
          companyId,
          highRiskWorkCategories,
          content,
          fileId,
          revision,
          status,
          reviewedBy,
          reviewedAt,
          expiresOn,
          isExpired,
          createdBy,
          createdAt,
          updatedAt,
          version,
