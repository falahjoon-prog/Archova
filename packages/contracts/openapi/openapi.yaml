        worker: { $ref: '#/components/schemas/Worker' }
    AttendanceSessionList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AttendanceEntry' } }
    OnSite:
      type: object
      required: [total, companies, people]
      properties:
        total: { type: integer }
        companies:
          type: array
          items:
            type: object
            required: [companyId, companyNameOther, count]
            properties:
              companyId: { oneOf: [{ $ref: '#/components/schemas/CompanyRef' }, { type: 'null' }] }
              companyNameOther: { type: [string, 'null'] }
              count: { type: integer }
        people: { type: array, items: { $ref: '#/components/schemas/AttendanceEntry' } }
    EligibilityReason:
      type: object
      required: [code, blocking]
      additionalProperties: true
      properties:
        code:
          {
            type: string,
            description: 'e.g. `worker.inactive`, `company.unconfirmed`, `induction.missing`',
          }
        blocking: { type: boolean }
    EligibilityCheck:
      type: object
      required: [id, result, answeredBy, reasons, checkedAt]
      properties:
        id: { type: string, pattern: '^elc_[0-9A-Za-z]{26}$' }
        result: { type: string, enum: [eligible, blocked, warning] }
        answeredBy: { type: string, enum: [workforce, wallet] }
        reasons: { type: array, items: { $ref: '#/components/schemas/EligibilityReason' } }
        checkedAt: { type: string, format: date-time }
    SignInResult:
      type: object
      required: [outcome, eligibility, session, worker]
      properties:
        outcome:
          type: string
          enum: [accepted, blocked, overridden, already_on_site, signed_out]
          description: '`blocked`: show "See the site office before starting work" (ATT-AC7). The attempt is recorded.'
        eligibility:
          { oneOf: [{ $ref: '#/components/schemas/EligibilityCheck' }, { type: 'null' }] }
        session: { oneOf: [{ $ref: '#/components/schemas/AttendanceSession' }, { type: 'null' }] }
        worker: { $ref: '#/components/schemas/Worker' }
    SelfSignInRequest:
      type: object
      additionalProperties: false
      required: [gateCode]
      properties:
        gateCode: { type: string, minLength: 10, maxLength: 100 }
        clientAt:
          {
            type: string,
            format: date-time,
            description: Device time of the scan; later than the server's clock is ignored.,
          }
        location: { $ref: '#/components/schemas/GeoFix' }
        offline:
          { type: boolean, description: The scan was queued on the phone with no signal (ATT-AC9). }
    SelfSignOutRequest:
      type: object
      additionalProperties: false
      properties:
        gateCode: { type: string, minLength: 10, maxLength: 100 }
        clientAt: { type: string, format: date-time }
    RecordAttendanceRequest:
      type: object
      additionalProperties: false
      required: [workerId, kind]
      properties:
        workerId: { type: string, pattern: '^wkr_[0-9A-Za-z]{26}$' }
        siteId: { type: string, pattern: '^wst_[0-9A-Za-z]{26}$' }
        kind: { type: string, enum: [sign_in, sign_out] }
        clientAt: { type: string, format: date-time }
        overrideReason:
          type: string
          minLength: 1
          maxLength: 500
          description: Lets a blocked worker in; needs `workforce.attendance.override` and is kept on the record.
    RollCallPerson:
      type: object
      required:
        [
          workerId,
          fullName,
          phone,
          companyId,
          companyNameOther,
          siteId,
          signedInAt,
          status,
          markedAt,
          markedBy,
        ]
      properties:
        workerId: { type: string }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        companyId: { oneOf: [{ $ref: '#/components/schemas/CompanyRef' }, { type: 'null' }] }
        companyNameOther: { type: [string, 'null'] }
        siteId: { type: [string, 'null'] }
        signedInAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: '`null` for someone marked who was not on the list.',
          }
        status: { type: string, enum: [unmarked, accounted_for, missing, not_on_site] }
        markedAt: { type: [string, 'null'], format: date-time }
        markedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
    RollCall:
      type: object
      required: [id, projectId, siteId, reason, startedAt, startedBy, endedAt, counts, people]
      properties:
        id: { type: string, pattern: '^rlc_[0-9A-Za-z]{26}$' }
        projectId: { type: string }
        siteId: { type: [string, 'null'] }
        reason: { type: string }
        startedAt: { type: string, format: date-time }
        startedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        endedAt: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          required: [total, accountedFor, missing, unmarked]
          properties:
            total: { type: integer }
            accountedFor: { type: integer }
            missing: { type: integer }
            unmarked: { type: integer }
        people:
          description: Sorted by company, then name.
          type: array
          items: { $ref: '#/components/schemas/RollCallPerson' }
    RollCallList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RollCall' } }
    StartRollCallRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        siteId: { type: string, pattern: '^wst_[0-9A-Za-z]{26}$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    MarkRollCallRequest:
      type: object
      additionalProperties: false
      required: [workerId, status]
      properties:
        workerId: { type: string, pattern: '^wkr_[0-9A-Za-z]{26}$' }
        status: { type: string, enum: [accounted_for, missing, not_on_site] }
    InductionSectionKey:
      type: string
      description: 'The nine required sections of a site-specific induction (compliance/04 §2), plus `extra` for anything the builder adds. The declaration is fixed text, not a section.'
      enum:
        [
          who_and_access,
          layout_and_amenities,
          emergencies_and_first_aid,
          site_hazards,
          high_risk_work_and_permits,
          ppe,
          site_rules,
          incident_reporting,
          consultation,
          extra,
        ]
    InductionSlide:
      type: object
      additionalProperties: false
      required: [title, points, script]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        points: { type: array, maxItems: 12, items: { type: string, minLength: 1, maxLength: 400 } }
        script:
          description: What the narrator says on this slide.
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 600 }
    InductionSlidesBlock:
      type: object
      additionalProperties: false
      required: [type, slides]
      properties:
        type: { type: string, enum: [slides] }
        slides:
          {
            type: array,
            minItems: 1,
            maxItems: 30,
            items: { $ref: '#/components/schemas/InductionSlide' },
          }
    InductionTextBlock:
      type: object
      additionalProperties: false
      required: [type, body]
      properties:
        type: { type: string, enum: [text] }
        body: { type: string, minLength: 1, maxLength: 20000 }
    InductionFileBlock:
      type: object
      additionalProperties: false
      required: [type, fileId]
      properties:
        type:
          type: string
          enum: [video, document, image]
          description: 'A video (watched to the end), a PDF or slide deck (paged through), or an image such as the site map.'
        fileId: { $ref: '#/components/schemas/FileRef' }
        title: { type: [string, 'null'], maxLength: 200 }
    InductionSwmsBlock:
      type: object
      additionalProperties: false
      required: [type, documentId]
      properties:
        type: { type: string, enum: [swms] }
        documentId: { type: string, pattern: '^doc_[0-9A-Za-z]{26}$' }
        title:
          type: [string, 'null']
          maxLength: 300
          description: Filled in from the document register; ignored on input.
    InductionBlock:
      oneOf:
        - $ref: '#/components/schemas/InductionSlidesBlock'
        - $ref: '#/components/schemas/InductionTextBlock'
        - $ref: '#/components/schemas/InductionFileBlock'
        - $ref: '#/components/schemas/InductionSwmsBlock'
    InductionSection:
      type: object
      additionalProperties: false
      required: [key, title, blocks]
      properties:
        key: { $ref: '#/components/schemas/InductionSectionKey' }
        title: { type: string, minLength: 1, maxLength: 200 }
        blocks:
          { type: array, maxItems: 20, items: { $ref: '#/components/schemas/InductionBlock' } }
    InductionQuestion:
      type: object
      additionalProperties: false
      required: [section, question, options, answerIndex, critical]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,40}$'
          description: Kept across edits so attempts point at the same question; given by the server when left out.
        section: { $ref: '#/components/schemas/InductionSectionKey' }
        question: { type: string, minLength: 1, maxLength: 500 }
        options:
          {
            type: array,
            minItems: 2,
            maxItems: 6,
            items: { type: string, minLength: 1, maxLength: 300 },
          }
        answerIndex: { type: integer, minimum: 0, maximum: 5 }
        critical:
          type: boolean
          description: 'Must be answered correctly to pass. Always on for emergency and high-risk work questions.'
    InductionContent:
      type: object
      additionalProperties: false
      required: [sections, quiz, passMark]
      properties:
        sections:
          { type: array, maxItems: 30, items: { $ref: '#/components/schemas/InductionSection' } }
        quiz:
          { type: array, maxItems: 15, items: { $ref: '#/components/schemas/InductionQuestion' } }
        passMark:
          type: integer
          minimum: 70
          maximum: 100
          description: 'Overall percentage needed, on top of every critical question right. Default 80 (IND-AC5).'
    InductionProblem:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    InductionApproval:
      type: object
      required: [section, approvedBy, approvedAt, current]
      properties:
        section: { type: integer, description: Index of the section in the draft. }
        approvedBy: { $ref: '#/components/schemas/UserRef' }
        approvedAt: { type: string, format: date-time }
        current:
          type: boolean
          description: False once the section has been edited since it was approved.
    InductionVersionSummary:
      type: object
      required:
        [
          id,
          number,
          contentHash,
          redo,
          graceDays,
          requiredFrom,
          changeNote,
          aiGenerated,
          publishedAt,
          publishedBy,
        ]
      properties:
        id: { type: string, pattern: '^inv_[0-9A-Za-z]{26}$' }
        number: { type: integer, minimum: 1 }
        contentHash: { type: string }
        redo:
          type: string
          enum: [all, none]
          description: '`all`: every worker must complete this version before their next sign-in, after the grace days. `none`: a minor change; earlier completions stay current.'
        graceDays: { type: integer }
        requiredFrom: { type: string, format: date-time }
        changeNote: { type: [string, 'null'] }
        aiGenerated: { type: boolean }
        publishedAt: { type: string, format: date-time }
        publishedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
    InductionVersion:
      allOf:
        - $ref: '#/components/schemas/InductionVersionSummary'
        - type: object
          required: [inductionId, content, declarationText, approvedBy]
          properties:
            inductionId: { type: string }
            content: { $ref: '#/components/schemas/InductionContent' }
            declarationText: { type: string }
            approvedBy:
              description: The people who approved Nova-drafted sections, if any.
              type: array
              items: { $ref: '#/components/schemas/UserRef' }
    Induction:
      type: object
      required:
        [
          id,
          projectId,
          siteId,
          title,
          status,
          validityMonths,
          draft,
          draftAiSuggestionId,
          approvals,
          problems,
          currentVersion,
          requiredVersion,
          versions,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, pattern: '^ind_[0-9A-Za-z]{26}$' }
        projectId: { type: string }
        siteId: { type: [string, 'null'] }
        title: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        validityMonths:
          type: integer
          description: How long a completion stays current before re-induction (compliance/04 §4, default 12).
        draft: { $ref: '#/components/schemas/InductionContent' }
        draftAiSuggestionId:
          type: [string, 'null']
          description: Set when the draft came from a Nova suggestion; every section then needs approving.
        approvals: { type: array, items: { $ref: '#/components/schemas/InductionApproval' } }
        problems:
          description: What stops the draft being published now. Empty when it can be.
          type: array
          items: { $ref: '#/components/schemas/InductionProblem' }
        currentVersion:
          oneOf: [{ $ref: '#/components/schemas/InductionVersionSummary' }, { type: 'null' }]
        requiredVersion:
          description: The version workers must have completed to sign in today.
          oneOf: [{ $ref: '#/components/schemas/InductionVersionSummary' }, { type: 'null' }]
        versions:
          description: Newest first.
          type: array
          items: { $ref: '#/components/schemas/InductionVersionSummary' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InductionList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Induction' } }
    CreateInductionRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        siteId: { type: string, pattern: '^wst_[0-9A-Za-z]{26}$' }
        validityMonths: { type: integer, minimum: 1, maximum: 36 }
    UpdateInductionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        validityMonths: { type: integer, minimum: 1, maximum: 36 }
        status: { type: string, enum: [archived] }
    SaveInductionDraftRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { $ref: '#/components/schemas/InductionContent' }
        aiSuggestionId:
          type: string
          pattern: '^ais_[0-9A-Za-z]{26}$'
          description: The Nova `induction.draft` suggestion this content was built from.
    ApproveInductionSectionRequest:
      type: object
      additionalProperties: false
      required: [section]
      properties:
        section: { type: integer, minimum: 0, maximum: 29 }
    PublishInductionRequest:
      type: object
      additionalProperties: false
      required: [redo]
      properties:
        redo: { type: string, enum: [all, none] }
        graceDays: { type: integer, minimum: 0, maximum: 30 }
        changeNote: { type: string, minLength: 1, maxLength: 1000 }
    StartInductionRequest:
      type: object
      additionalProperties: false
      properties:
        siteId: { type: string, pattern: '^wst_[0-9A-Za-z]{26}$' }
        workerId:
          type: string
          pattern: '^wkr_[0-9A-Za-z]{26}$'
          description: A site manager taking a worker through it on a tablet.
    InductionWorkerQuestion:
      type: object
      required: [id, section, question, options]
      properties:
        id: { type: string }
        section: { $ref: '#/components/schemas/InductionSectionKey' }
        question: { type: string }
        options: { type: array, items: { type: string } }
    InductionWorkerContent:
      type: object
      required: [sections, quiz, passMark, declarationText, swmsNotice]
      properties:
        sections: { type: array, items: { $ref: '#/components/schemas/InductionSection' } }
        quiz: { type: array, items: { $ref: '#/components/schemas/InductionWorkerQuestion' } }
        passMark: { type: integer }
        declarationText: { type: string }
        swmsNotice:
          type: string
          description: 'Shown with every SWMS: opening it here is awareness, not sign-on to the SWMS.'
    InductionQuizSummary:
      type: object
      required: [attempts, failedAttempts, passed, lastScore]
      properties:
        attempts: { type: integer }
        failedAttempts: { type: integer }
        passed: { type: boolean }
        lastScore: { type: [integer, 'null'] }
    InductionCompletion:
      type: object
      required:
        [
          id,
          inductionId,
          versionId,
          versionNumber,
          worker,
          status,
          method,
          startedAt,
          completedAt,
          expiresOn,
          sectionsViewed,
          quiz,
          credentials,
          content,
        ]
      properties:
        id: { type: string, pattern: '^inc_[0-9A-Za-z]{26}$' }
        inductionId: { type: string }
        versionId: { type: string }
        versionNumber: { type: integer }
        worker: { $ref: '#/components/schemas/Worker' }
        status: { type: string, enum: [in_progress, completed] }
        method: { type: string, enum: [self, assisted, link] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresOn: { type: [string, 'null'], format: date }
        sectionsViewed:
          description: Indexes of the sections seen to the end.
          type: array
          items: { type: integer }
        quiz: { $ref: '#/components/schemas/InductionQuizSummary' }
        credentials: { type: array, items: { $ref: '#/components/schemas/WorkerCredential' } }
        content: { $ref: '#/components/schemas/InductionWorkerContent' }
    InductionProgressRequest:
      type: object
      additionalProperties: false
      required: [section]
      properties:
        section: { type: integer, minimum: 0, maximum: 29 }
        seconds: { type: integer, minimum: 0, maximum: 86400 }
    SubmitInductionQuizRequest:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          maxItems: 15
          items:
            type: object
            additionalProperties: false
            required: [questionId, answerIndex]
            properties:
              questionId: { type: string, maxLength: 40 }
              answerIndex: { type: integer, minimum: 0, maximum: 5 }
    InductionQuizResult:
      type: object
      required: [attempt, score, passed, criticalMissed, reviewSections, seeSiteOffice]
      properties:
        attempt: { type: integer }
        score: { type: integer, description: Percentage of questions answered correctly. }
        passed: { type: boolean }
        criticalMissed: { type: boolean }
        reviewSections:
          description: Indexes of the sections the missed questions came from.
          type: array
          items: { type: integer }
        seeSiteOffice:
          type: boolean
          description: True after 3 failed attempts; the site manager is told (compliance/04 §3).
    SignInductionRequest:
      type: object
      additionalProperties: false
      required: [typedName, signature, fitForWork, agreed]
      properties:
        typedName: { type: string, minLength: 1, maxLength: 200 }
        signature:
          type: object
          additionalProperties: false
          required: [format, data]
          properties:
            format: { type: string, enum: [svg] }
            data:
              type: string
              minLength: 1
              maxLength: 200000
              description: The finger signature as SVG path data.
        fitForWork: { type: boolean, description: Must be true. }
        agreed: { type: boolean, description: Must be true. }
        clientAt:
          {
            type: string,
            format: date-time,
            description: The device's clock when they tapped "I agree".,
          }
    WorkerCredentialKind:
      type: string
      enum: [white_card, high_risk_licence, trade_licence, other]
    WorkerCredential:
      type: object
      required:
        [
          id,
          workerId,
          kind,
          number,
          issuingState,
          licenceClass,
          issuedOn,
          expiresOn,
          fileIds,
          status,
          sightedBy,
          sightedAt,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, pattern: '^wcr_[0-9A-Za-z]{26}$' }
        workerId: { type: string }
        kind: { $ref: '#/components/schemas/WorkerCredentialKind' }
        number: { type: string }
        issuingState: { oneOf: [{ $ref: '#/components/schemas/AuState' }, { type: 'null' }] }
        licenceClass: { type: [string, 'null'] }
        issuedOn: { type: [string, 'null'], format: date }
        expiresOn: { type: [string, 'null'], format: date }
        fileIds: { type: array, items: { $ref: '#/components/schemas/FileRef' } }
        status:
          type: string
          enum: [recorded, sighted]
          description: '"Recorded" as the worker entered it, or "sighted" once a site manager has seen the card. Never "verified" (IND-AC7).'
        sightedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        sightedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    WorkerCredentialList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WorkerCredential' } }
    CreateWorkerCredentialRequest:
      type: object
      additionalProperties: false
      required: [kind, number, fileIds]
      properties:
        kind: { $ref: '#/components/schemas/WorkerCredentialKind' }
        number: { type: string, minLength: 1, maxLength: 50 }
        issuingState: { $ref: '#/components/schemas/AuState' }
        licenceClass: { type: string, minLength: 1, maxLength: 100 }
        issuedOn: { type: string, format: date }
        expiresOn: { type: string, format: date }
        fileIds:
          description: Photos of the card, front and back.
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/FileRef' }
    InductionRegisterEntry:
      type: object
      required: [worker, status, completion, credentials]
      properties:
        worker: { $ref: '#/components/schemas/Worker' }
        status:
          type: string
          enum: [current, needs_reinduction, expired, in_progress, not_inducted]
        completion:
          oneOf:
            - type: object
              required: [id, versionNumber, completedAt, expiresOn, score, method]
              properties:
                id: { type: string }
                versionNumber: { type: integer }
                completedAt: { type: [string, 'null'], format: date-time }
                expiresOn: { type: [string, 'null'], format: date }
                score: { type: [integer, 'null'] }
                method: { type: string, enum: [self, assisted, link] }
            - { type: 'null' }
        credentials:
          description: What's on file. Card numbers and photos stay on the worker's credential list.
          type: array
          items:
            type: object
            required: [kind, status, expiresOn]
            properties:
              kind: { $ref: '#/components/schemas/WorkerCredentialKind' }
              status: { type: string, enum: [recorded, sighted] }
              expiresOn: { type: [string, 'null'], format: date }
    InductionRegister:
      type: object
      required: [inductionId, requiredVersion, data]
      properties:
        inductionId: { type: [string, 'null'] }
        requiredVersion: { type: [integer, 'null'] }
        data: { type: array, items: { $ref: '#/components/schemas/InductionRegisterEntry' } }
    InductionLinkState:
      type: string
      enum: [active, expired, revoked, used_up]
    InductionLink:
      type: object
      required:
        [
          id,
          inductionId,
          label,
          recipientEmail,
          recipientPhone,
          state,
          expiresAt,
          maxUses,
          useCount,
          lastUsedAt,
          createdAt,
          createdBy,
          revokedAt,
        ]
      properties:
        id: { type: string, pattern: '^lnk_[0-9A-Za-z]{26}$' }
        inductionId: { type: string }
        label: { type: [string, 'null'] }
        recipientEmail: { type: [string, 'null'] }
        recipientPhone: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/InductionLinkState' }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: [integer, 'null'] }
        useCount: { type: integer }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        revokedAt: { type: [string, 'null'], format: date-time }
    InductionLinkList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/InductionLink' } }
    CreateInductionLinkRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          description: 'Who it is for, e.g. "Sparkies crew" or "Gate poster".'
          type: string
          minLength: 1
          maxLength: 200
        recipientEmail: { type: string, format: email, maxLength: 254 }
        recipientPhone: { $ref: '#/components/schemas/MobileNumber' }
        expiresInDays: { type: integer, minimum: 1, maximum: 90, default: 30 }
        maxUses:
          description: How many times the link can be opened. Unlimited when left out.
          type: integer
          minimum: 1
          maximum: 10000
    InductionLinkCreated:
      type: object
      required: [link, token, url]
      properties:
        link: { $ref: '#/components/schemas/InductionLink' }
        token: { type: string, description: 'Shown once. Only its hash is stored.' }
        url:
          {
            type: string,
            description: 'The page workers open (`/i/<token>`); also what the QR poster encodes.',
          }
    MobileNumber:
      description: 'Mobile in E.164, e.g. `+61412345678`.'
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
    OpenInductionAccessRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^arl_[A-Za-z0-9_-]{64}$' }
    InductionAccess:
      type: object
      required:
        [
          orgName,
          projectName,
          siteName,
          inductionTitle,
          versionNumber,
          publishedAt,
          sectionCount,
          languages,
          companies,
          verified,
          verifiedTo,
          worker,
          completionId,
          completionStatus,
          expiresAt,
        ]
      properties:
        orgName: { type: string }
        projectName: { type: string }
        siteName: { type: [string, 'null'] }
        inductionTitle: { type: string }
        versionNumber: { type: integer }
        publishedAt: { type: string, format: date-time }
        sectionCount: { type: integer }
        languages:
          description: Languages Nova can translate into for this worker (reviewed ones only).
          type: array
          items:
            type: object
            required: [code, name, nativeName]
            properties:
              code: { type: string }
              name: { type: string }
              nativeName: { type: string }
        companies:
          description: Companies on the project, for the worker to pick theirs (design/08 B2).
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: '#/components/schemas/CompanyRef' }
              name: { type: string }
        verified: { type: boolean }
        verifiedTo: { type: [string, 'null'], description: 'Masked, e.g. `+61 4•• ••• 678`.' }
        worker:
          oneOf:
            - type: object
              required: [fullName, companyName, returning]
              properties:
                fullName: { type: string }
                companyName: { type: [string, 'null'] }
                returning:
                  {
                    type: boolean,
                    description: 'Known from another induction by this mobile number.',
                  }
            - { type: 'null' }
        completionId: { type: [string, 'null'] }
        completionStatus: { type: string, enum: [not_started, in_progress, completed] }
        expiresAt:
          {
            type: string,
            format: date-time,
            description: When this browser's session on the link ends.,
          }
    SendInductionAccessCodeRequest:
      type: object
      additionalProperties: false
      required: [channel, to]
      properties:
        channel: { type: string, enum: [sms, email] }
        to:
          description: E.164 mobile for `sms`, an email address for `email`.
          type: string
          minLength: 3
          maxLength: 254
    InductionAccessCodeSent:
      type: object
      required: [channel, to, expiresAt, resendAfter]
      properties:
        channel: { type: string, enum: [sms, email] }
        to: { type: string, description: Masked. }
        expiresAt: { type: string, format: date-time }
        resendAfter: { type: string, format: date-time }
    VerifyInductionAccessRequest:
      type: object
      additionalProperties: false
      required: [code, fullName]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        companyId: { $ref: '#/components/schemas/CompanyRef' }
        companyName:
          description: '"My company isn''t listed": the name as typed, flagged to the site manager.'
          type: string
          minLength: 1
          maxLength: 200
        siteId: { type: string, pattern: '^wst_[0-9A-Za-z]{26}$' }
    CreateLinkUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, mime, sizeBytes, sha256]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime:
          { type: string, enum: [image/jpeg, image/png, image/heic, image/webp, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    TranslateInductionRequest:
      type: object
      additionalProperties: false
      required: [lang]
      properties:
        lang: { type: string, pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$' }
    AskInductionRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
    InductionAnswer:
      type: object
      required: [found, answer, citations]
      properties:
        found:
          {
            type: boolean,
            description: 'False when the induction does not cover it; `answer` then says to ask a supervisor.',
          }
        answer: { type: string }
        citations:
          type: array
          items:
            type: object
            required: [section, slideTitle, quote]
            properties:
              section: { type: integer, description: Index of the section the answer comes from. }
              slideTitle: { type: string }
              quote: { type: string }
    InductionTranslation:
      type: object
      required: [language, nativeName, label, keptInEnglish, versionNumber, sections, quiz]
      properties:
        language: { type: string }
        nativeName: { type: string }
        label:
          {
            type: string,
            description: 'Fixed label: machine translation, the English version is official.',
          }
        keptInEnglish: { type: string, description: Shown on anything left in English. }
        versionNumber: { type: integer }
        sections:
          description: Same order as the induction's sections and blocks. Only slides and text blocks are translated.
          type: array
          items:
            type: object
            required: [section, blocks]
            properties:
              section: { type: integer }
              blocks:
                type: array
                items:
                  type: object
                  required: [block, translated, slides]
                  properties:
                    block: { type: integer }
                    translated: { type: boolean }
                    slides:
                      description: 'For a text block: one slide whose first point is the body.'
                      type: array
                      items:
                        type: object
                        required: [title, points, script]
                        properties:
                          title: { type: string }
                          points: { type: array, items: { type: string } }
                          script: { type: array, items: { type: string } }
        quiz:
          type: array
          items:
            type: object
            required: [questionId, translated, question, options]
            properties:
              questionId: { type: string }
              translated: { type: boolean }
              question: { type: string }
              options: { type: array, items: { type: string } }
    InspectionResponseType:
      type: string
      enum: [pass_fail_na, yes_no, number, text, photo, signature, select]
    InspectionResult:
      type: string
      enum: [pass, fail, na]
    InspectionStatus:
      type: string
      enum: [scheduled, in_progress, submitted, closed]
    InspectionTemplate:
      type: object
