      in: path
      required: true
      schema: { type: string, pattern: '^imp_[0-9A-Za-z]{26}$' }
    LateSubmissionId:
      name: lateSubmissionId
      in: path
      required: true
      schema: { type: string, pattern: '^lsb_[0-9A-Za-z]{26}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read. Missing → 428, stale → 412.
      schema: { type: string }
    MeetingSeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, pattern: '^msr_[0-9A-Za-z]{26}$' }
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema: { type: string, pattern: '^mtg_[0-9A-Za-z]{26}$' }
    MeetingItemId:
