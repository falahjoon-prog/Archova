          type: array
          description: History, oldest first.
          items: { $ref: '#/components/schemas/SwmsEvent' }
        acknowledgements:
          type: array
          description: Acknowledgements of the current revision.
          items: { $ref: '#/components/schemas/SwmsAcknowledgement' }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/SwmsGap' }
        advisories:
          type: array
