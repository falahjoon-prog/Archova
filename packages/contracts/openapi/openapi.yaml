  /v1/orgs/{orgId}/projects/{projectId}/takeoff-measurements/batch:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createAssistedTakeoffMeasurements
      tags: [estimating]
      x-module: estimating
      x-flag: nova_estimating
      x-permission: estimating.takeoff.manage
      summary: Save what Nova found on a sheet as unconfirmed marks (Nova Esti assisted takeoff).
      description: |
        Saves up to 200 marks together, all or none, as `assisted` measurements that wait for a person. None counts
        toward a quantity, scope line or estimate until it is confirmed. Each item is checked like a single measurement:
        its shape must fit its kind and a count's quantity is the number of points. The quantity is worked out by
        the client from the sheet's confirmed scale, never by the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionId, items]
              properties:
                revisionId: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [label, kind, geometry, quantity, unit, confidence]
                    properties:
                      label: { type: string, minLength: 1, maxLength: 200 }
                      kind: { $ref: '#/components/schemas/TakeoffKind' }
                      geometry: { $ref: '#/components/schemas/TakeoffGeometry' }
                      quantity: { type: string, pattern: '^[0-9]{1,15}(\.[0-9]{1,3})?$' }
                      unit: { type: string, minLength: 1, maxLength: 20 }
                      confidence: { type: number, minimum: 0, maximum: 1 }
      responses:
        '201':
          description: Saved, unconfirmed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TakeoffMeasurement' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/takeoff-measurements/confirm-batch:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: confirmTakeoffMeasurements
      tags: [estimating]
      x-module: estimating
      x-permission: estimating.takeoff.confirm
      summary: A person accepts many of Nova's marks on a sheet at once.
      description: |
        Accepts Nova's pending marks on one drawing revision, either the `ids` given, or every pending mark at least
        `minConfidence` sure ("Accept 90% and over"), or both. Hand-drawn marks and rejected marks are never touched.
        Returns the marks it accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionId]
              minProperties: 2
              properties:
                revisionId: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, pattern: '^tkm_[0-9A-Za-z]{26}$' }
                minConfidence: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: The marks accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TakeoffMeasurement' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/takeoff-measurements/{measurementId}/reject:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TakeoffMeasurementId'
    post:
      operationId: rejectTakeoffMeasurement
      tags: [estimating]
      x-module: estimating
      x-permission: estimating.takeoff.confirm
      summary: A person turns down a mark Nova drew; it stays struck through and never counts.
      description: Only marks Nova drew can be rejected; a hand-drawn measurement is deleted instead. Confirming it later undoes the rejection.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakeoffMeasurement' }
        default: { $ref: '#/components/responses/Problem' }
