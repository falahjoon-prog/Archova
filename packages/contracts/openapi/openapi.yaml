openapi: 3.1.0
info:
  title: Archova API
  version: 1.0.0
  description: |
    Contract-first source of truth for the Archova API (ADR-0002). Server validation, TypeScript types,
    zod schemas and the web/mobile api-client are generated from this file with `pnpm gen`.

    Standard behaviours (docs/architecture/api.md §3): prefixed UUIDv7 ids, cursor pagination,
    RFC 9457 problem responses with a stable `code`, ETag/If-Match on updates, Idempotency-Key on POST.
servers:
  - url: https://app.{domain}
    description: Browser (same-origin, `__Host-sid` cookie only)
    variables:
      domain: { default: example.com }
  - url: https://api.{domain}
    description: Mobile, public API and integrations (bearer only)
    variables:
      domain: { default: example.com }
tags:
  - name: auth
  - name: me
  - name: orgs
  - name: projects
  - name: companies
  - name: access
  - name: billing
  - name: files
  - name: oauth
  - name: documents
  - name: ai
paths:
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      x-module: identity
      x-auth: none
      summary: Create an account with email and password and start a web session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created; `__Host-sid` and `__Host-csrf` cookies set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      x-module: identity
      x-auth: none
      summary: Sign in with email and password and start a web session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in; `__Host-sid` and `__Host-csrf` cookies set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-module: identity
      summary: Revoke the current session.
      responses:
        '204': { description: Signed out }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      x-module: identity
      summary: The current session, with a fresh CSRF token for cookie clients.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/oauth/authorize:
    get:
      operationId: oauthAuthorize
      tags: [oauth]
      x-module: identity
      x-auth: none
      x-internal: true
      summary: OAuth 2.1 authorisation endpoint (code + PKCE S256) for first-party mobile clients.
      description: |
        Requires a signed-in web session on `app.<domain>`. Redirects to the client's registered redirect URI
        with `code` and `state`. Unauthenticated users are redirected to the web sign-in page.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - {
            name: code_challenge,
            in: query,
            required: true,
            schema: { type: string, minLength: 43, maxLength: 128 },
          }
        - {
            name: code_challenge_method,
            in: query,
            required: true,
            schema: { type: string, enum: [S256] },
          }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        '302': { description: Redirect to the client with an authorisation code }
        default: { $ref: '#/components/responses/Problem' }
  /v1/oauth/token:
    post:
      operationId: oauthToken
      tags: [oauth]
      x-module: identity
      x-auth: none
      summary: Exchange an authorisation code or rotate a refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/oauth/revoke:
    post:
      operationId: oauthRevoke
      tags: [oauth]
      x-module: identity
      x-auth: none
      summary: Revoke a refresh token and its session (RFC 7009).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/RevokeRequest' }
      responses:
        '200': { description: Revoked (also returned for unknown tokens) }
        default: { $ref: '#/components/responses/Problem' }
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [oauth]
      x-module: identity
      x-auth: none
      summary: Public keys for verifying access tokens.
      responses:
        '200':
          description: JWK set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      x-module: platform
      summary: The current user and every org they can open.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      x-module: platform
      summary: Create an organisation. The caller becomes its owner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrgRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getOrg
      tags: [orgs]
      x-module: platform
      responses:
        '200':
          description: The organisation
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/entitlements:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getEntitlements
      tags: [billing]
      x-module: billing
      summary: Modules and limits this org is licensed for (X23).
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listProjects
      tags: [projects]
      x-module: platform
      summary: Projects the caller can see in this org.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createProject
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.read
      responses:
        '200':
          description: The project
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateProject
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.update
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectMembers
      tags: [projects]
      x-module: platform
      x-permission: platform.project_members.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of project members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addProjectMember
      tags: [projects]
      x-module: platform
      x-permission: platform.project_members.manage
      summary: Add an existing user to the project with a company and permission template.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProjectMemberRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/permissions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectPermissions
      tags: [access]
      x-module: access
      summary: The caller's effective permissions on this project, for hiding UI.
      responses:
        '200':
          description: Effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/permission-templates:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listPermissionTemplates
      tags: [access]
      x-module: access
      x-permission: access.templates.read
      responses:
        '200':
          description: Permission templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionTemplate' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/companies:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listCompanies
      tags: [companies]
      x-module: platform
      x-permission: platform.companies.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of companies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCompany
      tags: [companies]
      x-module: platform
      x-permission: platform.companies.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/uploads:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: createUpload
      tags: [files]
      x-module: files
      summary: Start an upload. Returns a presigned URL; the file goes straight to storage, never through the API.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - {
          name: uploadId,
          in: path,
          required: true,
          schema: { type: string, pattern: '^upl_[0-9A-Za-z]{26}$' },
        }
    post:
      operationId: completeUpload
      tags: [files]
      x-module: files
      summary: Tell the API the client finished uploading. Verifies, scans and stores the file.
      responses:
        '200':
          description: The stored file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileObject' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: getFile
      tags: [files]
      x-module: files
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileObject' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/files/{fileId}/download:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: getFileDownload
      tags: [files]
      x-module: files
      summary: A short-lived signed URL for downloading the file.
      responses:
        '200':
          description: Signed URL (5 minutes)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadLink' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/folders:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listFolders
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.read
      summary: Every folder in the project the caller can open, flat; clients build the tree from `parentId`.
      responses:
        '200':
          description: Folders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createFolder
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.manage
      summary: Create a folder. Private folders need `documents.folders.restrict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/folders/{folderId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FolderId'
    patch:
      operationId: updateFolder
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.manage
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFolderRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listDocuments
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.read
      parameters:
        - { name: folderId, in: query, schema: { type: string, pattern: '^fld_[0-9A-Za-z]{26}$' } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of documents in folders the caller can open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDocument
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.manage
      summary: Register a document with its first revision.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.read
      responses:
        '200':
          description: The document with every revision, newest first
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateDocument
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.manage
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDocumentRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/documents/{documentId}/revisions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: addDocumentRevision
      tags: [documents]
      x-module: documents
      x-permission: documents.documents.manage
      summary: Add a revision from an uploaded file. It becomes current; the previous one is superseded.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRevisionInput' }
      responses:
        '201':
          description: The document with its new current revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-sets:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listDrawingSets
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Drawing sets, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingSetPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDrawingSet
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.manage
      summary: Start registering an issue of drawings. Sheets are added for review, then published together.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDrawingSetRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingSet' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-sets/{drawingSetId}/review:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingSetId'
    get:
      operationId: getDrawingSetReview
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.read
      summary: The sheets in a set and the conflicts that publishing would hit (DOC-AC3).
      responses:
        '200':
          description: Review table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingSetReview' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-sets/{drawingSetId}/revisions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingSetId'
    post:
      operationId: addDrawingSetRevision
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.manage
      summary: Add a sheet to an unpublished set, as read from its title block.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftDrawingRevisionInput' }
      responses:
        '201':
          description: Draft revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingRevision' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-sets/{drawingSetId}/revisions/{drawingRevisionId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingSetId'
      - $ref: '#/components/parameters/DrawingRevisionId'
    patch:
      operationId: updateDraftDrawingRevision
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.manage
      summary: Correct a sheet before the set is published (DOC-AC2).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDraftDrawingRevisionRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingRevision' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeDraftDrawingRevision
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.manage
      summary: Take a sheet out of an unpublished set.
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-sets/{drawingSetId}/publish:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingSetId'
    post:
      operationId: publishDrawingSet
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.manage
      summary: |
        Make every sheet in the set current and supersede the previous revisions in one step (DOC-AC4).
        Fails with `drawing_set.publish_conflicts` until new sheets are confirmed and older revisions have a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishDrawingSetRequest' }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingSetReview' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listDrawings
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.read
      summary: The drawing register, each sheet with its current revision (DOC-AC5).
      parameters:
        - { name: discipline, in: query, schema: { type: string, maxLength: 20 } }
        - { name: issuedFor, in: query, schema: { $ref: '#/components/schemas/IssuedFor' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of sheets ordered by sheet number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingSheetPage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawings/{drawingSheetId}/revisions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingSheetId'
    get:
      operationId: listDrawingSheetRevisions
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.read
      summary: Every published revision of a sheet, newest first.
      responses:
        '200':
          description: History
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingRevisionList' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-revisions/{drawingRevisionId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingRevisionId'
    get:
      operationId: getDrawingRevision
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.read
      summary: One revision. A superseded one names its successor for the banner (DOC-AC6).
      responses:
        '200':
          description: The revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingRevision' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-revisions/{drawingRevisionId}/markups:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingRevisionId'
    get:
      operationId: listMarkups
      tags: [documents]
      x-module: documents
      x-permission: documents.drawings.read
      summary: Markups on this revision the caller can see (own, own company's, published).
      responses:
        '200':
          description: Markups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkupList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMarkup
      tags: [documents]
      x-module: documents
      x-permission: documents.markups.create
      summary: Mark up a sheet. `project` visibility publishes it and needs `documents.markups.publish`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMarkupRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Markup' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/drawing-revisions/{drawingRevisionId}/markups/{markupId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingRevisionId'
      - $ref: '#/components/parameters/MarkupId'
    patch:
      operationId: updateMarkup
      tags: [documents]
      x-module: documents
      x-permission: documents.markups.create
      summary: |
        Change the author's own markup. Publishing (`visibility: project`) is one-way; a published markup only
        accepts `locationConfirmed` after it was carried forward to a new revision (DOC-AC7, DOC-AC8).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMarkupRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Markup' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMarkup
      tags: [documents]
      x-module: documents
      x-permission: documents.markups.create
      summary: Delete the author's own unpublished markup.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/transmittals:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listTransmittals
      tags: [documents]
      x-module: documents
      x-permission: documents.transmittals.read
      summary: All transmittals for people who issue them; otherwise the ones the caller received.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Transmittals, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTransmittal
      tags: [documents]
      x-module: documents
      x-permission: documents.transmittals.manage
      summary: Draft a transmittal. `currentSetDisciplines` adds every current drawing of those disciplines (DOC-AC12).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransmittalRequest' }
      responses:
        '201':
          description: Draft
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/transmittals/{transmittalId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TransmittalId'
    get:
      operationId: getTransmittal
      tags: [documents]
      x-module: documents
      x-permission: documents.transmittals.read
      responses:
        '200':
          description: The transmittal with items and per-recipient receipts
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/transmittals/{transmittalId}/send:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TransmittalId'
    post:
      operationId: sendTransmittal
      tags: [documents]
      x-module: documents
      x-permission: documents.transmittals.manage
      summary: Number and send the transmittal. It can't change afterwards (DOC-AC10).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sent
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/transmittals/{transmittalId}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TransmittalId'
    post:
      operationId: acknowledgeTransmittal
      tags: [documents]
      x-module: documents
      x-permission: documents.transmittals.read
      summary: A recipient records that they opened, downloaded or acknowledged it (DOC-AC11). First time wins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeTransmittalRequest' }
      responses:
        '200':
          description: The caller's receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmittalRecipient' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/ai/settings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getAiSettings
      tags: [ai]
      x-module: ai
      x-permission: ai.settings.read
      summary: Nova settings for this org (ai/04 §8). Defaults apply until an admin changes them.
      responses:
        '200':
          description: Settings
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSettings' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAiSettings
      tags: [ai]
      x-module: ai
      x-permission: ai.settings.manage
      summary: Turn Nova or single features on or off, set a monthly credit cap and body retention.
      description: Send `If-Match` with the ETag from `getAiSettings` (`"0"` before the first change).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAiSettingsRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSettings' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/ai/usage:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getAiUsage
      tags: [ai]
      x-module: ai
      x-permission: ai.usage.read
      summary: Nova credits used this month by feature, against the allowance (ai/05 §6).
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/ai/runs/{runId}/feedback:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: runId
        in: path
        required: true
        schema: { type: string, pattern: '^air_[0-9A-Za-z]{26}$' }
    put:
      operationId: submitAiFeedback
      tags: [ai]
      x-module: ai
      summary: Thumbs up or down on a Nova output (ai/06 §5). Only the person who asked can rate it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiFeedbackRequest' }
      responses:
        '204': { description: Saved }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/drawing-register/extractions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: extractDrawingRegister
      tags: [ai]
      x-module: ai
      x-permission: ai.drawing_register.extract
      summary: Nova reads the title block of every sheet in an uploaded drawing PDF or image (F1).
      description: |
        Each sheet becomes a pending suggestion with the drawing number, title, revision, discipline, date and scale,
        the fields a person must check (`flagged`), and how it matches the register (new drawing, new revision...).
        Nothing is added to the register until a person accepts. Re-running a file replaces its pending suggestions.
        Pages without a text layer (scans) are listed in `skippedPages` until OCR lands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileId]
              properties:
                fileId: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
      responses:
        '200':
          description: Suggestions, one per sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingRegisterExtraction' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/suggestions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAiSuggestions
      tags: [ai]
      x-module: ai
      x-permission: ai.suggestions.read
      summary: Nova suggestions on this project, newest first.
      parameters:
        - { name: task, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AiSuggestionStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/suggestions/{suggestionId}/decision:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: suggestionId
        in: path
        required: true
        schema: { type: string, pattern: '^ais_[0-9A-Za-z]{26}$' }
    post:
      operationId: decideAiSuggestion
      tags: [ai]
      x-module: ai
      x-permission: ai.suggestions.read
      summary: Accept, edit or reject a Nova suggestion (ai/04 §7).
      description: Also needs the permission of the suggestion's own feature (for drawing sheets, `ai.drawing_register.extract`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSuggestionDecision' }
      responses:
        '200':
          description: The decided suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, pattern: '^org_[0-9A-Za-z]{26}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^prj_[0-9A-Za-z]{26}$' }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, pattern: '^fld_[0-9A-Za-z]{26}$' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, pattern: '^doc_[0-9A-Za-z]{26}$' }
    DrawingSetId:
      name: drawingSetId
      in: path
      required: true
      schema: { type: string, pattern: '^dst_[0-9A-Za-z]{26}$' }
    DrawingSheetId:
      name: drawingSheetId
      in: path
      required: true
      schema: { type: string, pattern: '^dsh_[0-9A-Za-z]{26}$' }
    DrawingRevisionId:
      name: drawingRevisionId
      in: path
      required: true
      schema: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
    MarkupId:
      name: markupId
      in: path
      required: true
      schema: { type: string, pattern: '^mku_[0-9A-Za-z]{26}$' }
    TransmittalId:
      name: transmittalId
      in: path
      required: true
      schema: { type: string, pattern: '^trm_[0-9A-Za-z]{26}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read. Missing → 428, stale → 412.
      schema: { type: string }
  headers:
    ETag:
      description: Row version, quoted (`"3"`).
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          { type: string, description: 'Stable machine-readable code, e.g. `rfi.already_closed`' }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    Email:
      type: string
      format: email
      maxLength: 320
    Password:
      type: string
      minLength: 10
      maxLength: 256
    User:
      type: object
      required: [id, email, name, locale, timezone]
      properties:
        id: { type: string, pattern: '^usr_[0-9A-Za-z]{26}$' }
        email: { $ref: '#/components/schemas/Email' }
        name: { type: string }
        locale: { type: string }
        timezone: { type: [string, 'null'] }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        name: { type: string, minLength: 1, maxLength: 200 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 256 }
    SessionInfo:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken:
          {
            type: string,
            description: 'Echo in `X-CSRF-Token` on unsafe cookie requests (ADR-0004 §5)',
          }
        expiresAt: { type: string, format: date-time }
    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string }
        code: { type: string }
        redirect_uri: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }
    RevokeRequest:
      type: object
      required: [token, client_id]
      properties:
        token: { type: string }
        client_id: { type: string }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: object, additionalProperties: true }
    MembershipSummary:
      type: object
      required: [orgId, orgName, orgSlug, role, kind]
      properties:
        orgId: { type: string }
        orgName: { type: string }
        orgSlug: { type: string }
        role:
          {
            type: [string, 'null'],
            enum: [owner, admin, billing_admin, member, null],
            description: 'Null for external collaborators',
          }
        kind: { type: string, enum: [member, external] }
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    Org:
      type: object
      required: [id, name, slug, country, timezone, kind, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        legalName: { type: [string, 'null'] }
        abn: { type: [string, 'null'] }
        slug: { type: string }
        country: { type: string }
        timezone: { type: string }
        kind: { type: string, enum: [builder, subcontractor_free] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    Abn:
      type: string
      pattern: '^[0-9]{11}$'
    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        legalName: { type: string, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,46})[a-z0-9]$' }
        abn: { $ref: '#/components/schemas/Abn' }
        country:
          { type: string, pattern: '^[A-Z]{2}$', description: 'ISO 3166-1 alpha-2; default AU' }
        timezone:
          { type: string, maxLength: 64, description: 'IANA time zone; default Australia/Sydney' }
    AuState:
      type: string
      enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT]
    ProjectStatus:
      type: string
      enum: [tender, active, on_hold, closed, archived]
    Address:
      type: object
      additionalProperties: false
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        suburb: { type: string, maxLength: 100 }
        state: { $ref: '#/components/schemas/AuState' }
        postcode: { type: string, maxLength: 10 }
        country: { type: string, maxLength: 2 }
    GeoPoint:
      type: object
      description: WGS 84 decimal degrees (X32)
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    GeoFix:
      type: object
      description: A recorded position and how good it was
      additionalProperties: false
      required: [lat, lng, source]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
