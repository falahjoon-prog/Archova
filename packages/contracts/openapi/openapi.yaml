          }
        invalidReason: { type: [string, 'null'] }
        claimedGross: { $ref: '#/components/schemas/FinancialsMoney' }
        lessPrevious: { $ref: '#/components/schemas/FinancialsMoney' }
        retention: { $ref: '#/components/schemas/FinancialsMoney' }
        claimedNet: { $ref: '#/components/schemas/FinancialsMoney' }
        gst: { $ref: '#/components/schemas/FinancialsMoney' }
        claimedTotal: { $ref: '#/components/schemas/FinancialsMoney' }
        servedOn: { type: [string, 'null'], format: date }
        scheduleDueOn: { type: [string, 'null'], format: date }
        paymentDueOn: { type: [string, 'null'], format: date }
        paymentReadDown:
          {
            type: boolean,
            description: The contract's payment term was longer than the Act allows and was read down.,
          }
        ruleState: { type: [string, 'null'] }
