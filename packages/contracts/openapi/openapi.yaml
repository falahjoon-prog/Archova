        type: { $ref: '#/components/schemas/ObservationType' }
        hazard: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        location: { type: [string, 'null'], minLength: 1, maxLength: 300 }
