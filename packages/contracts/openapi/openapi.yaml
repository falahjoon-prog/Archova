        [
          id,
          contractId,
          number,
          periodEnd,
          receivedAt,
          statesAct,
          isValid,
          invalidReason,
          claimedGross,
          lessPrevious,
          retention,
          claimedNet,
          gst,
          claimedTotal,
          servedOn,
          scheduleDueOn,
          paymentDueOn,
          paymentReadDown,
          ruleState,
          rulesReviewed,
          status,
          daysToScheduleDue,
        ]
      properties:
        id: { type: string, pattern: '^pcl_[0-9A-Za-z]{26}$' }
        contractId: { type: string, pattern: '^cnt_[0-9A-Za-z]{26}$' }
