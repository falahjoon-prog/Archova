        conflicts:
          type: array
          items: { $ref: '#/components/schemas/PublishConflict' }
    PublishDrawingSetRequest:
      type: object
      additionalProperties: false
      properties:
        confirmNewSheets: { type: boolean }
        reasons:
          type: array
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required: [revisionId, reason]
            properties:
              revisionId: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
              reason: { type: string, minLength: 1, maxLength: 500 }
    DrawingSheet:
      type: object
      required:
        [id, projectId, sheetNumber, title, discipline, area, currentRevision, updatedAt, version]
      properties:
        id: { type: string }
        projectId: { type: string }
        sheetNumber: { type: string }
        title: { type: string }
        discipline: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        currentRevision:
          { oneOf: [{ $ref: '#/components/schemas/DrawingRevision' }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    DrawingSheetPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DrawingSheet' }
        nextCursor: { type: [string, 'null'] }
    MarkupVisibility:
      type: string
      enum: [private, company, project]
    MarkupPoint:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    MarkupShape:
      type: object
      description: One shape in normalised sheet coordinates (`@archova/markup`); fields depend on `kind`
      additionalProperties: false
      required: [id, kind]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [pen, line, arrow, rect, ellipse, cloud, text, pin] }
        points:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/MarkupPoint' }
        from: { $ref: '#/components/schemas/MarkupPoint' }
        to: { $ref: '#/components/schemas/MarkupPoint' }
        at: { $ref: '#/components/schemas/MarkupPoint' }
        text: { type: string, maxLength: 2000 }
        entityType: { type: string, maxLength: 50 }
        entityId: { type: string, maxLength: 64 }
        strokeWidth: { type: number, minimum: 0, maximum: 100 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    Markup:
      type: object
      required:
        [
          id,
          projectId,
          revisionId,
          ownerId,
          ownerCompanyId,
          visibility,
          shapes,
          copiedFromId,
          needsLocationCheck,
          publishedAt,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        revisionId: { type: string }
        ownerId: { type: string }
        ownerCompanyId: { type: [string, 'null'] }
        visibility: { $ref: '#/components/schemas/MarkupVisibility' }
        shapes:
          type: array
          items: { $ref: '#/components/schemas/MarkupShape' }
        copiedFromId: { type: [string, 'null'] }
        needsLocationCheck:
          {
            type: boolean,
            description: 'Carried forward from a superseded revision; show "check location"',
          }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    MarkupList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Markup' }
    CreateMarkupRequest:
      type: object
      additionalProperties: false
      required: [shapes]
      properties:
        visibility: { $ref: '#/components/schemas/MarkupVisibility' }
        shapes:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/MarkupShape' }
    UpdateMarkupRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        visibility: { $ref: '#/components/schemas/MarkupVisibility' }
        shapes:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/MarkupShape' }
        locationConfirmed:
          { type: boolean, description: "true confirms a carried-forward markup's location" }
    TransmittalPurpose:
      type: string
      enum: [for_information, for_review, for_construction, for_tender, other]
    Transmittal:
      type: object
      required:
        [
          id,
          projectId,
          number,
          subject,
          purpose,
          fromCompanyId,
          responseDue,
          message,
          status,
          sentAt,
          sentBy,
          createdAt,
          version,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        number: { type: [integer, 'null'], description: 'Issued on send, per project' }
        subject: { type: string }
        purpose: { $ref: '#/components/schemas/TransmittalPurpose' }
        fromCompanyId: { type: [string, 'null'] }
        responseDue: { type: [string, 'null'], format: date }
        message: { type: [string, 'null'] }
        status: { type: string, enum: [draft, sent] }
        sentAt: { type: [string, 'null'], format: date-time }
        sentBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    TransmittalItem:
      type: object
      required: [revisionType, revisionId, title, number, rev]
      properties:
        revisionType: { type: string, enum: [document, drawing] }
        revisionId: { type: string }
        title: { type: string }
        number: { type: [string, 'null'], description: 'Sheet or document number' }
        rev: { type: string }
    TransmittalRecipient:
      type: object
      required:
        [
          id,
          userId,
          companyId,
          email,
          name,
          role,
          deliveredAt,
          openedAt,
          downloadedAt,
          acknowledgedAt,
        ]
      properties:
        id: { type: string }
        userId: { type: [string, 'null'] }
        companyId: { type: [string, 'null'] }
        email: { type: string }
        name: { type: [string, 'null'] }
        role: { type: string, enum: [to, cc] }
        deliveredAt: { type: [string, 'null'], format: date-time }
        openedAt: { type: [string, 'null'], format: date-time }
        downloadedAt: { type: [string, 'null'], format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    TransmittalDetail:
      type: object
      required: [transmittal, items, recipients]
      properties:
        transmittal: { $ref: '#/components/schemas/Transmittal' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TransmittalItem' }
        recipients:
          type: array
          items: { $ref: '#/components/schemas/TransmittalRecipient' }
    TransmittalPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transmittal' }
        nextCursor: { type: [string, 'null'] }
    CreateTransmittalRequest:
      type: object
      additionalProperties: false
      required: [subject, purpose, recipients]
      properties:
        subject: { type: string, minLength: 1, maxLength: 300 }
        purpose: { $ref: '#/components/schemas/TransmittalPurpose' }
        fromCompanyId: { $ref: '#/components/schemas/CompanyRef' }
        responseDue: { type: string, format: date }
        message: { type: string, maxLength: 10000 }
        recipients:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { $ref: '#/components/schemas/Email' }
              name: { type: string, maxLength: 200 }
              companyId: { $ref: '#/components/schemas/CompanyRef' }
              role: { type: string, enum: [to, cc] }
        items:
          type: array
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required: [revisionType, revisionId]
            properties:
              revisionType: { type: string, enum: [document, drawing] }
              revisionId:
                {
                  type: string,
                  pattern: '^(rev|drv)_[0-9A-Za-z]{26}$',
                  description: 'rev_ or drv_',
                }
        currentSetDisciplines:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 20 }
    AcknowledgeTransmittalRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { type: string, enum: [opened, downloaded, acknowledged] }
