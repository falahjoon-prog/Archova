          openedAt,
          downloadedAt,
          acknowledgedAt,
        ]
      properties:
        id: { type: string }
        userId: { type: [string, 'null'] }
        companyId: { type: [string, 'null'] }
        email: { type: string }
        name: { type: [string, 'null'] }
        role: { type: string, enum: [to, cc] }
        deliveredAt: { type: [string, 'null'], format: date-time }
        openedAt: { type: [string, 'null'], format: date-time }
        downloadedAt: { type: [string, 'null'], format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    TransmittalDetail:
      type: object
      required: [transmittal, items, recipients]
      properties:
        transmittal: { $ref: '#/components/schemas/Transmittal' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TransmittalItem' }
        recipients:
          type: array
          items: { $ref: '#/components/schemas/TransmittalRecipient' }
    TransmittalPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transmittal' }
        nextCursor: { type: [string, 'null'] }
    CreateTransmittalRequest:
      type: object
      additionalProperties: false
      required: [subject, purpose, recipients]
      properties:
        subject: { type: string, minLength: 1, maxLength: 300 }
        purpose: { $ref: '#/components/schemas/TransmittalPurpose' }
        fromCompanyId: { $ref: '#/components/schemas/CompanyRef' }
        responseDue: { type: string, format: date }
        message: { type: string, maxLength: 10000 }
        recipients:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { $ref: '#/components/schemas/Email' }
