  /v1/orgs/{orgId}/projects/{projectId}/ai/drawing-register/extractions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: extractDrawingRegister
      tags: [ai]
      x-module: ai
      x-permission: ai.drawing_register.extract
      summary: Nova reads the title block of every sheet in an uploaded drawing PDF or image (F1).
      description: |
        Each sheet becomes a pending suggestion with the drawing number, title, revision, discipline, date and scale,
        the fields a person must check (`flagged`), and how it matches the register (new drawing, new revision...).
        Nothing is added to the register until a person accepts. Re-running a file replaces its pending suggestions.
        Scanned pages are read with OCR (Textract in Sydney) and their suggestions have `payload.scanned: true`.
        Pages with no text even after OCR are listed in `skippedPages`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileId]
              properties:
                fileId: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
      responses:
        '200':
          description: Suggestions, one per sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrawingRegisterExtraction' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/suggestions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAiSuggestions
      tags: [ai]
      x-module: ai
      x-permission: ai.suggestions.read
      summary: Nova suggestions on this project that the caller may see, newest first.
      description: Every project member can call this, but a row is listed only to the person who asked for it, or to someone who holds the permission that decides its feature (for drawing sheets, `ai.drawing_register.extract`). Drafts built from a person's own notes, photos, files or diary lines are theirs alone.
      parameters:
        - { name: task, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AiSuggestionStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/suggestions/{suggestionId}/decision:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: suggestionId
        in: path
        required: true
        schema: { type: string, pattern: '^ais_[0-9A-Za-z]{26}$' }
    post:
      operationId: decideAiSuggestion
      tags: [ai]
      x-module: ai
      x-permission: ai.suggestions.read
      summary: Accept, edit or reject a Nova suggestion (ai/04 §7).
      description: Also needs the permission of the suggestion's own feature (for drawing sheets, `ai.drawing_register.extract`). A suggestion the caller may not list is `ai.suggestion.not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSuggestionDecision' }
      responses:
        '200':
          description: The decided suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/ask:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: askNova
      tags: [ai]
      x-module: ai
      x-permission: ai.ask.use
      summary: Ask Nova a question about this project's documents, drawings and RFIs (F2).
      description: |
        Nova searches the current revisions the caller can open (private folders and drawing access apply) and
        answers with a citation to the exact document, revision and page for each claim. Builder staff with RFI
        access also search sent RFIs, their question and every response; an RFI is cited by its `rfi_` id, and other
        people never retrieve RFI text through Ask. When the project's records don't answer it, `found` is false and
        `closestMatches` lists the nearest passages instead of a guess. Costs one Nova credit when the model is
        called; nothing when no visible passage matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: The answer, or "not found" with the closest matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaAnswer' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/rfi-drafts:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: draftRfiWithNova
      tags: [ai]
      x-module: ai
      x-permission: rfis.rfis.create
      summary: Nova drafts an RFI from a note typed on site or a drawing markup (F3).
      description: |
        A note, a markup with text on it, a site photo, or any mix of them is needed. Nova turns them into an RFI subject and question, citing the drawings and spec clauses it refers to
        from the current revisions the caller can open. It also lists RFIs already raised on the same subject that
        the caller can see, and suggests assignees from who was asked those. Numbers in the draft that appear in
        neither the note nor a cited passage are listed in `unsupportedNumbers` for the person to check. Nova sends
        nothing: the draft fills the RFI form and the person edits and sends it, passing `suggestionId` as
        `aiSuggestionId` when they create the RFI. The draft is kept for the caller alone (it doesn't show in the
        project's suggestion list for anyone else). Costs one Nova credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 4000
                  description: What the RFI is about. May be empty when the markup has text on it.
                markup:
                  description: |
                    A markup the person drew on a drawing revision. Nova reads the words on it and the sheet's own
                    text around it, names the sheet and revision in the question, and returns where to pin the RFI.
                  type: object
                  additionalProperties: false
                  required: [drawingRevisionId, markupId]
                  properties:
                    drawingRevisionId: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
                    markupId: { type: string, pattern: '^mku_[0-9A-Za-z]{26}$' }
                photo:
                  description: |
                    A site photo already uploaded to this project (PNG, JPEG or WebP, up to 3 MB; the apps shrink
                    phone photos first). Nova looks at it and says what it shows. A photo shows a condition, not a
                    location, so `location` is listed in `gaps` unless the note gives one. Numbers read off the
                    photo are listed in `unsupportedNumbers`.
                  type: object
                  additionalProperties: false
                  required: [fileId]
                  properties:
                    fileId: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaRfiDraft' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/defect-tags:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: tagDefectWithNova
      tags: [ai]
      x-module: ai
      x-permission: defects.defects.create
      summary: Nova suggests a title, trade and priority for a defect from its photo (F5).
      description: |
        Nova looks at a defect photo and, when the defect is pinned on a drawing, the sheet's own text around the
        pin, and suggests a title, a description, the trade (`trade`, then up to two `alternativeTrades`), the kind of
        defect (`category`) and a priority. The place in the title is named only from the note or the sheet text
        near the pin, copied as printed. Companies on the project that list the trade come back in
        `suggestedCompanies` (the person picks the assignee; Nova never does), and open defects the caller can see
        pinned beside the same spot come back in `duplicates`, nearest first. Numbers in the suggestion that appear
        in neither the note nor the sheet text are listed in `unsupportedNumbers` for the person to check. Nova
        raises no defect: the suggestion fills the defect form and the person saves it, passing `suggestionId` as
        `aiSuggestionId` so the defect is marked `ai_suggested`. The suggestion is kept for the caller alone (it
        doesn't show in the project's suggestion list for anyone else). Costs a tenth of a Nova credit.
        The photo is a PNG, JPEG or WebP already uploaded to this project, up to 3 MB (the apps shrink phone photos
        first); anything else is a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photo]
              properties:
                photo:
                  type: object
                  additionalProperties: false
                  required: [fileId]
                  properties:
                    fileId: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
                note:
                  type: string
                  maxLength: 1000
                  description: What the person said or typed about the defect. May be empty.
                pin:
                  description: Where the defect is on a drawing; without it no place is named and no duplicates are found.
                  $ref: '#/components/schemas/DrawingPin'
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaDefectTag' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/import-mappings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: suggestImportMappingWithNova
      tags: [ai]
      x-module: ai
      x-permission: ai.import_mapping.suggest
      summary: Nova suggests which field each column of an import file fills (F31).
      description: |
        The import screen reads the file and sends, for each column, its header, up to five of its values and, for a
        column with at most 30 distinct values (a status or priority), those values. Nova suggests the field each
        column fills for the kind of record (`entity`), with a confidence, and for columns that fill a field with
        fixed values (status, priority) what each value in the file means. Code keeps only fields that exist, gives
        each field to one column, withdraws a suggestion whose values don't look like that kind of field (a date
        column of names), fills `examples` from the file, and lists the required fields no column fills in
        `missingRequired`. Nothing is imported: the person confirms or changes every suggestion, and the screen
        passes `suggestionId` when it starts the import job. The suggestion keeps no values from the file and is
        private to the caller. Costs a quarter of a Nova credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entity, columns]
              properties:
                entity: { $ref: '#/components/schemas/ImportEntity' }
                columns:
                  type: array
                  minItems: 1
                  maxItems: 80
                  items:
                    type: object
                    additionalProperties: false
                    required: [header, samples]
                    properties:
                      header: { type: string, maxLength: 200 }
                      samples:
                        type: array
                        maxItems: 5
                        items: { type: string, maxLength: 100 }
                      distinct:
                        type: array
                        maxItems: 30
                        items: { type: string, maxLength: 100 }
      responses:
        '200':
          description: The suggested mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaImportMapping' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/quote-readings:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: readQuoteWithNova
      tags: [ai]
      x-module: ai
      x-permission: estimating.quotes.review
      summary: Nova reads a subcontractor's PDF quote into lines, exclusions and qualifications (F22).
      description: |
        The estimator has the quote PDF uploaded to the project and names the tender package it answers (which must
        be out to tender). Nova reads the PDF text (scanned pages through OCR) against the package's scope lines and
        returns the priced lines (provisional sums marked), the exclusions and qualifications, the quote's reference,
        validity and printed total, each with the page and words it came from (`source`). Code keeps a source only
        when its words are on that page, flags a line whose amount is not printed on its page (`warning`), keeps
        discounts and priced options as qualifications, adds the lines up and sets them against the printed total
        (`totalCheck`). Nothing is saved as a quote: the estimator checks the reading against the PDF, picks the company
        and saves the quote with `suggestionId` as `aiSuggestionId`, then decides the suggestion. The suggestion is
        private to the caller. Costs one and a half Nova credits. A PDF with no readable text returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packageId, fileId]
              properties:
                packageId: { type: string, pattern: '^tpk_[0-9A-Za-z]{26}$' }
                fileId: { $ref: '#/components/schemas/FileRef' }
      responses:
        '200':
          description: The reading
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaQuoteReading' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/diary/{date}/nova-summary:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: date
        in: path
        required: true
        description: The diary day in the project's time zone (X34).
        schema: { type: string, format: date }
    post:
      operationId: summariseDiaryDayWithNova
      tags: [ai]
      x-module: ai
      x-permission: diary.entries.read
      summary: Nova drafts a short summary of one diary day (F4).
      description: |
        Nova writes a few plain sentences from the day's labour, plant, deliveries, visitors, delays and events
        that the caller can see. Every sentence names the diary lines it comes from (`sources`), and a sentence
        with a number or a source the lines don't back is dropped. Delays and stand-downs the summary doesn't
        mention are listed in `unmentionedDelays`, and a delay that weather or the lines suggest is listed in
        `possibleDelay` for the person to log. The result is a pending suggestion (`task` `diary.summary`): it is
        never written into the diary, the site manager edits it into the day's notes. Asking again before the day
        changes returns the same suggestion at no cost; any change to the day or its lines makes a new one.
        Costs half a Nova credit. An empty day returns 422 `ai.diary.nothing_to_summarise`.
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/diary/weeks/{weekStart}/nova-summary:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: weekStart
        in: path
        required: true
        description: The Monday the week starts on, in the project's time zone (X34).
        schema: { type: string, format: date }
    post:
      operationId: summariseDiaryWeekWithNova
      tags: [ai]
      x-module: ai
      x-permission: diary.entries.read
      summary: Nova drafts a short summary of one diary week for the client or head office (F4).
      description: |
        Nova writes a few plain sentences about the week, Monday to Sunday, from the diary days the caller can
        see (a subcontractor's summary is written from their own company's lines only). Every sentence names the
        diary lines, weather or totals it comes from (`sources`, each with the `date` of its day), and a sentence
        with a number or a source those facts don't back is dropped. The week's labour hours, busiest day and delay
        hours by cause are added up in code (`delayHours`), never by the model. Delays and stand-downs the summary
        doesn't mention are listed in `unmentionedDelays`. A day with more lines than the summary reads leaves out
        its routine lines (`truncated`), never its delays. The result is a pending suggestion (`task`
        `diary.weekly`) that only the person who asked can list or decide; it is never written into the diary.
        Asking again before the week changes returns the same suggestion at no cost. Costs one Nova credit.
        `weekStart` must be a Monday (422 otherwise); a week with no diary entry is 404 `diary.not_found`, and a
        week whose entries are empty is 422 `ai.diary.nothing_to_summarise`.
      responses:
        '200':
          description: The suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/drawing-revisions/{drawingRevisionId}/changes:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DrawingRevisionId'
    post:
      operationId: compareDrawingRevision
      tags: [ai]
      x-module: ai
      x-permission: documents.drawings.read
      summary: Nova says what changed on a drawing revision since the one it superseded (F21).
      description: |
        Software compares the text on this revision's sheet with the revision it superseded (scanned sheets are
        read with OCR) and lists every line added, removed or changed, with where it sits on the sheet. Nova puts
        those changes into plain words; an item that cites no real change or adds a number is removed, and changes
        no item describes are listed in `unexplainedChangeIds`. Linework and clouds aren't compared yet: use the
        overlay for those. Open RFIs the caller can see that are pinned to either revision are listed, with
        `nearChange` when a change sits near the pin. The wording is worked out once per revision pair and shared,
        costing half a Nova credit the first time and nothing after; no text changes means no model call. A POST
        because the first call does that work.
      responses:
        '200':
          description: What changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaDrawingCompare' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/induction-drafts:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: draftInduction
      tags: [ai]
      x-module: ai
      x-permission: ai.induction.draft
      summary: Nova drafts a site induction (slides, script and quiz) from the project's documents (F33).
      description: |
        Nova searches the project documents the caller can open for each required induction section
        (compliance/04 §2), then drafts slides, a speaker script and a quiz. Every point and quiz answer cites its
        source. A section the documents don't support comes back `missing` with what to add; nothing is invented.
        Points whose citation or numbers can't be checked against the source are removed and listed in
        `warnings`. The declaration and fixed safety sentences come from the reference table, not the model.
        The result is a pending suggestion (task `induction.draft`): the builder edits it in the induction editor
        and accepts or rejects it with the suggestion decision endpoint. Costs 3 Nova credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [siteName]
              properties:
                siteName: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: The draft, as a pending suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/ai/index:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: indexProjectForNova
      tags: [ai]
      x-module: ai
      x-permission: ai.project_index.run
      summary: Bring Nova's index of this project's documents, drawings and RFIs up to date.
      description: |
        Reads, chunks and embeds every published revision not yet indexed, marks older revisions superseded, applies
        folder moves to access, and drops deleted records. Sent RFIs are indexed from their question and responses:
        an RFI with a new response or an edit is indexed again and its old text dropped; drafts and voided RFIs are
        not indexed. Safe to repeat: finished revisions and unchanged RFIs are skipped. Runs in the
        request for now; the AI worker will run it on each document event once it lands. Embedding is background
        work and costs no credits.
      responses:
        '200':
          description: What this run did
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovaIndexReport' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/sync/pull:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: syncPull
      tags: [sync]
      x-module: sync
      summary: Changes to the requested scopes since a checkpoint, for the mobile offline store (backend 04 §4).
      description: |
        Reads the change feed after `since` for each scope, filtered to what the caller can see.
        `revokedScopes` is on every response (X14): the device purges that data and stops asking for it.
        The first load of a scope is `since=0`, paginated with `hasMore`.
      parameters:
        - name: scopes
          in: query
          required: true
          description: >-
            Scopes separated by `;`. A project segment lists its modules: `project:{projectId}:diary,defects;org`.
          schema: { type: string, minLength: 3, maxLength: 4000 }
        - name: since
          in: query
          required: true
          description: The `nextSince` from the last pull of these scopes, or `0`.
          schema: { type: string, pattern: '^[0-9]{1,20}$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      responses:
        '200':
          description: A page of changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
        '426': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/sync/push:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: syncPush
      tags: [sync]
      x-module: sync
      summary: Apply commands queued offline, in order, each in its own transaction (backend 04 §4).
      description: |
        `command` names a module use case (`defects.markReadyForReview`); permissions, state machines and
        audit are the same as the REST endpoint. `mutationId` is the idempotency key: a replay returns the
        stored result. A rejection with `access.revoked` is not stored, so the drain-grant retry (X38) can
        return `pending_review`. The retry sends `Authorization: Bearer <drainGrant.token>`; the grant arrives on
        the `access.revoked` problem (a 401 on any call or on a failed token refresh), on the per-mutation
        problem, or on the `revokedScopes` entry of a pull.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: One result per mutation, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '426': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
