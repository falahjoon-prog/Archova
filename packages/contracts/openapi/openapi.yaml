          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MeetingPerson' }
        agenda:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/MeetingAgendaSection' }
    UpdateMeetingSeriesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        cadence: { type: [string, 'null'], maxLength: 100 }
        defaultAttendees:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MeetingPerson' }
        agenda:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/MeetingAgendaSection' }
    CreateMeetingRequest:
      type: object
      additionalProperties: false
      required: [heldAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        heldAt: { type: string, format: date-time }
        location: { type: string, maxLength: 300 }
    UpdateMeetingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        heldAt: { type: string, format: date-time }
        location: { type: string, maxLength: 300 }
        chairUserId: { type: [string, 'null'], pattern: '^usr_[0-9A-Za-z]{26}$' }
