      in: path
      required: true
      schema: { type: string, pattern: '^mit_[0-9A-Za-z]{26}$' }
    MeetingVersion:
      name: version
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]{0,5}$' }
  headers:
    ETag:
      description: Row version, quoted (`"3"`).
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CreateMeetingSeriesRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
