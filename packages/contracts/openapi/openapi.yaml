      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listMeetingActions
      tags: [meetings]
      x-module: meetings
      x-permission: meetings.meetings.read
      summary: "Open actions across the project's meetings: yours and your company's by default (MTG-US9)."
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingActionList' }
        default: { $ref: '#/components/responses/Problem' }
