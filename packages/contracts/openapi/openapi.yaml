        closedAt: { type: [string, 'null'], format: date-time }
        voidReason: { type: [string, 'null'] }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    CorrespondenceResponse:
      type: object
      required: [id, authorId, authorCompanyId, body, fileIds, sentAt]
      properties:
        id: { type: string }
        authorId: { type: string }
        authorCompanyId: { type: [string, 'null'] }
        body: { type: string }
        fileIds:
          type: array
          items: { type: string }
        sentAt: { type: string, format: date-time }
    CorrespondenceDetail:
      type: object
      required: [item, responses]
      properties:
        item: { $ref: '#/components/schemas/CorrespondenceItem' }
        responses:
          type: array
          items: { $ref: '#/components/schemas/CorrespondenceResponse' }
    CorrespondencePage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CorrespondenceItem' }
        nextCursor: { type: [string, 'null'] }
    CreateCorrespondenceRequest:
      type: object
