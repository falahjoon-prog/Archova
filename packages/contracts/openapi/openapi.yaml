components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, pattern: '^org_[0-9A-Za-z]{26}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^prj_[0-9A-Za-z]{26}$' }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, pattern: '^fil_[0-9A-Za-z]{26}$' }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, pattern: '^fld_[0-9A-Za-z]{26}$' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, pattern: '^doc_[0-9A-Za-z]{26}$' }
    DrawingSetId:
      name: drawingSetId
      in: path
      required: true
      schema: { type: string, pattern: '^dst_[0-9A-Za-z]{26}$' }
    DrawingSheetId:
      name: drawingSheetId
      in: path
      required: true
      schema: { type: string, pattern: '^dsh_[0-9A-Za-z]{26}$' }
    DrawingRevisionId:
      name: drawingRevisionId
      in: path
      required: true
      schema: { type: string, pattern: '^drv_[0-9A-Za-z]{26}$' }
    MarkupId:
      name: markupId
      in: path
      required: true
      schema: { type: string, pattern: '^mku_[0-9A-Za-z]{26}$' }
    TransmittalId:
      name: transmittalId
      in: path
      required: true
      schema: { type: string, pattern: '^trm_[0-9A-Za-z]{26}$' }
    RfiId:
      name: rfiId
      in: path
      required: true
      schema: { type: string, pattern: '^rfi_[0-9A-Za-z]{26}$' }
    DefectId:
      name: defectId
      in: path
      required: true
      schema: { type: string, pattern: '^dfx_[0-9A-Za-z]{26}$' }
    TenderPackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, pattern: '^tpk_[0-9A-Za-z]{26}$' }
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: { type: string, pattern: '^quo_[0-9A-Za-z]{26}$' }
    TakeoffMeasurementId:
      name: measurementId
      in: path
      required: true
      schema: { type: string, pattern: '^tkm_[0-9A-Za-z]{26}$' }
    ImportJobId:
      name: importJobId
      in: path
      required: true
      schema: { type: string, pattern: '^imp_[0-9A-Za-z]{26}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read. Missing → 428, stale → 412.
      schema: { type: string }
  headers:
    ETag:
      description: Row version, quoted (`"3"`).
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        drainGrant:
          allOf: [{ $ref: '#/components/schemas/DrainGrant' }]
          description: Only on `access.revoked` (a sync call, or a token refresh that failed because access ended).
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          { type: string, description: 'Stable machine-readable code, e.g. `rfi.already_closed`' }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    DrainGrant:
      type: object
      required: [token, expiresAt, orgId, projectId, module]
      description: |
        Drain-only grant (X38) for work queued on a device before its access ended. The token is opaque, shown once
        (the server keeps only its hash), and accepted only as `Authorization: Bearer` on `syncPush`, where every
        mutation is held in the late-submissions queue and answered `pending_review`. It is bound to what was
        revoked: the whole organisation (`projectId` and `module` null), one project (`module` null) or one
        project module, and it cannot push into anything else.
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time, description: 72 hours after access ended. }
        orgId: { type: string }
        projectId: { type: [string, 'null'] }
        module: { type: [string, 'null'] }
    Email:
      type: string
      format: email
      maxLength: 320
    Password:
      type: string
      minLength: 10
      maxLength: 256
    User:
      type: object
      required: [id, email, name, locale, timezone]
      properties:
        id: { type: string, pattern: '^usr_[0-9A-Za-z]{26}$' }
        email: { $ref: '#/components/schemas/Email' }
        name: { type: string }
        locale: { type: string }
        timezone: { type: [string, 'null'] }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        name: { type: string, minLength: 1, maxLength: 200 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 256 }
    SessionInfo:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken:
          {
            type: string,
            description: 'Echo in `X-CSRF-Token` on unsafe cookie requests (ADR-0004 §5)',
          }
        expiresAt: { type: string, format: date-time }
    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string }
        code: { type: string }
        redirect_uri: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }
    RevokeRequest:
      type: object
      required: [token, client_id]
      properties:
        token: { type: string }
        client_id: { type: string }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: object, additionalProperties: true }
    MembershipSummary:
      type: object
      required: [orgId, orgName, orgSlug, role, kind]
      properties:
        orgId: { type: string }
        orgName: { type: string }
        orgSlug: { type: string }
        role:
          {
            type: [string, 'null'],
            enum: [owner, admin, billing_admin, member, null],
            description: 'Null for external collaborators',
          }
        kind: { type: string, enum: [member, external] }
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    Org:
      type: object
      required: [id, name, slug, country, timezone, kind, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        legalName: { type: [string, 'null'] }
        abn: { type: [string, 'null'] }
        slug: { type: string }
        country: { type: string }
        timezone: { type: string }
        kind: { type: string, enum: [builder, subcontractor_free] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    Abn:
      type: string
      pattern: '^[0-9]{11}$'
    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        legalName: { type: string, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,46})[a-z0-9]$' }
        abn: { $ref: '#/components/schemas/Abn' }
        country:
          { type: string, pattern: '^[A-Z]{2}$', description: 'ISO 3166-1 alpha-2; default AU' }
        timezone:
          { type: string, maxLength: 64, description: 'IANA time zone; default Australia/Sydney' }
    AuState:
      type: string
      enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT]
    ProjectStatus:
      type: string
      enum: [tender, active, on_hold, closed, archived]
    Address:
      type: object
      additionalProperties: false
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        suburb: { type: string, maxLength: 100 }
        state: { $ref: '#/components/schemas/AuState' }
        postcode: { type: string, maxLength: 10 }
        country: { type: string, maxLength: 2 }
    GeoPoint:
      type: object
      description: WGS 84 decimal degrees (X32)
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    GeoFix:
      type: object
      description: A recorded position and how good it was
      additionalProperties: false
      required: [lat, lng, source]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: [number, 'null'], minimum: 0 }
        headingDeg: { type: [number, 'null'], minimum: 0, maximum: 360 }
        source: { type: string, enum: [device, exif, manual, geocoded] }
    Capture:
      type: object
      description: When and where a photo or file was captured, as the device reported it
      additionalProperties: false
      properties:
        takenAt: { type: string, format: date-time }
        timeZone: { type: string, maxLength: 64, description: 'IANA zone the device was in' }
        location: { $ref: '#/components/schemas/GeoFix' }
    Project:
      type: object
      required:
        [
          id,
          orgId,
          name,
          number,
          status,
          state,
          timezone,
          address,
          siteLocation,
          geofenceRadiusM,
          startDate,
          endDate,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        number: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        state: { type: [string, 'null'], enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT, null] }
        timezone:
          { type: string, description: 'IANA time zone; local dates and deadlines use it (X32)' }
        address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
        siteLocation: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        geofenceRadiusM: { type: [integer, 'null'] }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        number: { type: string, maxLength: 50 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        state: { $ref: '#/components/schemas/AuState' }
        timezone: { type: string, maxLength: 64 }
        address: { $ref: '#/components/schemas/Address' }
        siteLocation: { $ref: '#/components/schemas/GeoPoint' }
        geofenceRadiusM: { type: integer, minimum: 10, maximum: 10000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        number: { type: [string, 'null'], maxLength: 50 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        state: { $ref: '#/components/schemas/AuState' }
        timezone: { type: string, maxLength: 64 }
        address: { $ref: '#/components/schemas/Address' }
        siteLocation: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        geofenceRadiusM: { type: [integer, 'null'], minimum: 10, maximum: 10000 }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
    ProjectPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        nextCursor: { type: [string, 'null'] }
    CompanyType:
      type: string
      enum: [builder, subcontractor, consultant, client, supplier]
    Company:
      type: object
      required:
        [id, name, abn, type, trades, email, phone, isOwnCompany, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        abn: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/CompanyType' }
        trades:
          type: array
          items: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        isOwnCompany: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    CreateCompanyRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        abn: { $ref: '#/components/schemas/Abn' }
        type: { $ref: '#/components/schemas/CompanyType' }
        trades:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { type: string, maxLength: 50 }
    CompanyPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Company' }
        nextCursor: { type: [string, 'null'] }
    PermissionLevel:
      type: string
      enum: [none, read, standard, admin]
    ToolLevels:
      type: object
      additionalProperties: { $ref: '#/components/schemas/PermissionLevel' }
    PermissionTemplate:
      type: object
      required: [id, name, description, toolLevels, granular, companyScopedTools, isSeeded, version]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        toolLevels: { $ref: '#/components/schemas/ToolLevels' }
        granular:
          type: array
          items: { type: string }
        companyScopedTools:
          type: array
          items: { type: string }
        isSeeded: { type: boolean }
        version: { type: integer }
    ProjectMember:
      type: object
      required:
        [id, projectId, userId, name, email, companyId, permissionTemplateId, isExternal, status]
      properties:
        id: { type: string }
        projectId: { type: string }
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        companyId: { type: string }
        permissionTemplateId: { type: string }
        isExternal: { type: boolean }
        status: { type: string, enum: [active, removed] }
    AddProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [email, companyId, permissionTemplateId]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        companyId: { type: string, pattern: '^cmp_[0-9A-Za-z]{26}$' }
        permissionTemplateId: { type: string, pattern: '^ptp_[0-9A-Za-z]{26}$' }
    ProjectMemberPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectMember' }
        nextCursor: { type: [string, 'null'] }
    EffectivePermissions:
      type: object
      required:
        [
          orgRole,
          isExternal,
          projectId,
          companyId,
          isProjectMember,
          toolLevels,
          granular,
          denied,
          companyScopedTools,
        ]
      properties:
        orgRole: { type: [string, 'null'], enum: [owner, admin, billing_admin, member, null] }
        isExternal: { type: boolean }
        projectId: { type: [string, 'null'] }
        companyId: { type: [string, 'null'] }
        isProjectMember: { type: boolean }
        toolLevels: { $ref: '#/components/schemas/ToolLevels' }
        granular:
          type: array
          items: { type: string }
        denied:
          type: array
          items: { type: string }
        companyScopedTools:
          type: array
          items: { type: string }
    PublicPriceBook:
      type: object
      required: [version, effectiveFrom, currency, gstIncluded, plans]
      properties:
        version: { type: string }
        effectiveFrom: { type: [string, 'null'], format: date-time }
        currency: { type: string, enum: [AUD] }
        gstIncluded: { type: boolean, description: 'Amounts are ex GST when false.' }
        plans:
          type: array
          items:
            type: object
            required: [code, name, blurb, features, cta, price]
            properties:
              code: { type: string }
              name: { type: string }
              blurb: { type: string }
              features:
                type: array
                items: { type: string }
              cta:
                type: object
                required: [label, href]
                properties:
                  label: { type: string }
                  href: { type: string }
              price:
                type: object
                required: [unit, fromPrice, amountCents]
                properties:
                  unit: { type: string, enum: [free, user_month, year] }
                  fromPrice: { type: boolean }
                  amountCents: { type: [integer, 'null'] }
    Entitlements:
      type: object
      required: [orgId, plan, state, modules, limits]
      properties:
        orgId: { type: string }
        plan: { type: string }
        state: { type: string, enum: [trialing, active, past_due, read_only, cancelled] }
        modules:
          type: array
          items: { type: string }
        limits:
          type: object
          additionalProperties: { type: [integer, 'null'] }
    AiSettings:
      type: object
      required:
        [aiEnabled, featuresEnabled, monthlyCreditCap, externalAiEnabled, retentionDays, version]
      properties:
        aiEnabled: { type: boolean }
        featuresEnabled:
          description: Features left on; null means every feature.
          type: [array, 'null']
          items: { $ref: '#/components/schemas/AiFeature' }
        monthlyCreditCap:
          description: The org's own monthly cap below the plan allowance; null means none.
          type: [number, 'null']
        externalAiEnabled:
          description: Whether invited external companies can use Nova on this org's projects.
          type: boolean
        retentionDays:
          description: Days prompt and response bodies are kept for review (0–90).
          type: integer
        version: { type: integer }
    UpdateAiSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        aiEnabled: { type: boolean }
        featuresEnabled:
          type: [array, 'null']
          maxItems: 50
          items: { $ref: '#/components/schemas/AiFeature' }
        monthlyCreditCap: { type: [number, 'null'], minimum: 0, maximum: 100000000 }
        externalAiEnabled: { type: boolean }
        retentionDays: { type: integer, minimum: 0, maximum: 90 }
    AiFeature:
      description: A Nova feature an admin can switch off (ai/01 §2).
      type: string
      enum:
        [
          ask,
          drawing_register,
          drawing_compare,
          rfi_draft,
          diary_summary,
          defect_tagging,
          minutes,
          estimating,
        ]
    AiUsage:
      type: object
      required: [periodStart, timezone, allowance, used, remaining, byFeature]
      properties:
        periodStart: { type: string, format: date }
        timezone: { type: string }
        allowance: { type: [number, 'null'], description: null means unlimited }
        used: { type: number }
        remaining: { type: [number, 'null'] }
        byFeature:
          type: array
          items:
            type: object
            required: [feature, credits, runs]
            properties:
              feature: { type: string }
              credits: { type: number }
              runs: { type: integer }
    AiFeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { type: string, enum: [up, down] }
        reason:
          type: [string, 'null']
          enum: [wrong, missing, not_useful, wrong_source, other, null]
        comment: { type: [string, 'null'], maxLength: 2000 }
    AiSuggestionStatus:
      type: string
      enum: [pending, accepted, edited, rejected]
    AiSuggestion:
      type: object
      required:
        [
          id,
          projectId,
          task,
          targetType,
          targetId,
          status,
          confidence,
          payload,
          runId,
          createdAt,
          decidedAt,
        ]
      properties:
        id: { type: string }
        projectId: { type: [string, 'null'] }
        task: { type: string, description: 'Nova task, e.g. `drawing.titleblock`' }
        targetType: { type: string }
        targetId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/AiSuggestionStatus' }
        confidence: { type: [number, 'null'] }
        payload:
          description: Task-specific content. For `drawing.titleblock` see DrawingSheetFields.
          type: object
          additionalProperties: true
        runId: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    AiSuggestionPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AiSuggestion' }
        nextCursor: { type: [string, 'null'] }
    DrawingSheetFields:
      type: object
      additionalProperties: false
      properties:
        number: { type: [string, 'null'], maxLength: 100 }
        title: { type: [string, 'null'], maxLength: 300 }
        revision: { type: [string, 'null'], maxLength: 20 }
        discipline:
          type: [string, 'null']
          enum:
            [
              architectural,
              structural,
              civil,
              hydraulic,
              mechanical,
              electrical,
              fire,
              landscape,
              interiors,
              survey,
              other,
              null,
            ]
        revisionDate: { type: [string, 'null'], format: date }
        scale: { type: [string, 'null'], maxLength: 50 }
    AiSuggestionDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [accepted, edited, rejected] }
        fields: { $ref: '#/components/schemas/DrawingSheetFields' }
    DrawingRegisterExtraction:
      type: object
      required: [suggestions, pageCount, skippedPages, refusedPages]
      properties:
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/AiSuggestion' }
        pageCount: { type: integer }
        skippedPages:
          description: Pages with no text, even after OCR (blank, or a scan too large to read inline).
          type: array
          items: { type: integer }
        refusedPages:
          type: array
          items: { type: integer }
    NovaSource:
      description: A document or drawing revision page, or an RFI, Nova used.
      type: object
      required: [sourceType, sourceId, revisionId, revision, title, reference, page]
      properties:
        sourceType: { type: string, enum: [document, drawing, rfi] }
        sourceId:
          description: The document (`doc_`), drawing sheet (`dsh_`) or RFI (`rfi_`).
          type: string
        revisionId:
          description: The document revision (`rev_`) or drawing revision (`drv_`); for an RFI, its own `rfi_` id.
          type: string
        revision: { type: string, description: The revision label; for an RFI, its status }
        title: { type: string, description: The document or sheet title; for an RFI, its subject }
        reference:
          { type: [string, 'null'], description: Document or sheet number, or the RFI number }
        page: { type: integer, minimum: 1 }
    NovaCitation:
      allOf:
        - $ref: '#/components/schemas/NovaSource'
        - type: object
          required: [quote]
          properties:
            quote: { type: string, description: The exact words the answer relies on }
    NovaAnswer:
      type: object
      required: [runId, found, answer, citations, closestMatches]
      properties:
        runId:
          description: For feedback (`air_`); null when no model call was needed.
          type: [string, 'null']
        found: { type: boolean }
        answer: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/NovaCitation' }
        closestMatches:
          description: When not found, the nearest passages so the user can check themselves.
          type: array
          items: { $ref: '#/components/schemas/NovaSource' }
    NovaRfiDraft:
      type: object
      required:
        [
          runId,
          suggestionId,
          subject,
          question,
          discipline,
          references,
          gaps,
          unsupportedNumbers,
          similarRfis,
          suggestedAssigneeIds,
          drawing,
        ]
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: |
            The saved draft (`ais_`), private to the caller. Pass it as `aiSuggestionId` when creating the RFI,
            then decide it: `accepted` as is, `edited` when the person changed the draft, `rejected` when they
            raised nothing from it.
        subject: { type: string }
        question: { type: string }
        discipline:
          description: The consultant discipline that should answer; null when the note doesn't say enough.
          type: [string, 'null']
          enum:
            [
              architectural,
              structural,
              civil,
              hydraulic,
              mechanical,
              electrical,
              fire,
              landscape,
              interiors,
              survey,
              other,
              null,
            ]
        references:
          description: Drawings and spec clauses the question refers to, each with the words that make it relevant.
          type: array
          items: { $ref: '#/components/schemas/NovaCitation' }
        gaps:
          description: Details a complete RFI states that the note didn't give, for the form to prompt.
          type: array
          items: { type: string, enum: [location, drawing_reference, proposed_solution, impact] }
        unsupportedNumbers:
          description: Numbers in the subject or question found in neither the note nor a cited passage.
          type: array
          items: { type: string }
        similarRfis:
          description: RFIs already raised on this project on the same subject, best match first.
          type: array
          items:
            type: object
            required: [id, number, subject, status]
            properties:
              id: { type: string, description: The RFI (`rfi_`) }
              number:
                { type: [string, 'null'], description: As the register shows it, e.g. RFI-014 }
              subject: { type: string }
              status: { type: string, enum: [open, answered, closed] }
        suggestedAssigneeIds:
          description: People (`usr_`) asked the most similar RFIs. The person picks the assignee.
          type: array
          items: { type: string }
        drawing:
          description: The marked sheet and where to pin the RFI; null when the draft came from a note alone.
          type: [object, 'null']
          required: [drawingRevisionId, sheetNumber, title, rev, pin, scanned]
          properties:
            drawingRevisionId: { type: string }
            sheetNumber: { type: string }
            title: { type: string }
            rev: { type: string }
            pin:
              type: object
              required: [x, y]
              properties:
                x:
                  { type: number, minimum: 0, maximum: 1, description: Normalised, origin top-left }
                y: { type: number, minimum: 0, maximum: 1 }
            scanned:
              type: boolean
              description: The sheet was read with OCR, so the person should check the quoted text against the drawing.
    ImportEntity:
      type: string
      enum: [rfi, defect, drawing_register, company]
    NovaImportMapping:
      type: object
      required: [runId, suggestionId, entity, fields, columns, values, missingRequired]
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: The saved suggestion (`ais_`), private to the caller. Pass it when the import job starts, then decide it.
        entity: { $ref: '#/components/schemas/ImportEntity' }
        fields:
          description: The fields a column of this record can fill, for the screen to offer when the person changes a suggestion.
          type: array
          items:
            type: object
            required: [key, label, kind, required, values]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [text, number, date, enum, email, phone, abn] }
              required: { type: boolean }
              values:
                description: For `enum` fields, the values Archova stores; empty for the rest.
                type: array
                items:
                  type: object
                  required: [value, label]
                  properties:
                    value: { type: string }
                    label: { type: string }
        columns:
          description: One entry per column of the file, in order.
          type: array
          items:
            type: object
            required: [index, header, field, confidence, examples, warning]
            properties:
              index: { type: integer, minimum: 0 }
              header: { type: string }
              field:
                {
                  type: [string, 'null'],
                  description: A field key,
                  or null when the column isn't imported.,
                }
              confidence: { type: string, enum: [high, medium, low] }
              examples:
                description: The first distinct values in the file, for the person to check the suggestion against.
                type: array
                items: { type: string }
              warning:
                description: duplicate_field means another column fits that field better; unlike_values means the column's values don't look like that kind of field.
                type: [string, 'null']
                enum: [duplicate_field, unlike_values, null]
        values:
          description: For columns that fill a field with fixed values, what each value in the file means.
          type: array
          items:
            type: object
            required: [index, field, pairs]
            properties:
              index: { type: integer, minimum: 0 }
              field: { type: string }
              pairs:
                type: array
                items:
                  type: object
                  required: [source, value]
                  properties:
                    source: { type: string }
                    value:
                      {
                        type: [string, 'null'],
                        description: A value of the field,
                        or null when the person must choose.,
                      }
        missingRequired:
          description: Required fields that no column fills.
          type: array
          items: { type: string }
    NovaQuoteReading:
      type: object
      required:
        - runId
        - suggestionId
        - packageId
        - fileId
        - pageCount
        - scannedPages
        - skippedPages
        - truncated
        - reference
        - validUntil
        - prices
        - lines
        - exclusions
        - qualifications
        - statedTotalExGst
        - linesTotalExGst
        - discountsExGst
        - totalCheck
        - difference
        - dropped
        - warnings
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: The saved suggestion (`ais_`), private to the caller. Pass it as `aiSuggestionId` when saving the quote, then decide it.
        packageId: { type: string }
        fileId: { type: string }
        pageCount: { type: integer, minimum: 1 }
        scannedPages:
          description: Pages read by OCR rather than the PDF text layer; check these against the PDF.
          type: array
          items: { type: integer, minimum: 1 }
        skippedPages:
          description: Pages Nova did not read (no text even after OCR, or beyond the limits).
          type: array
          items: { type: integer, minimum: 1 }
        truncated:
          {
            type: boolean,
            description: A page was cut,
            or later pages left out,
            to stay inside the limits.,
          }
        reference: { type: [string, 'null'] }
        validUntil: { type: [string, 'null'], format: date }
        prices:
          description: Whether the amounts on the lines include GST, as the quote says.
          type: string
          enum: [exclude_gst, include_gst, unclear]
        lines:
          type: array
          items:
            type: object
            required:
              [description, scopeKey, quantity, unit, rate, amount, isProvisional, source, warning]
            properties:
              description: { type: string }
              scopeKey: { type: [string, 'null'], description: A scope line of the package. }
              quantity: { type: [string, 'null'] }
              unit: { type: string }
              rate: { type: [string, 'null'] }
              amount: { type: string, description: Decimal AUD as printed on the quote }
              isProvisional: { type: boolean }
              source: { oneOf: [{ $ref: '#/components/schemas/QuoteSourceRef' }, { type: 'null' }] }
              warning:
                description: source_not_found means the words are on no page; amount_not_on_page means the amount is not printed on the line's page.
                type: [string, 'null']
                enum: [source_not_found, amount_not_on_page, null]
        exclusions: { $ref: '#/components/schemas/NovaQuoteNotes' }
        qualifications: { $ref: '#/components/schemas/NovaQuoteNotes' }
        statedTotalExGst:
          type: [string, 'null']
          description: The quote's total ex GST when it prints one that is on a page.
        linesTotalExGst: { type: string, description: The lines added up by code. }
        discountsExGst:
          {
            type: string,
            description: Discounts and credits the quote takes off the lines (listed under qualifications).,
          }
        totalCheck:
          description: differs means the lines, less any discounts, do not add up to the printed total, so a line was missed or misread.
          type: string
          enum: [matches, differs, not_stated]
        difference:
          {
            type: [string, 'null'],
            description: Lines total less discounts,
            minus the printed total.,
          }
        dropped:
          {
            type: integer,
            minimum: 0,
            description: Items left out for having no readable amount or repeating another.,
          }
        warnings:
          type: array
          items:
            type: string
            enum:
              - prices_include_gst
              - total_differs
              - stated_total_not_on_page
              - discounts_as_qualifications
              - items_dropped
    NovaQuoteNotes:
      type: array
      items:
        type: object
        required: [text, scopeKey, source, warning]
        properties:
          text: { type: string }
          scopeKey: { type: [string, 'null'] }
          source: { oneOf: [{ $ref: '#/components/schemas/QuoteSourceRef' }, { type: 'null' }] }
          warning: { type: [string, 'null'], enum: [source_not_found, null] }
    NovaDefectTag:
      type: object
      required:
        [
          runId,
          suggestionId,
          title,
          description,
          trade,
          alternativeTrades,
          category,
          priority,
          gaps,
          unsupportedNumbers,
          suggestedCompanies,
          duplicates,
          drawing,
        ]
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: |
            The saved suggestion (`ais_`), private to the caller. Pass it as `aiSuggestionId` when creating the
            defect, then decide it: `accepted` as is, `edited` when the person changed Nova's tags, `rejected` when
            they raised nothing from it.
        title: { type: string }
        description: { type: string }
        trade:
          description: The trade most likely responsible, as a defect stores it; null when the photo doesn't show enough.
          type: [string, 'null']
        alternativeTrades:
          description: Up to two other trades that could own it, most likely first.
          type: array
          items: { type: string }
        category:
          description: The kind of defect, as a defect stores it; null when none fits.
          type: [string, 'null']
        priority: { $ref: '#/components/schemas/DefectPriority' }
        gaps:
          description: What Nova couldn't settle, for the form to prompt.
          type: array
          items: { type: string, enum: [location, trade, photo_unclear] }
        unsupportedNumbers:
          description: Numbers in the title or description found in neither the note nor the sheet text.
          type: array
          items: { type: string }
        suggestedCompanies:
          description: Companies on the project that list the trade, then an alternative. The person picks the assignee.
          type: array
          items:
            type: object
            required: [id, name, trade]
            properties:
              id: { type: string, description: The company (`cmp_`) }
              name: { type: string }
              trade: { type: string, description: The suggested trade the company matched }
        duplicates:
          description: Open defects already pinned beside this spot, nearest first.
          type: array
          items:
            type: object
            required: [id, numberLabel, title, status, trade, distance, sameTrade]
            properties:
              id: { type: string, description: The defect (`dfx_`) }
              numberLabel: { type: string, description: 'DEF-0042' }
              title: { type: string }
              status: { $ref: '#/components/schemas/DefectStatus' }
              trade: { type: [string, 'null'] }
              distance: { type: number, description: From the pin, as a fraction of the sheet }
              sameTrade: { type: boolean }
        drawing:
          description: The sheet the pin is on; null when the defect wasn't pinned.
          type: [object, 'null']
          required: [drawingRevisionId, sheetNumber, title, rev, pin, nearby, scanned]
          properties:
            drawingRevisionId: { type: string }
            sheetNumber: { type: string }
            title: { type: string }
            rev: { type: string }
            pin:
              type: object
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
            nearby:
              description: The sheet's own text near the pin, nearest first, which the title may name.
              type: array
              items: { type: string }
            scanned:
              type: boolean
              description: The sheet was read with OCR, so the person should check the text against the drawing.
    NovaDrawingChange:
      type: object
      required: [id, kind, before, after, titleBlock, x, y]
      properties:
        id: { type: string, description: Cited by items, e.g. c3 }
        kind: { type: string, enum: [added, removed, changed] }
        before: { type: [string, 'null'] }
        after: { type: [string, 'null'] }
        titleBlock: { type: boolean }
        x: { type: number, minimum: 0, maximum: 1, description: Normalised, origin top-left }
        y: { type: number, minimum: 0, maximum: 1 }
    NovaDrawingCompare:
      type: object
      required:
        [
          runId,
          revisionId,
          againstRevisionId,
          sheetNumber,
          fromRev,
          toRev,
          headline,
          items,
          changes,
          unexplainedChangeIds,
          truncated,
          scanned,
          affectedRfis,
        ]
      properties:
        runId:
          description: For feedback (`air_`); null when no text changed.
          type: [string, 'null']
        revisionId: { type: string }
        againstRevisionId: { type: string, description: The revision this one superseded }
        sheetNumber: { type: string }
        fromRev: { type: string }
        toRev: { type: string }
        headline: { type: string }
        items:
          type: array
          items:
            type: object
            required: [text, changeIds]
            properties:
              text: { type: string }
              changeIds: { type: array, items: { type: string } }
        changes:
          type: array
          items: { $ref: '#/components/schemas/NovaDrawingChange' }
        unexplainedChangeIds:
          description: Changes no item describes; show them as found.
          type: array
          items: { type: string }
        truncated: { type: boolean, description: More changes were found than listed }
        scanned:
          { type: boolean, description: A sheet was read with OCR; check against the drawing }
        affectedRfis:
          type: array
          items:
            type: object
            required: [id, number, subject, status, nearChange]
            properties:
              id: { type: string }
              number: { type: [string, 'null'] }
              subject: { type: string }
              status: { type: string, enum: [open, answered] }
              nearChange: { type: boolean, description: A change sits near the RFI's pin }
    NovaIndexReport:
      type: object
      required:
        [indexed, unchanged, noText, ocrPages, unsupported, chunks, rfisIndexed, rfisUnchanged]
      properties:
        rfisIndexed:
          {
            type: integer,
            description: Sent RFIs indexed in this run (new,
            or changed since the last run),
          }
        rfisUnchanged:
          { type: integer, description: Sent RFIs already indexed at their current text }
        indexed: { type: integer }
        unchanged: { type: integer }
        noText:
