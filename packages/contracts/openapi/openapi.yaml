        kind: { $ref: '#/components/schemas/MeetingItemKind' }
        body: { type: string, minLength: 1, maxLength: 5000 }
        status: { $ref: '#/components/schemas/MeetingItemStatus' }
        ownerCompanyId: { type: [string, 'null'], pattern: '^cmp_[0-9A-Za-z]{26}$' }
        ownerUserId: { type: [string, 'null'], pattern: '^usr_[0-9A-Za-z]{26}$' }
        ownerName: { type: [string, 'null'], maxLength: 200 }
        dueDate: { type: [string, 'null'], format: date }
        link:
          oneOf:
            - { $ref: '#/components/schemas/MeetingLink' }
            - { type: 'null' }
    UpdateMeetingItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { $ref: '#/components/schemas/MeetingItemKind' }
        body: { type: string, minLength: 1, maxLength: 5000 }
        status: { $ref: '#/components/schemas/MeetingItemStatus' }
        ownerCompanyId: { type: [string, 'null'], pattern: '^cmp_[0-9A-Za-z]{26}$' }
        ownerUserId: { type: [string, 'null'], pattern: '^usr_[0-9A-Za-z]{26}$' }
        ownerName: { type: [string, 'null'], maxLength: 200 }
        dueDate: { type: [string, 'null'], format: date }
        link:
          oneOf:
            - { $ref: '#/components/schemas/MeetingLink' }
            - { type: 'null' }
    IssueMeetingRequest:
      type: object
      additionalProperties: false
      required: [recipients]
      properties:
        recipients:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [name, email]
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              email: { type: string, format: email, maxLength: 320 }
        correctionsBy: { type: [string, 'null'], format: date }
        note: { type: [string, 'null'], maxLength: 1000 }
    MeetingSeriesRef: { type: string, pattern: '^msr_[0-9A-Za-z]{26}$' }
    MeetingTemplate:
      type: string
      enum: [site_coordination, pcg, design_coordination, safety_committee, custom]
    MeetingItemKind: { type: string, enum: [information, decision, action] }
    MeetingItemStatus: { type: string, enum: [open, closed] }
    MeetingAttendance: { type: string, enum: [present, apologies, absent] }
    MeetingAgendaSection:
      type: object
      additionalProperties: false
      required: [title, internalOnly]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        internalOnly:
          type: boolean
          description: Left out of what outsiders see and of the PDF they get (MTG-AC7).
    MeetingPerson:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        companyName: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        userId: { type: [string, 'null'], pattern: '^usr_[0-9A-Za-z]{26}$' }
        companyId: { type: [string, 'null'], pattern: '^cmp_[0-9A-Za-z]{26}$' }
    MeetingPersonView:
      type: object
      required: [name, companyName, role, email, userId, companyId]
      properties:
        name: { type: string }
        companyName: { type: string }
        role: { type: string }
        email: { type: [string, 'null'] }
        userId: { type: [string, 'null'] }
        companyId: { type: [string, 'null'] }
    MeetingSeries:
      type: object
      required:
        [
          id,
          projectId,
          name,
          template,
          cadence,
          defaultAttendees,
          agenda,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        template: { $ref: '#/components/schemas/MeetingTemplate' }
        cadence: { type: [string, 'null'] }
        defaultAttendees:
          type: array
          items: { $ref: '#/components/schemas/MeetingPersonView' }
        agenda:
          type: array
          items: { $ref: '#/components/schemas/MeetingAgendaSection' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MeetingSeriesList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MeetingSeries' }
    MeetingSummary:
      type: object
      required:
        [id, seriesId, seriesName, number, title, heldAt, status, issuedVersion, openActions]
      properties:
        id: { type: string }
        seriesId: { type: string }
        seriesName: { type: string }
        number: { type: integer }
        title: { type: string }
        heldAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, issued] }
        issuedVersion: { type: integer }
        openActions: { type: integer }
    MeetingLinkedItem:
      type: object
      required:
        [
          meetingId,
          meetingTitle,
          meetingNumber,
          heldAt,
          itemNo,
          kind,
          body,
          status,
          ownerName,
          dueDate,
        ]
      properties:
        meetingId: { type: string }
        meetingTitle: { type: string }
        meetingNumber: { type: integer }
        heldAt: { type: string, format: date-time }
        itemNo: { type: string }
        kind: { type: string, enum: [action, decision, information] }
        body: { type: string }
        status: { type: string, enum: [open, closed] }
        ownerName: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'] }
    MeetingLinkedItemList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MeetingLinkedItem' }
    MeetingList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MeetingSummary' }
    Meeting:
      type: object
      required:
        [
          id,
          projectId,
          seriesId,
          seriesName,
          number,
          title,
          heldAt,
          location,
          chairUserId,
          status,
          correctionsBy,
          issuedVersion,
          version,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        seriesId: { type: string }
        seriesName: { type: string }
        number: { type: integer }
        title: { type: string }
        heldAt: { type: string, format: date-time }
        location: { type: string }
        chairUserId: { type: [string, 'null'] }
        status: { type: string, enum: [draft, issued] }
        correctionsBy: { type: [string, 'null'], format: date }
        issuedVersion: { type: integer }
        version: { type: integer }
    MeetingAttendeeView:
      allOf:
        - { $ref: '#/components/schemas/MeetingPersonView' }
        - type: object
          required: [id, attendance]
          properties:
            id: { type: string }
            attendance: { $ref: '#/components/schemas/MeetingAttendance' }
    MeetingItemHistory:
      type: object
      required: [meetingId, meetingNumber, heldAt, itemNo, body, status]
      properties:
        meetingId: { type: string }
        meetingNumber: { type: integer }
        heldAt: { type: string, format: date-time }
        itemNo: { type: string }
        body: { type: string }
        status: { $ref: '#/components/schemas/MeetingItemStatus' }
    MeetingLink:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [rfi, variation, defect] }
        id: { type: string, minLength: 5, maxLength: 40 }
    MeetingItem:
      type: object
      required:
        [
          id,
          sectionId,
          threadId,
          itemNo,
          kind,
          body,
          status,
          ownerCompanyId,
          ownerUserId,
          ownerName,
          dueDate,
          link,
          carriedCount,
          stale,
          history,
          version,
        ]
      properties:
        id: { type: string }
        sectionId: { type: string }
        threadId:
          { type: string, description: The first appearance of the item; carried copies share it. }
        itemNo: { type: string, description: 'section.item, e.g. 3.2' }
        kind: { $ref: '#/components/schemas/MeetingItemKind' }
        body: { type: string }
        status: { $ref: '#/components/schemas/MeetingItemStatus' }
        ownerCompanyId: { type: [string, 'null'] }
        ownerUserId: { type: [string, 'null'] }
        ownerName: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        link:
          oneOf:
            - { $ref: '#/components/schemas/MeetingLink' }
            - { type: 'null' }
        carriedCount: { type: integer }
        stale:
          type: boolean
          description: An open action carried forward three or more times.
        history:
          type: array
          description: Earlier appearances of the item, oldest first.
          items: { $ref: '#/components/schemas/MeetingItemHistory' }
        version: { type: integer }
    MeetingLiveSource:
      type: string
      enum: [rfis_overdue, submittals_due, defects_open, delays_week]
    MeetingLiveRow:
      type: object
      required: [ref, title, detail, link]
      properties:
        ref: { type: string, description: "The record's own number, or the day for a delay" }
        title: { type: string }
        detail: { type: string }
        link:
          type: [object, 'null']
          required: [type, id]
          properties:
            type: { type: string, enum: [rfi, defect, submittal] }
            id: { type: string }
    MeetingLiveList:
      type: object
      required: [source, asOf, rows, truncated, restricted]
      properties:
        source: { $ref: '#/components/schemas/MeetingLiveSource' }
        asOf: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: '#/components/schemas/MeetingLiveRow' }
        truncated: { type: boolean }
        restricted:
          type: boolean
          description: The reader can't see this register, so the empty list is about access, not about nothing being due.
    MeetingSectionView:
      type: object
      required: [id, position, title, internalOnly, liveSource, live, items]
      properties:
        id: { type: string }
        position: { type: integer }
        title: { type: string }
        internalOnly: { type: boolean }
        liveSource:
          oneOf:
            - { $ref: '#/components/schemas/MeetingLiveSource' }
            - { type: 'null' }
        live:
          description: The register list, read now for working minutes and frozen at issue for an issued version.
          oneOf:
            - { $ref: '#/components/schemas/MeetingLiveList' }
            - { type: 'null' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MeetingItem' }
    MeetingVersion:
      type: object
      required: [version, issuedAt, issuedBy, correctionsBy, note, recipients]
      properties:
        version: { type: integer }
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: [string, 'null'] }
        correctionsBy: { type: [string, 'null'], format: date }
        note: { type: [string, 'null'] }
        recipients:
          type: array
          items:
            type: object
            required: [name, email]
            properties:
              name: { type: string }
              email: { type: string }
    MeetingViewer:
      type: object
      required: [audience, canEdit, canIssue, viewingVersion]
      properties:
        audience: { type: string, enum: [internal, external] }
        canEdit: { type: boolean }
        canIssue: { type: boolean }
        viewingVersion:
          type: [integer, 'null']
          description: Set when the caller sees an issued version rather than the working minutes.
    MeetingDetail:
      type: object
      required: [meeting, attendees, sections, versions, viewer]
      properties:
        meeting: { $ref: '#/components/schemas/Meeting' }
        attendees:
          type: array
          items: { $ref: '#/components/schemas/MeetingAttendeeView' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/MeetingSectionView' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/MeetingVersion' }
        viewer: { $ref: '#/components/schemas/MeetingViewer' }
    MeetingPdf:
      type: object
      required: [filename, contentType, dataBase64]
      properties:
        filename: { type: string }
        contentType: { type: string, enum: [application/pdf] }
        dataBase64: { type: string }
    MeetingAction:
      type: object
      required:
        [
          id,
          meetingId,
          meetingNumber,
          meetingTitle,
          seriesName,
          itemNo,
          body,
          ownerCompanyId,
          ownerUserId,
          ownerName,
          dueDate,
          isOverdue,
          carriedCount,
          stale,
        ]
      properties:
        id: { type: string }
        meetingId: { type: string }
        meetingNumber: { type: integer }
        meetingTitle: { type: string }
        seriesName: { type: string }
        itemNo: { type: string }
        body: { type: string }
        ownerCompanyId: { type: [string, 'null'] }
        ownerUserId: { type: [string, 'null'] }
        ownerName: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        isOverdue: { type: boolean }
        carriedCount: { type: integer }
        stale: { type: boolean }
    MeetingActionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MeetingAction' }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        drainGrant:
          allOf: [{ $ref: '#/components/schemas/DrainGrant' }]
          description: Only on `access.revoked` (a sync call, or a token refresh that failed because access ended).
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          { type: string, description: 'Stable machine-readable code, e.g. `rfi.already_closed`' }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    DrainGrant:
      type: object
      required: [token, expiresAt, orgId, projectId, module]
      description: |
        Drain-only grant (X38) for work queued on a device before its access ended. The token is opaque, shown once
        (the server keeps only its hash), and accepted only as `Authorization: Bearer` on `syncPush`, where every
        mutation is held in the late-submissions queue and answered `pending_review`. It is bound to what was
        revoked: the whole organisation (`projectId` and `module` null), one project (`module` null) or one
        project module, and it cannot push into anything else.
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time, description: 72 hours after access ended. }
        orgId: { type: string }
        projectId: { type: [string, 'null'] }
        module: { type: [string, 'null'] }
    Email:
      type: string
      format: email
      maxLength: 320
    Password:
      type: string
      minLength: 10
      maxLength: 256
    User:
      type: object
      required: [id, email, name, locale, timezone]
      properties:
        id: { type: string, pattern: '^usr_[0-9A-Za-z]{26}$' }
        email: { $ref: '#/components/schemas/Email' }
        name: { type: string }
        locale: { type: string }
        timezone: { type: [string, 'null'] }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        name: { type: string, minLength: 1, maxLength: 200 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 256 }
    SessionInfo:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken:
          {
            type: string,
            description: 'Echo in `X-CSRF-Token` on unsafe cookie requests (ADR-0004 §5)',
          }
        expiresAt: { type: string, format: date-time }
    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string }
        code: { type: string }
        redirect_uri: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }
    RevokeRequest:
      type: object
      required: [token, client_id]
      properties:
        token: { type: string }
        client_id: { type: string }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: object, additionalProperties: true }
    MembershipSummary:
      type: object
      required: [orgId, orgName, orgSlug, role, kind]
      properties:
        orgId: { type: string }
        orgName: { type: string }
        orgSlug: { type: string }
        role:
          {
            type: [string, 'null'],
            enum: [owner, admin, billing_admin, member, null],
            description: 'Null for external collaborators',
          }
        kind: { type: string, enum: [member, external] }
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    Org:
      type: object
      required: [id, name, slug, country, timezone, kind, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        legalName: { type: [string, 'null'] }
        abn: { type: [string, 'null'] }
        slug: { type: string }
        country: { type: string }
        timezone: { type: string }
        kind: { type: string, enum: [builder, subcontractor_free] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    SupportAccessGrant:
      type: object
      required: [id, ticketRef, level, projectIds, createdAt, expiresAt, grantedBy, status]
      properties:
        id: { type: string, format: uuid }
        ticketRef: { type: string }
        level: { type: string, enum: [view] }
        projectIds:
          type: [array, 'null']
          description: The projects support can see, or null when the grant covers the whole company.
          items: { type: string }
        grantedBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [active, expired, revoked] }
    SupportAccessSession:
      type: object
      required: [id, grantId, staffName, ticketRef, startedAt, expiresAt, pagesViewed, status]
      properties:
        pagesViewed: { type: integer }
        id: { type: string, format: uuid }
        grantId: { type: string, format: uuid }
        staffName: { type: string }
        ticketRef: { type: string }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [open, ended, expired, revoked] }
    SupportAccess:
      type: object
      required: [grants, sessions]
      properties:
        grants:
          type: array
          items: { $ref: '#/components/schemas/SupportAccessGrant' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SupportAccessSession' }
    StaffAction:
      type: object
      required: [id, kind, summary, ticketRef, at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [trial.extend, plan.change, suspend, reactivate, credits.grant]
        summary: { type: string }
        ticketRef: { type: string }
        at: { type: string, format: date-time }
    SupportBanner:
      type: object
      required: [active, since]
      properties:
        active: { type: boolean }
        since: { type: [string, 'null'], format: date-time }
    CreateSupportAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [ticketRef, hours]
      properties:
        ticketRef: { type: string, minLength: 2, maxLength: 60 }
        hours: { type: integer, minimum: 1, maximum: 72 }
        projectIds:
          type: array
          minItems: 1
          maxItems: 50
          description: Limit support to these projects. Leave out to cover the whole company.
          items: { type: string }
    Abn:
      type: string
      pattern: '^[0-9]{11}$'
    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        legalName: { type: string, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,46})[a-z0-9]$' }
        abn: { $ref: '#/components/schemas/Abn' }
        country:
          { type: string, pattern: '^[A-Z]{2}$', description: 'ISO 3166-1 alpha-2; default AU' }
        timezone:
          { type: string, maxLength: 64, description: 'IANA time zone; default Australia/Sydney' }
    AuState:
      type: string
      enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT]
    ProjectStatus:
      type: string
      enum: [tender, active, on_hold, closed, archived]
    Address:
      type: object
      additionalProperties: false
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        suburb: { type: string, maxLength: 100 }
        state: { $ref: '#/components/schemas/AuState' }
        postcode: { type: string, maxLength: 10 }
        country: { type: string, maxLength: 2 }
    GeoPoint:
      type: object
      description: WGS 84 decimal degrees (X32)
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    GeoFix:
      type: object
      description: A recorded position and how good it was
      additionalProperties: false
      required: [lat, lng, source]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: [number, 'null'], minimum: 0 }
        headingDeg: { type: [number, 'null'], minimum: 0, maximum: 360 }
        source: { type: string, enum: [device, exif, manual, geocoded] }
    Capture:
      type: object
      description: When and where a photo or file was captured, as the device reported it
      additionalProperties: false
      properties:
        takenAt: { type: string, format: date-time }
        timeZone: { type: string, maxLength: 64, description: 'IANA zone the device was in' }
        location: { $ref: '#/components/schemas/GeoFix' }
    Project:
      type: object
      required:
        [
          id,
          orgId,
          name,
          number,
          status,
          state,
          timezone,
          address,
          siteLocation,
          geofenceRadiusM,
          startDate,
          endDate,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        number: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        state: { type: [string, 'null'], enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT, null] }
        timezone:
          { type: string, description: 'IANA time zone; local dates and deadlines use it (X32)' }
        address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
        siteLocation: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        geofenceRadiusM: { type: [integer, 'null'] }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    KeyDateSection:
      type: object
      required: [id, name, targetDate, actualDate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        targetDate: { type: [string, 'null'], format: date }
        actualDate: { type: [string, 'null'], format: date }
    KeyDates:
      type: object
      required:
        [
          projectId,
          possessionDate,
          pcTarget,
          pcActual,
          dlpEnd,
          ldRatePerDay,
          currency,
          sections,
          daysToPc,
          daysToDlpEnd,
          version,
          updatedAt,
        ]
      properties:
        projectId: { type: string }
        possessionDate: { type: [string, 'null'], format: date }
        pcTarget: { type: [string, 'null'], format: date }
        pcActual: { type: [string, 'null'], format: date }
        dlpEnd: { type: [string, 'null'], format: date }
        ldRatePerDay:
          { type: [string, 'null'], description: 'Liquidated damages per day, decimal string' }
        currency: { type: string }
        sections:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/KeyDateSection' }
        daysToPc:
          type: [integer, 'null']
          description: Days from today (project zone) to the PC target, negative once passed; null when PC is reached or no target.
        daysToDlpEnd: { type: [integer, 'null'] }
        version: { type: integer }
        updatedAt: { type: [string, 'null'], format: date-time }
    UpdateKeyDatesRequest:
      type: object
      additionalProperties: false
      properties:
        possessionDate: { type: [string, 'null'], format: date }
        pcTarget: { type: [string, 'null'], format: date }
        pcActual: { type: [string, 'null'], format: date }
        dlpEnd: { type: [string, 'null'], format: date }
        ldRatePerDay: { type: [string, 'null'], pattern: '^[0-9]{1,16}(\.[0-9]{1,2})?$' }
        sections:
          type: array
          maxItems: 20
          description: The whole list; sections left out are removed.
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, minLength: 1, maxLength: 120 }
              targetDate: { type: [string, 'null'], format: date }
              actualDate: { type: [string, 'null'], format: date }
        reason:
          type: string
          enum: [eot_granted, variation, other]
          description: Required when a target date that was already set moves.
        note: { type: [string, 'null'], maxLength: 1000 }
    KeyDateChange:
      type: object
      required: [id, field, sectionId, sectionName, from, to, reason, note, changedBy, changedAt]
      properties:
        id: { type: string }
        field:
          type: string
          enum:
            [
              possessionDate,
              pcTarget,
              pcActual,
              dlpEnd,
              ldRatePerDay,
              sectionAdded,
              sectionRenamed,
              sectionTarget,
              sectionActual,
              sectionRemoved,
            ]
        sectionId: { type: [string, 'null'] }
        sectionName: { type: [string, 'null'] }
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        reason: { type: [string, 'null'], enum: [eot_granted, variation, other, null] }
        note: { type: [string, 'null'] }
        changedBy:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - { type: 'null' }
        changedAt: { type: string, format: date-time }
    KeyDateChangeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/KeyDateChange' }
    DelayRegisterRow:
      type: object
      required:
        [
          id,
          source,
          kind,
          cause,
          date,
          title,
          days,
          hours,
          possibleEot,
          diaryDate,
          diaryStatus,
          rfiId,
          rfiNumber,
        ]
      properties:
        id: { type: string }
        source: { type: string, enum: [diary, rfi] }
        kind: { type: string, enum: [diary_delay, rfi_schedule_impact, rfi_late_answer] }
        cause: { $ref: '#/components/schemas/DiaryDelayType' }
        date:
          {
            type: string,
            format: date,
            description: 'Diary day, RFI due date (late answer) or the day the RFI was sent (schedule impact)',
          }
        title: { type: string }
        days: { type: [integer, 'null'], description: 'Calendar days (RFI rows)' }
        hours: { type: [number, 'null'], description: 'Hours lost (diary rows)' }
        possibleEot: { type: boolean }
        diaryDate: { type: [string, 'null'], format: date }
        diaryStatus: { type: [string, 'null'], enum: [draft, submitted, signed_off, null] }
        rfiId: { type: [string, 'null'] }
        rfiNumber: { type: [integer, 'null'] }
    DelayRegister:
      type: object
      required: [data, totals, truncated]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DelayRegisterRow' }
        totals:
          type: object
          required: [rows, possibleEotRows, diaryHours, rfiDays]
          properties:
            rows: { type: integer }
            possibleEotRows: { type: integer }
            diaryHours: { type: number }
            rfiDays: { type: integer }
        truncated: { type: boolean }
    CreateProjectRequest:
      type: object
