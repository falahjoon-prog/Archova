        - telco_tower
        - demolition_load_bearing
        - demolition_integrity
        - asbestos
        - temp_support
        - confined_space
        - shaft_trench_tunnel
        - explosives
        - pressurised_gas
        - chemical_fuel_refrigerant
        - energised_electrical
        - contaminated_atmosphere
        - tilt_up_precast
        - traffic_corridor
        - mobile_plant
        - extreme_temperature
        - drowning
        - diving
