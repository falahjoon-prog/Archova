      required: [id, text, scopeKey, source]
      properties:
        id: { type: string }
        text: { type: string }
        scopeKey:
          {
            type: [string, 'null'],
            description: 'An exclusion naming a scope line marks that cell excluded',
          }
        source: { oneOf: [{ $ref: '#/components/schemas/QuoteSourceRef' }, { type: 'null' }] }
    Quote:
      type: object
      required:
        [
          id,
          packageId,
          companyId,
          revision,
          status,
          reference,
          fileIds,
          receivedAt,
          validUntil,
          totalExGst,
          gst,
          currency,
          lines,
          exclusions,
          qualifications,
          source,
          confirmedBy,
          confirmedAt,
          version,
        ]
      properties:
        id: { type: string }
        packageId: { type: string }
        companyId: { type: string }
        revision:
          {
            type: integer,
            description: 'A revised quote supersedes the earlier revision (EST-AC4)',
          }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        reference: { type: [string, 'null'] }
        fileIds:
          type: array
          items: { type: string }
        receivedAt: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date }
        totalExGst: { type: string }
        gst: { type: string }
        currency: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/QuoteLine' }
        exclusions:
          type: array
          items: { $ref: '#/components/schemas/QuoteNote' }
        qualifications:
          type: array
          items: { $ref: '#/components/schemas/QuoteNote' }
        source: { type: string, enum: [manual, ai_extracted] }
        confirmedBy: { type: [string, 'null'] }
        confirmedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    QuoteComparison:
      type: object
      required: [packageId, columns, rows, medianTotalExGst, outlierRule]
      properties:
        packageId: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/QuoteComparisonColumn' }
        rows:
          description: One per scope line, in the package's order. Each has a cell for every column, in column order.
          type: array
          items: { $ref: '#/components/schemas/QuoteComparisonRow' }
        medianTotalExGst:
          description: Median of the levelled totals; null when fewer than `outlierRule.minPrices` quotes compete.
          type: [string, 'null']
        outlierRule:
          description: How `deviation` is decided, so the screen can say why a price is flagged.
          type: object
          required: [percent, minExGst, minPrices]
          properties:
            percent:
              {
                type: integer,
                description: 'More than this far from the median, as a percent of it',
              }
            minExGst: { type: string, description: 'and at least this far in dollars' }
            minPrices:
              {
                type: integer,
                description: 'Nothing is flagged unless at least this many quotes price the item',
              }
    QuoteDeviation:
      type: string
      enum: [high, low]
    QuoteComparisonColumn:
      type: object
      required:
        [
          quoteId,
          companyId,
          revision,
          reference,
          receivedAt,
          validUntil,
          validityExpired,
          totalExGst,
          allowancesExGst,
          levelledTotalExGst,
          isLowest,
          deviation,
          provisionalExGst,
          provisionalLines,
          missingScopeKeys,
          unmappedLines,
          unmappedExGst,
          outlierLines,
          exclusions,
          qualifications,
        ]
      properties:
        quoteId: { type: string }
        companyId: { type: string }
        revision: { type: integer }
        reference: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date }
        validityExpired:
          { type: boolean, description: "Today, in the project's time zone, is after `validUntil`" }
        totalExGst: { type: string }
        allowancesExGst:
          { type: string, description: 'Every allowance the estimator set against this quote' }
        levelledTotalExGst: { type: string, description: 'The total plus the allowances' }
        isLowest: { type: boolean, description: 'Lowest levelled total among the confirmed quotes' }
        deviation:
          description: The levelled total against the median of the levelled totals.
          oneOf: [{ $ref: '#/components/schemas/QuoteDeviation' }, { type: 'null' }]
        provisionalExGst: { type: string }
        provisionalLines: { type: integer }
        missingScopeKeys:
          description: Scope lines the quote has no line for. An exclusion or an allowance may already cover them.
          type: array
          items: { type: string }
        unmappedLines:
          {
            type: integer,
            description: 'Lines that match no scope line: in the total, not in any row',
          }
        unmappedExGst: { type: string }
        outlierLines: { type: integer }
        exclusions:
          type: array
          items: { $ref: '#/components/schemas/QuoteComparisonNote' }
        qualifications:
          type: array
          items: { $ref: '#/components/schemas/QuoteComparisonNote' }
    QuoteComparisonNote:
      type: object
      required: [id, text, scopeKey]
      properties:
        id: { type: string }
        text: { type: string }
        scopeKey: { type: [string, 'null'] }
    QuoteComparisonRow:
      type: object
      required: [key, description, quantity, unit, medianExGst, cells]
      properties:
        key: { type: string }
        description: { type: string }
        quantity: { type: [string, 'null'] }
        unit: { type: string }
        medianExGst:
          description: Median price of the quotes that price this line; null when too few do.
          type: [string, 'null']
        cells:
          type: array
          items: { $ref: '#/components/schemas/QuoteComparisonCell' }
    QuoteComparisonCell:
      type: object
      required: [quoteId, state, amountExGst, allowanceExGst, excluded, deviation]
      properties:
        quoteId: { type: string }
        state:
          description: "`provisional` when any of the quote's lines for the scope line is a provisional or prime cost sum"
          type: string
          enum: [priced, provisional, missing]
        amountExGst:
          { type: [string, 'null'], description: "The quote's lines for the scope line, summed" }
