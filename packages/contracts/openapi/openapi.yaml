      required: [typeId]
      properties:
        typeId: { $ref: '#/components/schemas/CorrespondenceTypeRef' }
        subject: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 50000 }
        fromCompanyId: { $ref: '#/components/schemas/CompanyRef' }
        toCompanyIds:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CompanyRef' }
        responseRequired: { type: boolean }
        dueDate: { type: string, format: date }
        eventDate: { type: string, format: date }
        timeBarDays: { type: [integer, 'null'], minimum: 1, maximum: 365 }
        fileIds:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FileRef' }
        related:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CorrespondenceRelated' }
    UpdateCorrespondenceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
