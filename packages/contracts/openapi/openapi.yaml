      type: object
      required: [transmittal, items, recipients]
      properties:
        transmittal: { $ref: '#/components/schemas/Transmittal' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TransmittalItem' }
        recipients:
          type: array
          items: { $ref: '#/components/schemas/TransmittalRecipient' }
    TransmittalPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transmittal' }
        nextCursor: { type: [string, 'null'] }
    CreateTransmittalRequest:
      type: object
      additionalProperties: false
      required: [subject, purpose, recipients]
      properties:
        subject: { type: string, minLength: 1, maxLength: 300 }
        purpose: { $ref: '#/components/schemas/TransmittalPurpose' }
        fromCompanyId: { $ref: '#/components/schemas/CompanyRef' }
        responseDue: { type: string, format: date }
        message: { type: string, maxLength: 10000 }
        recipients:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { $ref: '#/components/schemas/Email' }
              name: { type: string, maxLength: 200 }
              companyId: { $ref: '#/components/schemas/CompanyRef' }
              role: { type: string, enum: [to, cc] }
        items:
          type: array
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required: [revisionType, revisionId]
            properties:
              revisionType: { type: string, enum: [document, drawing] }
              revisionId:
                {
                  type: string,
                  pattern: '^(rev|drv)_[0-9A-Za-z]{26}$',
                  description: 'rev_ or drv_',
                }
        currentSetDisciplines:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 20 }
    TransmittalAccess:
      type: object
      required: [transmittal, items, recipient, actions, expiresAt]
      properties:
        transmittal:
          type: object
          required: [number, subject, purpose, message, responseDue, sentAt, fromOrg, projectName]
          properties:
            number: { type: integer }
            subject: { type: string }
            purpose: { $ref: '#/components/schemas/TransmittalPurpose' }
            message: { type: [string, 'null'] }
            responseDue: { type: [string, 'null'], format: date }
            sentAt: { type: string, format: date-time }
            fromOrg: { type: string }
            projectName: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/TransmittalItem' }
        recipient:
          type: object
          required: [email, name, role, openedAt, downloadedAt, acknowledgedAt]
          properties:
            email: { type: string }
            name: { type: [string, 'null'] }
            role: { type: string, enum: [to, cc] }
            openedAt: { type: [string, 'null'], format: date-time }
            downloadedAt: { type: [string, 'null'], format: date-time }
            acknowledgedAt: { type: [string, 'null'], format: date-time }
        actions:
          type: array
          items: { type: string, enum: [view, download, acknowledge] }
        expiresAt: { type: string, format: date-time }
    DownloadTransmittalItemRequest:
      type: object
      additionalProperties: false
      required: [revisionType, revisionId]
      properties:
        revisionType: { type: string, enum: [document, drawing] }
        revisionId: { type: string, pattern: '^(rev|drv)_[0-9A-Za-z]{26}$' }
    TransmittalDownload:
      type: object
      required: [url, expiresAt, filename]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }
        filename: { type: string }
    AcknowledgeTransmittalRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { type: string, enum: [opened, downloaded, acknowledged] }
    SyncChange:
      type: object
      required: [entityType, id, op, version]
      properties:
        entityType: { type: string, minLength: 1, maxLength: 64 }
        id: { type: string, minLength: 1, maxLength: 64 }
        op: { type: string, enum: [upsert, delete] }
        version: { type: integer, minimum: 0 }
        data:
          type: object
          additionalProperties: true
          description: The record's DTO; absent on deletes.
    RevokedScope:
      type: object
      required: [projectId, module]
      properties:
        projectId: { type: string }
        module:
          type: [string, 'null']
          description: '`null` means the whole project.'
        drainGrant:
          allOf: [{ $ref: '#/components/schemas/DrainGrant' }]
          description: Present once, when this scope was revoked after the device last pulled; keep it per org and push queued work with it.
    SyncPullResponse:
      type: object
      required: [changes, revokedScopes, nextSince, hasMore]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/SyncChange' }
        revokedScopes:
          type: array
          items: { $ref: '#/components/schemas/RevokedScope' }
        nextSince: { type: string, pattern: '^[0-9]{1,20}$' }
        hasMore: { type: boolean }
    SyncMutation:
      type: object
      additionalProperties: false
      required: [mutationId, command, entityId, baseVersion, clientAt, payload]
      properties:
        mutationId:
          type: string
          format: uuid
          description: UUIDv7 made on the device; also the idempotency key.
        command:
          type: string
          pattern: '^[a-z][a-z_]*\.[A-Za-z][A-Za-z0-9]*$'
          description: A module use case, e.g. `defects.markReadyForReview`.
        entityId: { type: string, minLength: 1, maxLength: 64 }
        projectId:
          type: string
          pattern: '^prj_[0-9A-Za-z]{26}$'
          description: >-
            The project the change belongs to. Required when sending with a drain grant (X38), where the server
            checks it against the grant and never reads the record; ignored otherwise.
        baseVersion:
          type: [integer, 'null']
          minimum: 0
          description: The version the change was made against; `null` for a create.
        clientAt:
          type: string
          format: date-time
          description: When the user made the change on the device.
        payload: { type: object, additionalProperties: true }
    LateSubmission:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          module,
          command,
          entityId,
          baseVersion,
          submittedBy,
          clientAt,
          receivedAt,
          status,
        ]
      description: |
        A change held after the sender's access ended (X38). `clientAt` is the sender's phone clock and is not
        verified; `receivedAt` is when the server got it. Show both and never treat `clientAt` as when it happened.
      properties:
        id: { type: string, pattern: '^lsb_[0-9A-Za-z]{26}$' }
        projectId: { type: string, pattern: '^prj_[0-9A-Za-z]{26}$' }
        module: { type: string }
        command: { type: string }
        entityId: { type: string }
        baseVersion: { type: [integer, 'null'] }
        submittedBy: { type: string, pattern: '^usr_[0-9A-Za-z]{26}$' }
        clientAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, rejected] }
        payload:
          type: object
          additionalProperties: true
          description: >-
            What the sender asked for, dropped once decided. Any text in it is the sender's own words: show it as
            plain text, marked as theirs, never as part of the system's description of the change.
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        version: { type: [integer, 'null'], description: The record's version after an accept. }
    LateSubmissionList:
      type: object
      additionalProperties: false
      required: [items, pendingCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LateSubmission' }
        pendingCount: { type: integer, minimum: 0 }
    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [mutations]
      properties:
        mutations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SyncMutation' }
    SyncProblem:
      type: object
      required: [code]
      properties:
        code: { type: string }
        detail: { type: string }
        drainGrant:
          allOf: [{ $ref: '#/components/schemas/DrainGrant' }]
          description: On a `rejected` result with `access.revoked` when only a project or module was revoked.
    SyncPushResult:
      type: object
      required: [mutationId, status]
      properties:
        mutationId: { type: string }
        status:
          type: string
          enum: [applied, conflict, rejected, pending_review]
          description: >-
            `pending_review` is sent in drain mode after access ended; an admin accepts or rejects it (X38).
        version:
          type: integer
          description: The record's version after `applied`, or the server's version on `conflict`.
        server:
          type: object
          additionalProperties: true
          description: The current DTO, on `conflict`.
        problem: { $ref: '#/components/schemas/SyncProblem' }
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SyncPushResult' }
    SubmittalStatus:
      type: string
      enum:
        [
          draft,
          submitted,
          in_review,
          approved,
          approved_as_noted,
          revise_resubmit,
          rejected,
          closed,
        ]
    SubmittalType:
      type: string
      enum: [shop_drawing, product_data, sample, mock_up, certificate, other]
    SubmittalStepResponse:
      type: string
      enum: [pending, forwarded, approved, approved_as_noted, revise_resubmit, rejected, skipped]
    SubmittalReviewAnswer:
      type: string
      enum: [forwarded, approved, approved_as_noted, revise_resubmit, rejected]
    SubmittalBall:
      type: object
      required: [side, userIds, stepId, dueDate]
      properties:
        side: { type: [string, 'null'], enum: [subcontractor, builder, consultant, null] }
        userIds:
          type: array
          items: { type: string }
        stepId: { type: [string, 'null'], description: 'The review step that is waiting' }
        dueDate: { type: [string, 'null'], format: date, description: 'When that step is due' }
    Submittal:
      type: object
      required:
        [
          id,
          projectId,
          number,
          numberLabel,
          title,
          type,
          specSection,
          responsibleCompanyId,
          managerId,
          requiredOnSite,
          leadTimeDays,
          reviewDays,
          submitBy,
          submitByState,
          status,
          currentRevision,
          ballInCourt,
          submittedAt,
          returnedAt,
          closedAt,
          createdBy,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        number: { type: integer }
        numberLabel:
          { type: string, description: 'SD-014, or the company numbering such as 0331-1' }
        title: { type: string }
        type: { $ref: '#/components/schemas/SubmittalType' }
        specSection: { type: [string, 'null'] }
        responsibleCompanyId: { type: [string, 'null'] }
        managerId:
          { type: [string, 'null'], description: 'The builder reviewer for the first step' }
        requiredOnSite: { type: [string, 'null'], format: date }
        leadTimeDays: { type: integer }
        reviewDays: { type: integer, description: 'Business days allowed for the whole review' }
        submitBy:
          {
            type: [string, 'null'],
            format: date,
            description: 'Required on site − lead time − review time, in business days',
          }
        submitByState:
          type: string
          enum: [none, ok, amber, red]
          description: 'Amber once the submit-by date passes with nothing submitted, red five business days later or once required-on-site passes'
        status: { $ref: '#/components/schemas/SubmittalStatus' }
        currentRevision: { type: integer }
        ballInCourt: { $ref: '#/components/schemas/SubmittalBall' }
        submittedAt: { type: [string, 'null'], format: date-time }
        returnedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    SubmittalStep:
      type: object
      required:
        [id, step, kind, approverId, companyId, dueDate, response, comments, fileIds, respondedAt]
      properties:
        id: { type: string }
        step: { type: integer }
        kind: { type: string, enum: [builder, consultant] }
        approverId: { type: string }
        companyId: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        response: { $ref: '#/components/schemas/SubmittalStepResponse' }
        comments: { type: string }
        fileIds:
          type: array
          items: { type: string }
        respondedAt: { type: [string, 'null'], format: date-time }
    SubmittalRevision:
      type: object
      required: [revision, submittedBy, submittedAt, note, fileIds, status, returnedAt, steps]
      properties:
        revision: { type: integer, description: 'Starts at 0; each resubmission adds one' }
        submittedBy: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        note: { type: string }
        fileIds:
          type: array
          items: { type: string }
        status:
          {
            type: string,
            enum: [in_review, approved, approved_as_noted, revise_resubmit, rejected],
          }
        returnedAt: { type: [string, 'null'], format: date-time }
        steps:
          type: array
          items: { $ref: '#/components/schemas/SubmittalStep' }
    SubmittalDetail:
      type: object
      required: [submittal, revisions]
      properties:
        submittal: { $ref: '#/components/schemas/Submittal' }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/SubmittalRevision' }
    SubmittalPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Submittal' }
        nextCursor: { type: [string, 'null'] }
    CreateSubmittalRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        numberLabel: { type: string, minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/SubmittalType' }
        specSection: { type: string, maxLength: 200 }
        responsibleCompanyId: { $ref: '#/components/schemas/CompanyRef' }
        managerId: { $ref: '#/components/schemas/UserRef' }
        requiredOnSite: { type: string, format: date }
        leadTimeDays: { type: integer, minimum: 0, maximum: 1000 }
        reviewDays:
          { type: integer, minimum: 0, maximum: 250, description: 'Defaults to 10 business days' }
    UpdateSubmittalRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        numberLabel: { type: string, minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/SubmittalType' }
        specSection: { type: [string, 'null'], maxLength: 200 }
        responsibleCompanyId:
          { oneOf: [{ $ref: '#/components/schemas/CompanyRef' }, { type: 'null' }] }
        managerId: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        requiredOnSite: { type: [string, 'null'], format: date }
        leadTimeDays: { type: integer, minimum: 0, maximum: 1000 }
        reviewDays: { type: integer, minimum: 0, maximum: 250 }
    SubmitSubmittalRequest:
      type: object
      additionalProperties: false
      required: [fileIds]
      properties:
        fileIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/FileRef' }
        note: { type: string, maxLength: 5000 }
        reviewerIds:
          type: array
          maxItems: 10
          description: 'Consultants in review order. A resubmission keeps the last path when this is left out.'
          items: { $ref: '#/components/schemas/UserRef' }
    RespondSubmittalStepRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: { $ref: '#/components/schemas/SubmittalReviewAnswer' }
        comments: { type: string, maxLength: 20000 }
        fileIds:
          type: array
          maxItems: 20
          description: 'Marked-up PDFs (SUB-AC4)'
          items: { $ref: '#/components/schemas/FileRef' }
    CorrespondenceTypeRef:
      type: string
      pattern: '^cty_[0-9A-Za-z]{26}$'
    CorrespondenceStatus:
      type: string
      enum: [draft, sent, responded, closed, void]
    CorrespondenceTemplate:
      type: object
      required:
        [
          key,
          name,
          prefix,
          description,
          isEvidential,
          responseRequired,
          responseDays,
          timeBarDays,
          subjectTemplate,
          bodyTemplate,
        ]
      properties:
        key: { type: string }
        name: { type: string }
        prefix: { type: string }
        description: { type: string }
        isEvidential: { type: boolean }
        responseRequired: { type: boolean }
        responseDays: { type: integer }
        timeBarDays:
          {
            type: [integer, 'null'],
            description: 'Default notice period in calendar days; confirm against the contract',
          }
        subjectTemplate: { type: string }
        bodyTemplate: { type: string }
    CorrespondenceType:
      type: object
      required:
        [
          id,
          name,
          prefix,
          description,
          templateKey,
          isEvidential,
          responseRequired,
          responseDays,
          timeBarDays,
          subjectTemplate,
          bodyTemplate,
          archived,
          version,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 'Upper-case letters; items are numbered NOD-001' }
        description: { type: string }
        templateKey:
          { type: [string, 'null'], description: 'The built-in template it was copied from' }
        isEvidential: { type: boolean, description: 'Frozen and hashed when sent' }
        responseRequired: { type: boolean }
        responseDays: { type: integer, description: 'Business days allowed to respond' }
        timeBarDays: { type: [integer, 'null'] }
        subjectTemplate: { type: string }
        bodyTemplate:
          {
            type: string,
            description: 'Supports {{projectName}}, {{number}}, {{date}} and {{eventDate}}',
          }
        archived: { type: boolean }
        version: { type: integer }
    CorrespondenceTypeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CorrespondenceType' }
    CreateCorrespondenceTypeRequest:
      type: object
      additionalProperties: false
      properties:
        templateKey: { type: string, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 80 }
        prefix: { type: string, pattern: '^[A-Za-z]{1,6}$' }
        description: { type: string, maxLength: 500 }
        isEvidential: { type: boolean }
        responseRequired: { type: boolean }
        responseDays: { type: integer, minimum: 0, maximum: 250 }
        timeBarDays: { type: [integer, 'null'], minimum: 1, maximum: 365 }
        subjectTemplate: { type: string, maxLength: 300 }
        bodyTemplate: { type: string, maxLength: 20000 }
    UpdateCorrespondenceTypeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        prefix: { type: string, pattern: '^[A-Za-z]{1,6}$' }
        description: { type: string, maxLength: 500 }
        isEvidential: { type: boolean }
        responseRequired: { type: boolean }
        responseDays: { type: integer, minimum: 0, maximum: 250 }
        timeBarDays: { type: [integer, 'null'], minimum: 1, maximum: 365 }
        subjectTemplate: { type: string, maxLength: 300 }
        bodyTemplate: { type: string, maxLength: 20000 }
        archived: { type: boolean }
    CorrespondenceRelated:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [rfi, submittal, correspondence, variation, diary, other] }
        id: { type: string, pattern: '^[a-z]{2,4}_[0-9A-Za-z]{26}$' }
        label: { type: string, maxLength: 120 }
    CorrespondenceItem:
      type: object
      required:
        [
          id,
          projectId,
          typeId,
          typeName,
          isEvidential,
          number,
          numberLabel,
          subject,
          body,
          status,
          fromCompanyId,
          toCompanyIds,
          responseRequired,
          dueDate,
          eventDate,
          timeBarDays,
          timeBarDate,
          timeBarState,
          sentInTime,
          fileIds,
          related,
          sentAt,
          sentBy,
          contentHash,
          closedAt,
          voidReason,
          createdBy,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        typeId: { type: string }
        typeName: { type: string }
        isEvidential: { type: boolean }
        number: { type: integer }
        numberLabel: { type: string, description: 'NOD-001' }
        subject: { type: string }
        body: { type: string }
        status: { $ref: '#/components/schemas/CorrespondenceStatus' }
        fromCompanyId: { type: [string, 'null'] }
        toCompanyIds:
          type: array
          items: { type: string }
        responseRequired: { type: boolean }
        dueDate: { type: [string, 'null'], format: date, description: 'When a response is due' }
        eventDate:
          {
            type: [string, 'null'],
            format: date,
            description: 'The event the notice is about; starts the time bar',
