        answer: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/NovaCitation' }
        closestMatches:
          description: When not found, the nearest passages so the user can check themselves.
          type: array
          items: { $ref: '#/components/schemas/NovaSource' }
    NovaRfiDraft:
      type: object
      required:
        [
          runId,
          suggestionId,
          subject,
          question,
          discipline,
          references,
          gaps,
          unsupportedNumbers,
          similarRfis,
          suggestedAssigneeIds,
          drawing,
        ]
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: |
            The saved draft (`ais_`), private to the caller. Pass it as `aiSuggestionId` when creating the RFI,
            then decide it: `accepted` as is, `edited` when the person changed the draft, `rejected` when they
            raised nothing from it.
        subject: { type: string }
        question: { type: string }
        discipline:
          description: The consultant discipline that should answer; null when the note doesn't say enough.
          type: [string, 'null']
          enum:
            [
              architectural,
              structural,
              civil,
              hydraulic,
              mechanical,
              electrical,
              fire,
              landscape,
              interiors,
              survey,
              other,
              null,
            ]
        references:
          description: Drawings and spec clauses the question refers to, each with the words that make it relevant.
          type: array
          items: { $ref: '#/components/schemas/NovaCitation' }
        gaps:
          description: Details a complete RFI states that the note didn't give, for the form to prompt.
          type: array
          items: { type: string, enum: [location, drawing_reference, proposed_solution, impact] }
        unsupportedNumbers:
          description: Numbers in the subject or question found in neither the note nor a cited passage.
          type: array
          items: { type: string }
        similarRfis:
          description: RFIs already raised on this project on the same subject, best match first.
          type: array
          items:
            type: object
            required: [id, number, subject, status]
            properties:
              id: { type: string, description: The RFI (`rfi_`) }
              number:
                { type: [string, 'null'], description: As the register shows it, e.g. RFI-014 }
              subject: { type: string }
              status: { type: string, enum: [open, answered, closed] }
        suggestedAssigneeIds:
          description: People (`usr_`) asked the most similar RFIs. The person picks the assignee.
          type: array
          items: { type: string }
        drawing:
          description: The marked sheet and where to pin the RFI; null when the draft came from a note alone.
          type: [object, 'null']
          required: [drawingRevisionId, sheetNumber, title, rev, pin, scanned]
          properties:
            drawingRevisionId: { type: string }
            sheetNumber: { type: string }
            title: { type: string }
            rev: { type: string }
            pin:
              type: object
              required: [x, y]
              properties:
                x:
                  { type: number, minimum: 0, maximum: 1, description: Normalised, origin top-left }
                y: { type: number, minimum: 0, maximum: 1 }
            scanned:
              type: boolean
              description: The sheet was read with OCR, so the person should check the quoted text against the drawing.
    NovaRfiAnswerDraft:
      type: object
      required:
        [
          runId,
          suggestionId,
          rfiId,
          answer,
          basis,
          needsDecision,
          references,
          unsupportedNumbers,
          attachments,
        ]
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: |
            The saved draft (`ais_`), private to the caller. Pass it as `aiSuggestionId` when sending the response,
            then decide it: `accepted` as is, `edited` when the person changed the draft, `rejected` when they sent
            something else.
        rfiId: { type: string, description: The RFI (`rfi_`) }
        answer: { type: string, description: The response, written as the person answering. }
        basis:
          description: |
            What the draft rests on: `documents` when it cites at least one passage, `direction` when it cites none but
            the person gave a direction, `none` when nothing supports it.
          type: string
          enum: [documents, direction, none]
        needsDecision:
          description: Points the thread, the direction and the documents leave open, for the person to settle before sending.
          type: array
          items: { type: string }
        references:
          description: Drawings, spec clauses and earlier RFIs the answer relies on, each with the words that support it.
          type: array
          items: { $ref: '#/components/schemas/NovaCitation' }
        unsupportedNumbers:
          description: Numbers in the answer found in none of the thread, the direction, the PDFs or a cited passage.
          type: array
          items: { type: string }
        attachments:
          description: Files attached to the responses that Nova looked at, newest first, and whether it could use each.
          type: array
          items:
            type: object
            required: [fileId, name, read]
            properties:
              fileId: { type: string }
              name: { type: string }
              read:
                type: boolean
                description: A photo was shown to Nova, or a PDF's text was read. A scan, a large photo or a file the caller can't open is not read.
    ImportEntity:
      type: string
      enum: [rfi, defect, drawing_register, company]
    NovaImportMapping:
      type: object
      required: [runId, suggestionId, entity, fields, columns, values, missingRequired]
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: The saved suggestion (`ais_`), private to the caller. Pass it when the import job starts, then decide it.
        entity: { $ref: '#/components/schemas/ImportEntity' }
        fields:
          description: The fields a column of this record can fill, for the screen to offer when the person changes a suggestion.
          type: array
          items:
            type: object
            required: [key, label, kind, required, values]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [text, number, date, enum, email, phone, abn] }
              required: { type: boolean }
              values:
                description: For `enum` fields, the values Archova stores; empty for the rest.
                type: array
                items:
                  type: object
                  required: [value, label]
                  properties:
                    value: { type: string }
                    label: { type: string }
        columns:
          description: One entry per column of the file, in order.
          type: array
          items:
            type: object
            required: [index, header, field, confidence, examples, warning]
            properties:
              index: { type: integer, minimum: 0 }
              header: { type: string }
              field:
                {
                  type: [string, 'null'],
                  description: A field key,
                  or null when the column isn't imported.,
                }
              confidence: { type: string, enum: [high, medium, low] }
              examples:
                description: The first distinct values in the file, for the person to check the suggestion against.
                type: array
                items: { type: string }
              warning:
                description: duplicate_field means another column fits that field better; unlike_values means the column's values don't look like that kind of field.
                type: [string, 'null']
                enum: [duplicate_field, unlike_values, null]
        values:
          description: For columns that fill a field with fixed values, what each value in the file means.
          type: array
          items:
            type: object
            required: [index, field, pairs]
            properties:
              index: { type: integer, minimum: 0 }
              field: { type: string }
              pairs:
                type: array
                items:
                  type: object
                  required: [source, value]
                  properties:
                    source: { type: string }
                    value:
                      {
                        type: [string, 'null'],
                        description: A value of the field,
                        or null when the person must choose.,
                      }
        missingRequired:
          description: Required fields that no column fills.
          type: array
          items: { type: string }
    NegotiationTurn:
      type: object
      additionalProperties: false
      required: [role, text]
      properties:
        role: { type: string, enum: [estimator, nova] }
        text: { type: string, minLength: 1, maxLength: 1500 }
    QuoteNegotiationAdvice:
      type: object
      required:
        [
          runId,
          stance,
          gap,
          reply,
          points,
          levers,
          counterExGst,
          counterReason,
          draftMessage,
          notes,
          history,
          disclaimer,
        ]
      properties:
        runId: { type: string }
        stance: { type: string, enum: [above, within, below, no_reference] }
        gap:
          type: object
          required: [against, referenceExGst, differenceExGst, percent, stance]
          properties:
            against: { type: [string, 'null'], enum: [target, median, null] }
            referenceExGst: { type: [string, 'null'] }
            differenceExGst:
              { type: [string, 'null'], description: Quote minus reference; negative when under. }
            percent: { type: [number, 'null'] }
            stance: { type: string, enum: [above, within, below, no_reference] }
        reply: { type: string }
        points:
          type: array
          items:
            type: object
            required: [scopeKey, text]
            properties:
              scopeKey: { type: [string, 'null'] }
              text: { type: string }
        levers: { type: array, items: { type: string } }
        counterExGst: { type: [string, 'null'] }
        counterReason: { type: string }
        draftMessage: { type: [string, 'null'] }
        notes: { type: array, items: { type: string } }
        history: { type: array, items: { $ref: '#/components/schemas/NegotiationTurn' } }
        disclaimer: { type: string }
    NovaTakeoffDetection:
      type: object
      required: [runId, revisionId, kind, what, scanned, caveat, dropped, items]
      properties:
        runId: { type: string }
        revisionId: { type: string }
        kind: { $ref: '#/components/schemas/TakeoffKind' }
        what: { type: string }
        scanned:
          {
            type: boolean,
            description: The sheet is a scan; confidence is capped and every mark needs a look.,
          }
        caveat: { type: [string, 'null'], description: Anything that stopped a full answer. }
        dropped:
          {
            type: integer,
            description: Items software removed (off the sheet,
            wrong shape,
            repeat).,
          }
        items:
          type: array
          items:
            type: object
            required: [place, points, confidence, note]
            properties:
              place: { type: [string, 'null'] }
              points:
                type: array
                items:
                  type: object
                  required: [x, y]
                  properties:
                    x: { type: number }
                    y: { type: number }
              confidence: { type: number, minimum: 0, maximum: 1 }
              note: { type: [string, 'null'] }
    ContractType:
      type: string
      enum: [head_contract, subcontract, consultant_agreement]
    ContractPlaybookTopic:
      type: object
      additionalProperties: false
      required: [key, topic, position, threshold, severity, fallback]
      properties:
        key: { type: string, pattern: '^[a-z0-9_]{1,40}$' }
        topic: { type: string, minLength: 1, maxLength: 120 }
        position:
          {
            type: string,
            minLength: 1,
            maxLength: 600,
            description: The builder's preferred position,
            in their words.,
          }
        threshold: { type: [string, 'null'], maxLength: 120 }
        severity:
          {
            type: string,
            enum: [high, medium, low],
            description: How serious a departure from the position is.,
          }
        fallback:
          description: Wording the builder's lawyer approved. The only wording Nova offers for a flagged clause.
          oneOf:
            - type: object
              additionalProperties: false
              required: [title, wording, approvedBy, approvedOn, reviewBy]
              properties:
                title: { type: string, minLength: 1, maxLength: 160 }
                wording: { type: string, minLength: 1, maxLength: 4000 }
                approvedBy: { type: string, minLength: 1, maxLength: 160 }
                approvedOn: { type: string, format: date }
                reviewBy: { type: [string, 'null'], format: date }
            - type: 'null'
    ContractPlaybook:
      type: object
      required: [contractType, topics]
      properties:
        contractType: { $ref: '#/components/schemas/ContractType' }
        topics:
          type: array
          items: { $ref: '#/components/schemas/ContractPlaybookTopic' }
    ContractSourceRef:
      type: object
      required: [page, clause, quote]
      properties:
        page: { type: integer, minimum: 1 }
        clause: { type: [string, 'null'], description: The clause number as printed. }
        quote: { type: string, description: Words found on that page. }
    NovaContractReview:
      type: object
      required:
        - runId
        - suggestionId
        - disclaimer
        - fileId
        - fileName
        - contractType
        - ourSide
        - baseForm
        - multiState
        - playbookMissing
        - playbookTopics
        - pageCount
        - unreadPages
        - truncated
        - summary
        - summaryNotFound
        - timeBars
        - flags
        - dropped
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId: { type: string, description: The saved suggestion (`ais_`). }
        disclaimer:
          type: string
          description: Fixed wording shown at the top of the review and on every export. Never dismissed.
        fileId: { type: string }
        fileName: { type: string }
        contractType: { $ref: '#/components/schemas/ContractType' }
        ourSide: { type: string, enum: [we_pay, we_get_paid] }
        baseForm: { type: [string, 'null'] }
        multiState:
          type: boolean
          description: The contract covers more than one state, so statutory checks are for a person.
        playbookMissing:
          {
            type: boolean,
            description: No playbook for this contract type,
            so no departures were looked for.,
          }
        playbookTopics: { type: integer, minimum: 0 }
        pageCount: { type: integer, minimum: 1 }
        unreadPages:
          type: array
          description: Pages with no text layer. Nova did not read them, so it may have missed clauses on them.
          items: { type: integer, minimum: 1 }
        truncated:
          { type: boolean, description: Pages were cut or left out to stay inside the limits. }
        summary:
          type: array
          items:
            type: object
            required: [key, text, source]
            properties:
              key:
                type: string
                enum:
                  - parties
                  - contract_sum
                  - start_date
                  - practical_completion
                  - security
                  - retention
                  - defects_period
                  - insurance
                  - liquidated_damages
              text: { type: string }
              source: { $ref: '#/components/schemas/ContractSourceRef' }
        summaryNotFound:
          type: array
          description: Key terms Nova did not find, shown as "Not found in this contract".
          items: { type: string }
        timeBars:
          type: array
          items:
            type: object
            required: [event, period, days, dayType, source]
            properties:
              event:
                type: string
                enum: [delay_notice, eot_claim, variation, payment_claim, dispute, other]
              period: { type: string, description: The contract's own words. }
              days: { type: [integer, 'null'] }
              dayType: { type: string, enum: [business, calendar, unclear] }
              source: { $ref: '#/components/schemas/ContractSourceRef' }
        flags:
          type: array
          description: Highest severity first. Each cites its clause.
          items:
            type: object
            required:
              [
                topicKey,
                topic,
                severity,
                finding,
                source,
                position,
                threshold,
                approvedWording,
                wordingStatus,
              ]
            properties:
              topicKey: { type: string }
              topic: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              finding: { type: string }
              source: { $ref: '#/components/schemas/ContractSourceRef' }
              position: { type: string, description: The builder's own position for the topic. }
              threshold: { type: [string, 'null'] }
              approvedWording:
                description: From the playbook fallback only, never written by Nova.
                oneOf:
                  - type: object
                    required: [title, wording, approvedBy, approvedOn, label, approvalNote]
                    properties:
                      title: { type: string }
                      wording: { type: string }
                      approvedBy: { type: string }
                      approvedOn: { type: string, format: date }
                      label: { type: string, description: Shown with the wording. }
                      approvalNote:
                        {
                          type: string,
                          description: Says the approver is as recorded by an org admin and not checked by Archova. Shown with the approver's name.,
                        }
                  - type: 'null'
              wordingStatus:
                description: none means refer to your lawyer; review_due means the approved wording is past its review date.
                type: string
                enum: [offered, review_due, none]
        dropped:
          type: object
          description: What code removed from Nova's answer.
          required: [notOnPage, bannedWords, unknownTopic]
          properties:
            notOnPage: { type: integer, minimum: 0 }
            bannedWords: { type: integer, minimum: 0 }
            unknownTopic: { type: integer, minimum: 0 }
    NovaQuoteReading:
      type: object
      required:
        - runId
        - suggestionId
        - packageId
        - fileId
        - pageCount
        - scannedPages
        - skippedPages
        - truncated
        - reference
        - validUntil
        - prices
        - lines
        - exclusions
        - qualifications
        - statedTotalExGst
        - linesTotalExGst
        - discountsExGst
        - totalCheck
        - difference
        - dropped
        - warnings
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: The saved suggestion (`ais_`), private to the caller. Pass it as `aiSuggestionId` when saving the quote, then decide it.
        packageId: { type: string }
        fileId: { type: string }
        pageCount: { type: integer, minimum: 1 }
        scannedPages:
          description: Pages read by OCR rather than the PDF text layer; check these against the PDF.
          type: array
          items: { type: integer, minimum: 1 }
        skippedPages:
          description: Pages Nova did not read (no text even after OCR, or beyond the limits).
          type: array
          items: { type: integer, minimum: 1 }
        truncated:
          {
            type: boolean,
            description: A page was cut,
            or later pages left out,
            to stay inside the limits.,
          }
        reference: { type: [string, 'null'] }
        validUntil: { type: [string, 'null'], format: date }
        prices:
          description: Whether the amounts on the lines include GST, as the quote says.
          type: string
          enum: [exclude_gst, include_gst, unclear]
        lines:
          type: array
          items:
            type: object
            required:
              [description, scopeKey, quantity, unit, rate, amount, isProvisional, source, warning]
            properties:
              description: { type: string }
              scopeKey: { type: [string, 'null'], description: A scope line of the package. }
              quantity: { type: [string, 'null'] }
              unit: { type: string }
              rate: { type: [string, 'null'] }
              amount: { type: string, description: Decimal AUD as printed on the quote }
              isProvisional: { type: boolean }
              source: { oneOf: [{ $ref: '#/components/schemas/QuoteSourceRef' }, { type: 'null' }] }
              warning:
                description: source_not_found means the words are on no page; amount_not_on_page means the amount is not printed on the line's page.
                type: [string, 'null']
                enum: [source_not_found, amount_not_on_page, null]
        exclusions: { $ref: '#/components/schemas/NovaQuoteNotes' }
        qualifications: { $ref: '#/components/schemas/NovaQuoteNotes' }
        statedTotalExGst:
          type: [string, 'null']
          description: The quote's total ex GST when it prints one that is on a page.
        linesTotalExGst: { type: string, description: The lines added up by code. }
        discountsExGst:
          {
            type: string,
            description: Discounts and credits the quote takes off the lines (listed under qualifications).,
          }
        totalCheck:
          description: differs means the lines, less any discounts, do not add up to the printed total, so a line was missed or misread.
          type: string
          enum: [matches, differs, not_stated]
        difference:
          {
            type: [string, 'null'],
            description: Lines total less discounts,
            minus the printed total.,
          }
        dropped:
          {
            type: integer,
            minimum: 0,
            description: Items left out for having no readable amount or repeating another.,
          }
        warnings:
          type: array
          items:
            type: string
            enum:
              - prices_include_gst
              - total_differs
              - stated_total_not_on_page
              - discounts_as_qualifications
              - items_dropped
    NovaQuoteNotes:
      type: array
      items:
        type: object
        required: [text, scopeKey, source, warning]
        properties:
          text: { type: string }
          scopeKey: { type: [string, 'null'] }
          source: { oneOf: [{ $ref: '#/components/schemas/QuoteSourceRef' }, { type: 'null' }] }
          warning: { type: [string, 'null'], enum: [source_not_found, null] }
    NovaDefectTag:
      type: object
      required:
        [
          runId,
          suggestionId,
          title,
          description,
          trade,
          alternativeTrades,
          category,
          priority,
          gaps,
          unsupportedNumbers,
          suggestedCompanies,
          duplicates,
          drawing,
        ]
      properties:
        runId: { type: string, description: For feedback (`air_`) }
        suggestionId:
          type: string
          description: |
            The saved suggestion (`ais_`), private to the caller. Pass it as `aiSuggestionId` when creating the
            defect, then decide it: `accepted` as is, `edited` when the person changed Nova's tags, `rejected` when
            they raised nothing from it.
        title: { type: string }
        description: { type: string }
        trade:
          description: The trade most likely responsible, as a defect stores it; null when the photo doesn't show enough.
          type: [string, 'null']
        alternativeTrades:
          description: Up to two other trades that could own it, most likely first.
          type: array
          items: { type: string }
        category:
          description: The kind of defect, as a defect stores it; null when none fits.
          type: [string, 'null']
        priority: { $ref: '#/components/schemas/DefectPriority' }
        gaps:
          description: What Nova couldn't settle, for the form to prompt.
          type: array
          items: { type: string, enum: [location, trade, photo_unclear] }
        unsupportedNumbers:
          description: Numbers in the title or description found in neither the note nor the sheet text.
          type: array
          items: { type: string }
        suggestedCompanies:
          description: Companies on the project that list the trade, then an alternative. The person picks the assignee.
          type: array
          items:
            type: object
            required: [id, name, trade]
            properties:
              id: { type: string, description: The company (`cmp_`) }
              name: { type: string }
              trade: { type: string, description: The suggested trade the company matched }
        duplicates:
          description: Open defects already pinned beside this spot, nearest first.
          type: array
          items:
            type: object
            required: [id, numberLabel, title, status, trade, distance, sameTrade]
            properties:
              id: { type: string, description: The defect (`dfx_`) }
              numberLabel: { type: string, description: 'DEF-0042' }
              title: { type: string }
              status: { $ref: '#/components/schemas/DefectStatus' }
              trade: { type: [string, 'null'] }
              distance: { type: number, description: From the pin, as a fraction of the sheet }
              sameTrade: { type: boolean }
        drawing:
          description: The sheet the pin is on; null when the defect wasn't pinned.
          type: [object, 'null']
          required: [drawingRevisionId, sheetNumber, title, rev, pin, nearby, scanned]
          properties:
            drawingRevisionId: { type: string }
            sheetNumber: { type: string }
            title: { type: string }
            rev: { type: string }
            pin:
              type: object
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
            nearby:
              description: The sheet's own text near the pin, nearest first, which the title may name.
              type: array
              items: { type: string }
            scanned:
              type: boolean
              description: The sheet was read with OCR, so the person should check the text against the drawing.
    NovaDrawingChange:
      type: object
      required: [id, kind, before, after, titleBlock, x, y]
      properties:
        id: { type: string, description: Cited by items, e.g. c3 }
        kind: { type: string, enum: [added, removed, changed] }
        before: { type: [string, 'null'] }
        after: { type: [string, 'null'] }
        titleBlock: { type: boolean }
        x: { type: number, minimum: 0, maximum: 1, description: Normalised, origin top-left }
        y: { type: number, minimum: 0, maximum: 1 }
    NovaDrawingCompare:
      type: object
      required:
        [
          runId,
          revisionId,
          againstRevisionId,
          sheetNumber,
          fromRev,
          toRev,
          headline,
          items,
          changes,
          unexplainedChangeIds,
          truncated,
          scanned,
          affectedRfis,
          visual,
        ]
      properties:
        runId:
          description: For feedback (`air_`); null when no text changed.
          type: [string, 'null']
        revisionId: { type: string }
        againstRevisionId: { type: string, description: The revision this one superseded }
        sheetNumber: { type: string }
        fromRev: { type: string }
        toRev: { type: string }
        headline: { type: string }
        items:
          type: array
          items:
            type: object
            required: [text, changeIds]
            properties:
              text: { type: string }
              changeIds: { type: array, items: { type: string } }
        changes:
          type: array
          items: { $ref: '#/components/schemas/NovaDrawingChange' }
        unexplainedChangeIds:
          description: Changes no item describes; show them as found.
          type: array
          items: { type: string }
        truncated: { type: boolean, description: More changes were found than listed }
        scanned:
          { type: boolean, description: A sheet was read with OCR; check against the drawing }
        visual:
          description: |
            The linework half of the compare. Null where the deployment can't render drawing pages.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NovaVisualCompare'
        affectedRfis:
          type: array
          items:
            type: object
            required: [id, number, subject, status, nearChange]
            properties:
              id: { type: string }
              number: { type: [string, 'null'] }
              subject: { type: string }
              status: { type: string, enum: [open, answered] }
              nearChange: { type: boolean, description: A change sits near the RFI's pin }
    NovaVisualCompare:
      type: object
      required: [runId, reliable, reason, truncated, regions]
      properties:
        runId:
          description: For feedback (`air_`); null when there was nothing to describe.
          type: [string, 'null']
        reliable:
          description: |
            False when the two renders couldn't be compared line for line (see `reason`); `regions` is then empty and
            says nothing about whether the linework changed.
          type: boolean
        reason:
          description: |
            Why not reliable. `different_size`: the sheets are different shapes. `too_different`: most of the sheet
            changed, so it was redrawn rather than revised. `blank`: a render came out empty. `render_failed`,
            `allowance_used` and `unavailable`: the pass could not run this time; opening the compare again retries.
          type: [string, 'null']
          enum:
            [different_size, too_different, blank, render_failed, allowance_used, unavailable, null]
        truncated:
          { type: boolean, description: More places were found than listed (the biggest are kept) }
        regions:
          type: array
          items: { $ref: '#/components/schemas/NovaVisualRegion' }
    NovaVisualRegion:
      type: object
      required: [id, x0, y0, x1, y1, kind, summary, described, what, cloud, changeIds]
      properties:
        id: { type: string, description: 'r1 is the place with the most changed lines' }
        x0: { type: number, description: Left edge on the new sheet (0 to 1 from the left) }
        y0: { type: number, description: Top edge on the new sheet (0 to 1 from the top) }
        x1: { type: number }
        y1: { type: number }
        kind:
          description: Lines only on the new sheet, only on the old sheet, or both.
          type: string
          enum: [added, removed, changed]
        summary: { type: string }
        described:
          description: False when `summary` is the plain sentence software wrote because Nova's was missing or failed the checks.
          type: boolean
        what:
          type: [string, 'null']
          enum:
            [
              wall_or_structure,
              opening,
              fixture_or_services,
              dimension_or_note,
              hatch_or_finish,
              symbol_or_tag,
              other,
              null,
            ]
        cloud:
          description: Whether Nova saw a revision cloud or triangle marking the change on the new sheet. Not checked by software; null when not described.
          type: [string, 'null']
          enum: [yes, no, unclear, null]
        changeIds:
          description: Text changes (`changes[].id`) that sit in or next to this place.
          type: array
          items: { type: string }
    NovaIndexReport:
      type: object
      required:
        [
          indexed,
          unchanged,
          noText,
          ocrPages,
          unsupported,
          chunks,
          rfisIndexed,
          rfisUnchanged,
          defectsIndexed,
          defectsUnchanged,
          diaryIndexed,
          diaryUnchanged,
        ]
      properties:
        diaryIndexed:
          description: Submitted and signed-off diary days indexed in this run (new or changed).
          type: integer
        diaryUnchanged:
          description: Diary days already indexed at their current text.
          type: integer
        defectsIndexed:
          { type: integer, description: Issued defects indexed in this run (new or changed) }
        defectsUnchanged:
          { type: integer, description: Issued defects already indexed at their current text }
        rfisIndexed:
          {
            type: integer,
            description: Sent RFIs indexed in this run (new,
            or changed since the last run),
          }
        rfisUnchanged:
          { type: integer, description: Sent RFIs already indexed at their current text }
        indexed: { type: integer }
        unchanged: { type: integer }
        noText:
          description: Revisions with no text, even after OCR (blank pages, photos, drawings with no words).
          type: integer
        ocrPages: { type: integer, description: Scanned pages read with OCR in this run }
        unsupported: { type: integer, description: Files that aren't PDFs }
        chunks: { type: integer }
