openapi: 3.1.0
info:
  title: Archova API
  version: 1.0.0
  description: |
    Contract-first source of truth for the Archova API (ADR-0002). Server validation, TypeScript types,
    zod schemas and the web/mobile api-client are generated from this file with `pnpm gen`.

    Standard behaviours (docs/architecture/api.md §3): prefixed UUIDv7 ids, cursor pagination,
    RFC 9457 problem responses with a stable `code`, ETag/If-Match on updates, Idempotency-Key on POST.
servers:
  - url: https://app.{domain}
    description: Browser (same-origin, `__Host-sid` cookie only)
    variables:
      domain: { default: example.com }
  - url: https://api.{domain}
    description: Mobile, public API and integrations (bearer only)
    variables:
      domain: { default: example.com }
tags:
  - name: auth
  - name: me
  - name: orgs
  - name: projects
  - name: companies
  - name: access
  - name: billing
  - name: files
  - name: oauth
  - name: documents
  - name: ai
  - name: rfis
  - name: correspondence
  - name: defects
  - name: financials
  - name: quality
  - name: safety
  - name: estimating
  - name: integrations
  - name: sync
  - name: diary
  - name: workforce
  - name: scheduling
  - name: meetings
paths:
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      x-module: identity
      x-auth: none
      summary: Create an account with email and password and start a web session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created; `__Host-sid` and `__Host-csrf` cookies set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      x-module: identity
      x-auth: none
      summary: Sign in with email and password and start a web session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in; `__Host-sid` and `__Host-csrf` cookies set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-module: identity
      summary: Revoke the current session.
      responses:
        '204': { description: Signed out }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      x-module: identity
      summary: The current session, with a fresh CSRF token for cookie clients.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/api-tokens:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listApiTokens
      tags: [api-tokens]
      x-module: identity
      x-internal: true
      summary: >-
        Personal access tokens in the organisation. A member sees their own; an owner or admin sees everyone's. The
        secret is never returned again after creation.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createApiToken
      tags: [api-tokens]
      x-module: identity
      x-internal: true
      summary: >-
        Create a personal access token for the public API (integrations/06). Needs a signed-in session, not another
        token. The secret is in the response once. A token works in this organisation only and never does more than
        its owner may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiTokenRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/api-tokens/{apiTokenId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ApiTokenId'
    delete:
      operationId: revokeApiToken
      tags: [api-tokens]
      x-module: identity
      x-internal: true
      summary: Revoke a token at once. A member can revoke their own; an owner or admin can revoke any.
      responses:
        '204':
          description: Revoked
        default: { $ref: '#/components/responses/Problem' }
  /v1/oauth/authorize:
    get:
      operationId: oauthAuthorize
      tags: [oauth]
      x-module: identity
      x-auth: none
      x-internal: true
      summary: OAuth 2.1 authorisation endpoint (code + PKCE S256) for first-party mobile clients.
      description: |
        Requires a signed-in web session on `app.<domain>`. Redirects to the client's registered redirect URI
        with `code` and `state`. Unauthenticated users are redirected to the web sign-in page.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - {
            name: code_challenge,
            in: query,
            required: true,
            schema: { type: string, minLength: 43, maxLength: 128 },
          }
        - {
            name: code_challenge_method,
            in: query,
            required: true,
            schema: { type: string, enum: [S256] },
          }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        '302': { description: Redirect to the client with an authorisation code }
        default: { $ref: '#/components/responses/Problem' }
  /v1/oauth/token:
    post:
      operationId: oauthToken
      tags: [oauth]
      x-module: identity
      x-auth: none
      summary: Exchange an authorisation code or rotate a refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/oauth/revoke:
    post:
      operationId: oauthRevoke
      tags: [oauth]
      x-module: identity
      x-auth: none
      summary: Revoke a refresh token and its session (RFC 7009).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/RevokeRequest' }
      responses:
        '200': { description: Revoked (also returned for unknown tokens) }
        default: { $ref: '#/components/responses/Problem' }
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [oauth]
      x-module: identity
      x-auth: none
      summary: Public keys for verifying access tokens.
      responses:
        '200':
          description: JWK set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      x-module: platform
      summary: The current user and every org they can open.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      x-module: platform
      summary: Create an organisation. The caller becomes its owner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrgRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getOrg
      tags: [orgs]
      x-module: platform
      responses:
        '200':
          description: The organisation
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/support-access:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getSupportAccess
      tags: [orgs]
      x-module: platform
      summary: Support access grants and the support sessions held under them (org owners and admins).
      responses:
        '200':
          description: Grants and sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/staff-actions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listStaffActions
      tags: [orgs]
      x-module: platform
      summary: Account actions Archova staff took on this organisation (org owners and admins).
      description: |
        Trial extensions, plan changes, suspension, reactivation and Nova credit grants, newest first. Each row names
        the support ticket but never the staff member or the internal reason.
      responses:
        '200':
          description: Staff actions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StaffAction' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/support-access/banner:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getSupportBanner
      tags: [orgs]
      x-module: platform
      summary: Whether an Archova support session is open now. Every signed-in user of the company sees the banner.
      responses:
        '200':
          description: Banner state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportBanner' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/support-access/grants:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: createSupportAccessGrant
      tags: [orgs]
      x-module: platform
      summary: Let Archova support view this organisation for a limited time (off by default).
      description: |
        A one-time grant is tied to a support ticket and lasts up to 72 hours. It is view-only. Support staff
        then start sessions of at most one hour inside it. Only org owners and admins can grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportAccessGrantRequest' }
      responses:
        '201':
          description: The grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccessGrant' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/support-access/grants/{grantId}/revoke:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: grantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revokeSupportAccessGrant
      tags: [orgs]
      x-module: platform
      summary: Take support access back. Open support sessions end at once.
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  /v1/public/price-book:
    get:
      operationId: getPublicPriceBook
      tags: [billing]
      x-module: billing
      x-auth: none
      summary: The published price book for the pricing page. Never returns a draft.
      responses:
        '200':
          description: The live price book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPriceBook' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/entitlements:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getEntitlements
      tags: [billing]
      x-module: billing
      summary: Modules and limits this org is licensed for (X23).
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/feature-flags:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getFeatureFlags
      tags: [platform]
      x-module: platform
      summary: Which feature flags are on for this org (backend 09 §5).
      description: |
        Evaluated on the server from the owner console's rules (all orgs, this org, its pilot cohorts, a rollout
        share). A flag launches a feature; it never makes an unlicensed module reachable, so clients check
        `getEntitlements` as well. Every registry flag appears, off unless a rule turns it on.
      responses:
        '200':
          description: Flags for this org
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlags' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listProjects
      tags: [projects]
      x-module: platform
      summary: Projects the caller can see in this org.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createProject
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.read
      responses:
        '200':
          description: The project
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateProject
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.update
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/key-dates:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getKeyDates
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.read
      summary: The project's key dates (X46, product/08 S1); all empty with version 0 until first saved.
      responses:
        '200':
          description: Key dates
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyDates' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateKeyDates
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.update
      summary: Change key dates. Send `If-Match` (`"0"` before the first save). Moving a target that was already set needs `reason`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKeyDatesRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyDates' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/key-dates/changes:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listKeyDateChanges
      tags: [projects]
      x-module: platform
      x-permission: platform.projects.read
      summary: History of key date changes, newest first (at most 200).
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyDateChangeList' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/delay-register:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getDelayRegister
      tags: [scheduling]
      # Gated like the diary it mostly reads; `scheduling` is not a plan feature yet.
      x-module: diary
      x-permission: diary.entries.read
      summary: Delays in one list (SCH-AC2) - diary delays, RFIs with a schedule impact and RFIs answered late. Builder staff only; RFI rows only for people who can read RFIs.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - {
            name: cause,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/DiaryDelayType' },
          }
        - { name: source, in: query, required: false, schema: { type: string, enum: [diary, rfi] } }
        - {
            name: eotOnly,
            in: query,
            required: false,
            schema: { type: string, enum: ['true', 'false'] },
          }
      responses:
        '200':
          description: The register, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelayRegister' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectMembers
      tags: [projects]
      x-module: platform
      x-permission: platform.project_members.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of project members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addProjectMember
      tags: [projects]
      x-module: platform
      x-permission: platform.project_members.manage
      summary: Add an existing user to the project with a company and permission template.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProjectMemberRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/members/{memberId}/remove:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - {
          name: memberId,
          in: path,
          required: true,
          schema: { type: string, pattern: '^pmb_[0-9A-Za-z]{26}$' },
        }
    post:
      operationId: removeProjectMember
      tags: [projects]
      x-module: platform
      x-permission: platform.project_members.manage
      summary: End a person's access to the project, saying how (X38).
      description: |
        `ordinary` lets their phone send the work it had queued before access ended (held for an admin to accept or
        reject); `for_cause` and `wipe_now` do not. Adding the person again starts a new access episode.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveProjectMemberRequest' }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/projects/{projectId}/permissions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectPermissions
      tags: [access]
      x-module: access
      summary: The caller's effective permissions on this project, for hiding UI.
      responses:
        '200':
          description: Effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/permission-templates:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listPermissionTemplates
      tags: [access]
      x-module: access
      x-permission: access.templates.read
      responses:
        '200':
          description: Permission templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionTemplate' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/companies:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listCompanies
      tags: [companies]
      x-module: platform
      x-permission: platform.companies.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of companies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCompany
      tags: [companies]
      x-module: platform
      x-permission: platform.companies.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/orgs/{orgId}/uploads:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: createUpload
      tags: [files]
      x-module: files
      summary: Start an upload. Returns a presigned URL; the file goes straight to storage, never through the API.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        default: { $ref: '#/components/responses/Problem' }
