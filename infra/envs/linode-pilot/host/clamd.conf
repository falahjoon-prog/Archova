# clamd for the api's INSTREAM scans (modules/files ClamAV adapter). Uploads may be up to 5 GB (backend 06), but
# ClamAV can't scan anything 4 GB or larger, so files from 4000 MB up come back "size limit exceeded" and the api
# treats them as unscannable (fails closed). docs/infrastructure/10-linode-option.md has the details.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 4000M
MaxFileSize 4000M
MaxScanSize 4000M
MaxThreads 4
ReadTimeout 120
LogTime yes
AlertEncrypted no
AlertBrokenExecutables yes
