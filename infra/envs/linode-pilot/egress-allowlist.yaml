# Egress allow-list for the Linode option's app servers (api, web, backup), infrastructure/10, X25, X28, X44.
#
# On Linode there is no Network Firewall: each server runs an allow-list DNS resolver (host/coredns), generated from
# this file by `pnpm infra:linode-corefile`, and every container uses it. A host that isn't listed doesn't resolve.
# Bedrock IAM (aws.tf) and `pnpm check:boundaries` are the other two layers. The managed Postgres hostname is added
# at deploy time from the Terraform output. Changes need review from Jeff and Sam (and Ari for kind: ai);
# `pnpm check:egress` fails CI if an AI endpoint outside Australia is added.
#
# kind: ai | integration | platform
# AI entries must name the Australian region they run in.

restricted:
  # --- AI (X25: Australian endpoints only) ---
  - host: bedrock-runtime.ap-southeast-2.amazonaws.com
    kind: ai
    region: ap-southeast-2
    owner: Ari
    used_by: api, ai-worker
    reason: Default AI provider, AU inference profile only. Normally reached through the VPC endpoint; listed so a misrouted call still only works in Australia.
  - host: bedrock-runtime.ap-southeast-4.amazonaws.com
    kind: ai
    region: ap-southeast-4
    owner: Ari
    used_by: api, ai-worker
    reason: Melbourne half of the AU cross-region inference profile.
  - host: textract.ap-southeast-2.amazonaws.com
    kind: ai
    region: ap-southeast-2
    owner: Ari
    used_by: ai-worker
    reason: OCR, through the VPC endpoint.
  - host: sts.ap-southeast-2.amazonaws.com
    kind: platform
    owner: Jeff
    used_by: api, ai-worker
    reason: Assume a customer's BYO Bedrock role (X28); normally through the VPC endpoint.

  # --- Linode option platform hosts ---
  - host: rolesanywhere.ap-southeast-2.amazonaws.com
    kind: platform
    owner: Jeff
    used_by: api
    reason: Short-lived AWS credentials for Nova and SES from the server's client certificate (aws.tf).
  - host: email.ap-southeast-2.amazonaws.com
    kind: platform
    owner: Jeff
    used_by: api
    reason: SES in Sydney for transactional email.
  - host: ap-southeast-1.linodeobjects.com
    kind: platform
    owner: Jeff
    used_by: api, backup
    reason: Uploads bucket in Sydney. Confirm the endpoint with `linode-cli object-storage endpoints` before the first deploy.
  - host: au-mel-1.linodeobjects.com
    kind: platform
    owner: Jeff
    used_by: backup
    reason: Off-site backups bucket in Melbourne.

  - host: database.clamav.net
    kind: platform
    owner: Jeff
    used_by: clamav
    reason: ClamAV signature updates (freshclam), several times a day.

  # --- Integrations called from the api (Leo, Ben) ---
  - host: abr.business.gov.au
    kind: integration
    owner: Ben
    used_by: api
    reason: ABN Lookup web services (X44). GUID in archova/<env>/integrations/abr-guid.
  - host: identity.xero.com
    kind: integration
    owner: Leo
    used_by: api
    reason: Xero OAuth token exchange (L1).
  - host: secure.myob.com
    kind: integration
    owner: Leo
    used_by: api
    reason: MYOB OAuth token exchange.
  - host: login.microsoftonline.com
    kind: integration
    owner: Leo
    used_by: api
    reason: Microsoft 365 OAuth token exchange.
  - host: oauth2.googleapis.com
    kind: integration
    owner: Leo
    used_by: api
    reason: Google Workspace OAuth token exchange.

  # --- Platform services the api calls ---
  - host: api.stripe.com
    kind: platform
    owner: Sam
    used_by: api
    reason: Subscription billing (billing module). Payment data only, no project data.

  # --- BYO Azure OpenAI resources (X28): one exact hostname per approved connection, added only after Ari and
  # Sam confirm the resource is in australiaeast or australiasoutheast. Never a wildcard. Example:
  # - host: contoso-ae.openai.azure.com
  #   kind: ai
  #   region: australiaeast
  #   owner: Ari
  #   used_by: api, ai-worker
  #   reason: BYO Azure OpenAI for org <orgId>, approved by Ari and Sam on <date>.

# AI vendor domains (and every subdomain) that no subnet may resolve (DNS Firewall) and the private subnets may not
# reach (Network Firewall), so web, workers and webhook delivery can't be used as a side door. Approved hosts
# above still resolve: the allow rule is evaluated first.
ai_vendor_denylist:
  - openai.com
  - api.openai.com
  - chatgpt.com
  - oaiusercontent.com
  - openai.azure.com
  - anthropic.com
  - claude.ai
  - generativelanguage.googleapis.com
  - aiplatform.googleapis.com
  - gemini.google.com
  - cohere.com
  - cohere.ai
  - mistral.ai
  - huggingface.co
  - hf.space
  - together.xyz
  - together.ai
  - groq.com
  - perplexity.ai
  - deepseek.com
  - x.ai
  - replicate.com
  - fireworks.ai
  - openrouter.ai
  - cognitiveservices.azure.com
